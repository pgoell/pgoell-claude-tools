<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 Bar chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits (workshop layout grammar) ==== */
  /* 12-column grid: 96px columns, 48px gutters, 120px margins. */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--grid-cols), var(--grid-col));
    column-gap: var(--grid-gutter);
  }
  /* Title row: the title top left over 9 columns, the time box and
     group chips top right. The title talks to the room. */
  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: var(--grid-gutter);
  }
  h1 {
    font-family: var(--font-display);
    font-variation-settings: var(--font-display-settings);
    font-style: normal; font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  h1.action { font-size: var(--fs-h1); max-width: 1248px; }
  /* Panel: every block of content sits in its own warm panel with
     a large radius, never loose on the canvas. */
  .panel {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--r-2xl);
    padding: var(--panel-pad);
  }
  .panel.subtle { background: var(--bg-subtle); border-color: transparent; }
  /* Writing space: an empty panel the facilitator fills on the
     whiteboard or flip chart while the room talks. */
  .write {
    border: 4px dashed var(--border-strong);
    border-radius: var(--r-2xl);
    padding: var(--panel-pad);
    display: flex; flex-direction: column;
  }
  /* Chips: time box and group size, top right on activity slides.
     The time box is an ink pill (inverse surface), never the accent. */
  .chips { display: flex; gap: 16px; flex-shrink: 0; padding-top: 8px; }
  .chip {
    font-size: var(--fs-caption); font-weight: var(--weight-semibold);
    line-height: 1; padding: 18px 32px;
    border-radius: var(--r-pill);
    background: transparent; color: var(--fg);
    border: 3px solid var(--border-strong);
    white-space: nowrap;
  }
  .chip.time { background: var(--bg-inverse); color: var(--fg-inverse); border-color: var(--bg-inverse); }
  /* Step disc: a real step number in a real sequence only. */
  .disc {
    flex-shrink: 0;
    width: 88px; height: 88px; border-radius: 50%;
    border: 4px solid var(--fg);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-body); font-weight: var(--weight-bold);
    font-variant-numeric: tabular-nums lining-nums;
  }
  /* Footer: source line bottom left, only when the slide shows
     numbers. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 40px;
    font-size: var(--fs-micro);
    color: var(--fg-subtle);
  }
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Chart in a panel over 8 columns; the right 4 columns ask the
     room to place itself on the chart. */
  .s-bar .grid { flex: 1; margin-top: 56px; margin-bottom: 64px; }
  .s-bar .chartp { grid-column: 1 / span 8; display: flex; flex-direction: column; }
  .s-bar .chartp .sub {
    font-size: var(--fs-caption); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 0 0 40px;
  }
  .s-bar .ask { grid-column: 9 / span 4; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .s-bar .ask .q { font-size: var(--fs-body); font-weight: var(--weight-bold); line-height: var(--lh-snug); margin: 0; }
  .s-bar .ask .hint { font-size: var(--fs-caption); color: var(--fg-muted); line-height: var(--lh-snug); margin: 0; }
  .s-bar svg { display: block; overflow: visible; }
  .s-bar svg text { font-size: 36px; fill: var(--fg-muted); }
  .s-bar svg text.hi { fill: var(--fg); font-weight: var(--weight-bold); }
  .s-bar .bar { fill: var(--chart-context); }
  /* Accent job: marks the option the title names. */
  .s-bar .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-bar" data-screen-label="04 Bar chart">
    <div class="head">
      <h1 class="action">You keep most changes when you agree on just one</h1>
    </div>
    <div class="grid">
      <div class="panel chartp">
        <p class="sub">Changes still in place 4 weeks later, % by how many the team agreed</p>
        <svg class="chart" width="1000" height="440" role="img"
             aria-label="Changes still in place 4 weeks later: 78% with 1 change, 55% with 2, 41% with 3, 22% with 4 or more"
             data-chart="bar" data-orientation="horizontal" data-unit="%"
             data-labels='["1 change", "2 changes", "3 changes", "4 or more"]'
             data-series='[{"name": "Changes still in place after 4 weeks", "values": [78, 55, 41, 22]}]'
             data-highlight="0"></svg>
      </div>
      <div class="panel subtle ask">
        <p class="q">How many changes did your last retro agree?</p>
        <p class="hint">Hands up for 1, 2, 3, or 4 or more</p>
      </div>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: spring cohort survey, 64 teams, 2025</span>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-bar .chart');
    const d = chartData(el), v = d.series[0].values;
    const lx = 220, W = 620, rowH = 112, barH = 72, max = Math.max(...v);
    const fmt = x => x + '%';
    let out = '';
    v.forEach((val, i) => {
      const y = i * rowH, hi = i === d.highlight ? ' hi' : '';
      out += '<text class="' + hi + '" x="0" y="' + (y + barH / 2) + '" dominant-baseline="central">' + d.labels[i] + '</text>';
      out += '<rect class="bar' + hi + '" x="' + lx + '" y="' + y + '" width="' + (val / max * W) + '" height="' + barH + '" rx="12"/>';
      out += '<text class="' + hi + '" x="' + (lx + val / max * W + 24) + '" y="' + (y + barH / 2) + '" dominant-baseline="central">' + fmt(val) + '</text>';
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
