<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 Process steps</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits (workshop layout grammar) ==== */
  /* 12-column grid: 96px columns, 48px gutters, 120px margins. */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--grid-cols), var(--grid-col));
    column-gap: var(--grid-gutter);
  }
  /* Title row: the title top left over 9 columns, the time box and
     group chips top right. The title talks to the room. */
  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: var(--grid-gutter);
  }
  h1 {
    font-family: var(--font-display);
    font-variation-settings: var(--font-display-settings);
    font-style: normal; font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  h1.action { font-size: var(--fs-h1); max-width: 1248px; }
  /* Panel: every block of content sits in its own warm panel with
     a large radius, never loose on the canvas. */
  .panel {
    background: var(--bg-elev);
    border: 2px solid var(--border);
    border-radius: var(--r-2xl);
    padding: var(--panel-pad);
  }
  .panel.subtle { background: var(--bg-subtle); border-color: transparent; }
  /* Writing space: an empty panel the facilitator fills on the
     whiteboard or flip chart while the room talks. */
  .write {
    border: 4px dashed var(--border-strong);
    border-radius: var(--r-2xl);
    padding: var(--panel-pad);
    display: flex; flex-direction: column;
  }
  /* Chips: time box and group size, top right on activity slides.
     The time box is an ink pill (inverse surface), never the accent. */
  .chips { display: flex; gap: 16px; flex-shrink: 0; padding-top: 8px; }
  .chip {
    font-size: var(--fs-caption); font-weight: var(--weight-semibold);
    line-height: 1; padding: 18px 32px;
    border-radius: var(--r-pill);
    background: transparent; color: var(--fg);
    border: 3px solid var(--border-strong);
    white-space: nowrap;
  }
  .chip.time { background: var(--bg-inverse); color: var(--fg-inverse); border-color: var(--bg-inverse); }
  /* Step disc: a real step number in a real sequence only. */
  .disc {
    flex-shrink: 0;
    width: 88px; height: 88px; border-radius: 50%;
    border: 4px solid var(--fg);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-body); font-weight: var(--weight-bold);
    font-variant-numeric: tabular-nums lining-nums;
  }
  /* Footer: source line bottom left, only when the slide shows
     numbers. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 40px;
    font-size: var(--fs-micro);
    color: var(--fg-subtle);
  }
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* A real method as one connected path: numbered stations on a
     gentle wave, labels outside the wave, minutes under each label. */
  .s-proc .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; margin-bottom: 56px; }
  .s-proc svg { display: block; overflow: visible; }
  .s-proc .route { stroke: var(--border-strong); stroke-width: 12; fill: none; stroke-linecap: round; }
  .s-proc .node { fill: var(--bg-elev); stroke: var(--fg); stroke-width: 5; }
  .s-proc text { font-family: var(--font-sans); text-anchor: middle; }
  .s-proc .n { font-size: 44px; font-weight: 700; fill: var(--fg); font-variant-numeric: tabular-nums lining-nums; }
  .s-proc .lab { font-size: 36px; fill: var(--fg); font-weight: 600; }
  .s-proc .min { font-size: 30px; fill: var(--fg-muted); font-variant-numeric: tabular-nums lining-nums; }
  /* Accent job: marks the step the room practises today. */
  .s-proc .cur .node { fill: var(--accent); stroke: var(--accent); }
  .s-proc .cur .n { fill: var(--accent-fg); }
  .s-proc .note { font-size: var(--fs-caption); color: var(--fg-muted); margin: 16px 0 0; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-proc" data-screen-label="09 Process steps">
    <div class="head">
      <h1 class="action">Every retro you run moves through the same five steps</h1>
    </div>
    <div class="stage">
      <svg width="1680" height="630" viewBox="0 0 1680 630" role="img"
           aria-label="Five retro steps: 1 set the stage, 5 min; 2 gather data, 15 min; 3 generate insights, 20 min; 4 decide what to do, 15 min; 5 close the retro, 5 min. 60 minutes in all.">
        <path class="route" d="M140 250 C 300 250, 330 420, 490 420 S 680 250, 840 250 S 1030 420, 1190 420 S 1380 250, 1540 250"/>
        <g><circle class="node" cx="140" cy="250" r="60"/><text class="n" x="140" y="265">1</text>
          <text class="lab" x="140" y="58">Set the</text><text class="lab" x="140" y="100">stage</text><text class="min" x="140" y="146">5 min</text></g>
        <g class="cur"><circle class="node" cx="490" cy="420" r="60"/><text class="n" x="490" y="435">2</text>
          <text class="lab" x="490" y="530">Gather</text><text class="lab" x="490" y="572">data</text><text class="min" x="490" y="616">15 min</text></g>
        <g><circle class="node" cx="840" cy="250" r="60"/><text class="n" x="840" y="265">3</text>
          <text class="lab" x="840" y="58">Generate</text><text class="lab" x="840" y="100">insights</text><text class="min" x="840" y="146">20 min</text></g>
        <g><circle class="node" cx="1190" cy="420" r="60"/><text class="n" x="1190" y="435">4</text>
          <text class="lab" x="1190" y="530">Decide</text><text class="lab" x="1190" y="572">what to do</text><text class="min" x="1190" y="616">15 min</text></g>
        <g><circle class="node" cx="1540" cy="250" r="60"/><text class="n" x="1540" y="265">5</text>
          <text class="lab" x="1540" y="58">Close the</text><text class="lab" x="1540" y="100">retro</text><text class="min" x="1540" y="146">5 min</text></g>
      </svg>
      <p class="note">Today you practise step 2 with a silent start.</p>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: steps from Derby and Larsen, Agile Retrospectives, 2006; timings for a 60-minute retro</span>
    </div>
  </section>
</div>
</body>
</html>
