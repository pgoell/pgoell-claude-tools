<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sequence</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }

  /* ==== Shared grammar ==== */
  /* Action title: top left, 11 of 12 columns, at most two lines.
     Evidence always starts at --evidence-top, whatever the title
     length, so evidence never jumps between slides. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1582px;
    text-wrap: balance;
  }
  .evidence {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: var(--evidence-top); bottom: 112px;
  }
  /* Footer: source line bottom left, only on slides with numbers. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: var(--footer-bottom);
    font-size: var(--fs-micro); line-height: 1.3;
    color: var(--fg-subtle);
  }
  /* Identifiers (services, topics, tables, flags) in mono, never
     below 28px and never inside the action title. */
  .id, code { font-family: var(--font-mono); font-size: inherit; }
  .num, table, .chart { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== Diagram vocabulary (inline SVG) ==== */
  .dg { display: block; overflow: visible; }
  .dg text { font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--fg); }
  .dg text.mono { font-family: var(--font-mono); }
  .dg text.muted { fill: var(--fg-muted); }
  .dg text.subtle { fill: var(--fg-subtle); }
  .dg text.ink { fill: var(--accent-ink); font-weight: var(--weight-semibold); }
  .dg .n-svc { fill: var(--node-service-fill); stroke: var(--node-service); stroke-width: var(--stroke-node); }
  .dg .n-ds  { fill: var(--node-datastore-fill); stroke: var(--node-datastore); stroke-width: var(--stroke-node); }
  .dg .n-q   { fill: var(--node-queue-fill); stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-q-tick { stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-ext { fill: var(--node-external-fill); stroke: var(--node-external); stroke-width: var(--stroke-node); stroke-dasharray: var(--dash-external); }
  .dg .bnd   { fill: none; stroke: var(--node-boundary); stroke-width: var(--stroke-boundary); stroke-dasharray: var(--dash-boundary); }
  .dg .edge  { fill: none; stroke: var(--edge); stroke-width: var(--stroke-edge); stroke-linejoin: round; }
  .dg .edge.hl { stroke: var(--edge-highlight); stroke-width: var(--stroke-highlight); }
  .dg .edge.ret { stroke-dasharray: 10 8; }
  .dg .m-edge { fill: var(--edge); }
  .dg .m-hl { fill: var(--edge-highlight); }
  .dg .rule { stroke: var(--border-strong); stroke-width: 2; }

  /* ==== This slide ==== */
  .dg .life { stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 6 8; }
  .dg .frag { fill: var(--bg-subtle); stroke: var(--border); stroke-width: 2; }
  /* Message labels sit on a halo of the slide color so a lifeline
     running behind them never cuts the text. */
  .dg .lbl { paint-order: stroke; stroke: var(--bg); stroke-width: 10px; stroke-linejoin: round; }
  .dg .lbl.inf { stroke: var(--bg-subtle); }
  .dg .lbl .n { font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  /* Preview either scope: open the file with #light or #dark. */
  window.addEventListener('DOMContentLoaded', function () {
    const s = document.querySelector('.frame > section');
    if (location.hash === '#light') s.classList.remove('dark');
    if (location.hash === '#dark') s.classList.add('dark');
  });
</script>
</head>
<body>
<div class="frame">
<section class="dark" data-screen-label="Sequence">
  <h1 class="action">Checkout replies after 1 commit, with payment status pushed 1.8&nbsp;s later</h1>
  <div class="evidence">

<defs>

  <marker id="arr-hl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path class="m-hl" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="frag" x="0" y="124" width="1728" height="236" rx="8"/>
<text class="muted lbl inf" x="1708" y="210" text-anchor="end">synchronous, p50 14&nbsp;ms</text>
<text class="muted lbl" x="1708" y="684" text-anchor="end">after commit</text>
<line class="life" x1="120" y1="84" x2="120" y2="736"/>
<g data-node="external"><rect class="n-ext" x="20.0" y="0" width="200" height="84"/><text class="mono" x="120.0" y="42.0" text-anchor="middle" dominant-baseline="central">client</text></g>
<line class="life" x1="492" y1="84" x2="492" y2="736"/>
<g data-node="service"><rect class="n-svc" x="372.0" y="0" width="240" height="84" rx="12"/><text class="mono" x="492.0" y="42.0" text-anchor="middle" dominant-baseline="central">checkout-api</text></g>
<line class="life" x1="864" y1="84" x2="864" y2="736"/>
<g data-node="datastore"><path class="n-ds" d="M744.0,14 L744.0,70 A120.0,14 0 0 0 984.0,70 L984.0,14 A120.0,14 0 0 0 744.0,14 Z"/><ellipse class="n-ds" cx="864.0" cy="14" rx="120.0" ry="14"/><text class="mono" x="864.0" y="49.0" text-anchor="middle" dominant-baseline="central">orders-db</text></g>
<line class="life" x1="1236" y1="84" x2="1236" y2="736"/>
<g data-node="queue"><rect class="n-q" x="1116.0" y="0" width="240" height="84" rx="4"/><line class="n-q-tick" x1="1338.0" y1="16" x2="1338.0" y2="68"/><line class="n-q-tick" x1="1326.0" y1="16" x2="1326.0" y2="68"/><line class="n-q-tick" x1="1314.0" y1="16" x2="1314.0" y2="68"/><text class="mono" x="1212.0" y="42.0" text-anchor="middle" dominant-baseline="central">kafka</text></g>
<line class="life" x1="1608" y1="84" x2="1608" y2="736"/>
<g data-node="service"><rect class="n-svc" x="1488.0" y="0" width="240" height="84" rx="12"/><text class="mono" x="1608.0" y="42.0" text-anchor="middle" dominant-baseline="central">payment-svc</text></g>
<path class="edge" d="M120,168 L488,168" marker-end="url(#arr)"/>
<text class="lbl inf" x="140" y="154"><tspan class="n">1</tspan> POST /checkout</text>
<path class="edge" d="M492,222 L860,222" marker-end="url(#arr)"/>
<text class="lbl inf" x="512" y="208"><tspan class="n">2</tspan> INSERT order and outbox row, 1 tx</text>
<path class="edge ret" d="M864,276 L496,276" marker-end="url(#arr)"/>
<text class="lbl inf" x="512" y="262"><tspan class="n">3</tspan> commit, 11&nbsp;ms</text>
<path class="edge ret" d="M492,330 L124,330" marker-end="url(#arr)"/>
<text class="lbl inf" x="140" y="316"><tspan class="n">4</tspan> 202 Accepted, order_id</text>
<path class="edge" d="M864,402 L1232,402" marker-end="url(#arr)"/>
<text class="lbl" x="884" y="388"><tspan class="n">5</tspan> outbox-relay produces orders.v1</text>
<path class="edge" d="M1236,456 L1604,456" marker-end="url(#arr)"/>
<text class="lbl" x="1256" y="442"><tspan class="n">6</tspan> consume orders.v1</text>
<path class="edge" d="M1608,500 L1544,498 L1544,530 L1604,530" marker-end="url(#arr)"/>
<text class="lbl" x="1524" y="508" text-anchor="end" dominant-baseline="central"><tspan class="n">7</tspan> authorize card, score fraud</text>
<path class="edge" d="M1608,590 L1240,590" marker-end="url(#arr)"/>
<text class="lbl" x="1256" y="576"><tspan class="n">8</tspan> produce payments.v1</text>
<path class="edge" d="M1236,644 L496,644" marker-end="url(#arr)"/>
<text class="lbl" x="512" y="630"><tspan class="n">9</tspan> consume payments.v1</text>
<path class="edge hl ret" d="M492,698 L124,698" marker-end="url(#arr-hl)"/>
<text class="lbl ink" x="140" y="684"><tspan class="n">10</tspan> push order.paid, 1.8&nbsp;s after 4</text>
</svg>
  </div>
  <div class="footer">Source: staging traces of 10,000 orders, 2026-09-24; times are p50</div>
</section>
</div>

</body>
</html>
