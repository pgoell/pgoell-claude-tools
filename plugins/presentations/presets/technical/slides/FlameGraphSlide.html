<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flame graph</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }

  /* ==== Shared grammar ==== */
  /* Action title: top left, 11 of 12 columns, at most two lines.
     Evidence always starts at --evidence-top, whatever the title
     length, so evidence never jumps between slides. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1582px;
    text-wrap: balance;
  }
  .evidence {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: var(--evidence-top); bottom: 112px;
  }
  /* Footer: source line bottom left, only on slides with numbers. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: var(--footer-bottom);
    font-size: var(--fs-micro); line-height: 1.3;
    color: var(--fg-subtle);
  }
  /* Identifiers (services, topics, tables, flags) in mono, never
     below 28px and never inside the action title. */
  .id, code { font-family: var(--font-mono); font-size: inherit; }
  .num, table, .chart { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== Diagram vocabulary (inline SVG) ==== */
  .dg { display: block; overflow: visible; }
  .dg text { font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--fg); }
  .dg text.mono { font-family: var(--font-mono); }
  .dg text.muted { fill: var(--fg-muted); }
  .dg text.subtle { fill: var(--fg-subtle); }
  .dg text.ink { fill: var(--accent-ink); font-weight: var(--weight-semibold); }
  .dg .n-svc { fill: var(--node-service-fill); stroke: var(--node-service); stroke-width: var(--stroke-node); }
  .dg .n-ds  { fill: var(--node-datastore-fill); stroke: var(--node-datastore); stroke-width: var(--stroke-node); }
  .dg .n-q   { fill: var(--node-queue-fill); stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-q-tick { stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-ext { fill: var(--node-external-fill); stroke: var(--node-external); stroke-width: var(--stroke-node); stroke-dasharray: var(--dash-external); }
  .dg .bnd   { fill: none; stroke: var(--node-boundary); stroke-width: var(--stroke-boundary); stroke-dasharray: var(--dash-boundary); }
  .dg .edge  { fill: none; stroke: var(--edge); stroke-width: var(--stroke-edge); stroke-linejoin: round; }
  .dg .edge.hl { stroke: var(--edge-highlight); stroke-width: var(--stroke-highlight); }
  .dg .edge.ret { stroke-dasharray: 10 8; }
  .dg .m-edge { fill: var(--edge); }
  .dg .m-hl { fill: var(--edge-highlight); }
  .dg .rule { stroke: var(--border-strong); stroke-width: 2; }

  /* ==== This slide ==== */
  .s-flame .fr { fill: var(--chart-context); stroke: var(--bg); stroke-width: 2; }
  .s-flame .fr.alt { fill: var(--border-strong); }
  .s-flame .fr.hot { fill: var(--chart-highlight); }
  .s-flame .lead { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .s-flame .axis { stroke: var(--fg-subtle); stroke-width: 2; }
  .s-flame .m-ax { fill: var(--fg-subtle); }
  .s-flame text.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 12px; stroke-linejoin: round; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  /* Preview either scope: open the file with #light or #dark. */
  window.addEventListener('DOMContentLoaded', function () {
    const s = document.querySelector('.frame > section');
    if (location.hash === '#light') s.classList.remove('dark');
    if (location.hash === '#dark') s.classList.add('dark');
  });
</script>
</head>
<body>
<div class="frame">
<section class="dark" data-screen-label="Flame graph">
  <h1 class="action">Checkout spends 47% of its wall time waiting on fraud-api since release 4.12</h1>
  <div class="evidence s-flame">
    <svg class="dg chart" width="1728" height="736" viewBox="0 0 1728 736" role="img"
         aria-label="Wall-clock flame graph of POST /checkout on checkout-api: fraud_client.score takes 47% of samples, place_order 15%, validate_cart 9%"
         data-chart="flame" data-unit="%" data-samples="6000" data-hot="fraud_client.score"
         data-frames='["all",100,[["handle_request",100,[["auth_middleware",4,[["jwt.decode",3,[]]]],["post_checkout",96,[["cart.load",5,[["sessions.get",4,[["socket.recv",3,[]]]]]],["validate_cart",9,[["stock.check",7,[["httpx.get",6,[["socket.recv",5,[]]]]]],["schema.validate",2,[]]]],["customer.lookup",6,[["cache.get",5,[["socket.recv",4,[]]]]]],["pricing.quote",6,[["tax.rate",3,[]],["promo.apply",2,[]]]],["fraud_client.score",47,[["httpx.Client.post",46,[["Client.send",46,[["HTTPTransport.handle_request",46,[["HTTPConnection.handle_request",45,[["h11.receive_response",45,[["SyncStream.read",44,[["socket.recv_into",44,[]]]]]]]]]]]]]],["build_payload",1,[]]]],["place_order",15,[["db.transaction",12,[["cursor.execute",3,[["socket.recv",2,[]]]],["conn.commit",9,[["pq.commit",9,[["socket.recv",8,[]]]]]]]],["producer.send",3,[["producer.flush",3,[]]]]]],["to_response",8,[["json.dumps",7,[["encode",6,[]]]]]]]]]]]]'
         data-callouts='[{"target":"all/handle_request/post_checkout/validate_cart/stock.check/httpx.get/socket.recv","x":0,"y":150,"anchor":"start","lines":["validate_cart, 9%","stock check over HTTP"]},{"target":"all/handle_request/post_checkout/fraud_client.score/httpx.Client.post/Client.send/HTTPTransport.handle_request/HTTPConnection.handle_request/h11.receive_response/SyncStream.read/socket.recv_into","x":560,"y":20,"anchor":"start","hot":true,"lines":["fraud_client.score, 47%","waiting on the <tspan class=\"id\">fraud-api</tspan> reply"]},{"target":"all/handle_request/post_checkout/place_order/db.transaction/conn.commit/pq.commit/socket.recv","x":1728,"y":150,"anchor":"end","lines":["place_order, 15%","insert, commit, produce"]}]'></svg>
  </div>
  <div class="footer">Source: py-spy record --idle on 1 checkout-api pod, 60&nbsp;s, 6,000 samples, 2026-08-19</div>
</section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-flame .chart');
    const root = JSON.parse(el.dataset.frames), calls = JSON.parse(el.dataset.callouts), hotName = el.dataset.hot;
    const W = 1728, BASE = 672, ROW = 46;            /* root row sits on BASE; rows grow upward */
    const px = (p) => p / root[1] * W;
    const frames = {};
    let o = '', k = 0;
    (function walk(n, x, d, path, hot) {
      const w = px(n[1]), y = BASE - (d + 1) * ROW;
      hot = hot || n[0] === hotName;
      frames[path] = { x: x, w: w, y: y };
      o += '<rect class="fr' + (hot ? ' hot' : (k++ % 2 ? ' alt' : '')) + '" x="' + x.toFixed(1) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + ROW + '"/>';
      let cx = x;
      n[2].forEach(c => { walk(c, cx, d + 1, path + '/' + c[0], hot); cx += px(c[1]); });
    })(root, 0, 0, root[0], false);
    /* x axis: the full width is every sample */
    const ay = BASE + 34;
    o += '<line class="axis" x1="4" x2="' + (W - 4) + '" y1="' + ay + '" y2="' + ay + '" marker-start="url(#ax)" marker-end="url(#ax)"/>';
    o += '<text class="subtle halo" x="' + W / 2 + '" y="' + ay + '" text-anchor="middle" dominant-baseline="central">width: share of ' + Number(el.dataset.samples).toLocaleString('en-US') + ' samples</text>';
    /* callouts in the empty band above the data, leaders down to the tower tops */
    calls.forEach(c => {
      const t = frames[c.target], tx = t.x + t.w / 2;
      c.lines.forEach((l, i) => {
        o += '<text class="' + (i ? 'muted' : (c.hot ? 'ink' : '')) + (i ? '' : ' mono') + '" x="' + c.x + '" y="' + (c.y + i * 38) + '" text-anchor="' + c.anchor + '" dominant-baseline="hanging">' + l + '</text>';
      });
      const ly = c.y + c.lines.length * 38 + 8;
      o += '<path class="lead" d="M' + tx.toFixed(1) + ',' + ly + ' L' + tx.toFixed(1) + ',' + (t.y - 6) + '"/>';
    });
    el.innerHTML = '<defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="m-ax" d="M0,0 L10,5 L0,10 z"/></marker></defs>' + o;
  })();
</script>
</body>
</html>
