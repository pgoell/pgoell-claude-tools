<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>State machine</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }

  /* ==== Shared grammar ==== */
  /* Action title: top left, 11 of 12 columns, at most two lines.
     Evidence always starts at --evidence-top, whatever the title
     length, so evidence never jumps between slides. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1582px;
    text-wrap: balance;
  }
  .evidence {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: var(--evidence-top); bottom: 112px;
  }
  /* Footer: source line bottom left, only on slides with numbers. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: var(--footer-bottom);
    font-size: var(--fs-micro); line-height: 1.3;
    color: var(--fg-subtle);
  }
  /* Identifiers (services, topics, tables, flags) in mono, never
     below 28px and never inside the action title. */
  .id, code { font-family: var(--font-mono); font-size: inherit; }
  .num, table, .chart { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== Diagram vocabulary (inline SVG) ==== */
  .dg { display: block; overflow: visible; }
  .dg text { font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--fg); }
  .dg text.mono { font-family: var(--font-mono); }
  .dg text.muted { fill: var(--fg-muted); }
  .dg text.subtle { fill: var(--fg-subtle); }
  .dg text.ink { fill: var(--accent-ink); font-weight: var(--weight-semibold); }
  .dg .n-svc { fill: var(--node-service-fill); stroke: var(--node-service); stroke-width: var(--stroke-node); }
  .dg .n-ds  { fill: var(--node-datastore-fill); stroke: var(--node-datastore); stroke-width: var(--stroke-node); }
  .dg .n-q   { fill: var(--node-queue-fill); stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-q-tick { stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-ext { fill: var(--node-external-fill); stroke: var(--node-external); stroke-width: var(--stroke-node); stroke-dasharray: var(--dash-external); }
  .dg .bnd   { fill: none; stroke: var(--node-boundary); stroke-width: var(--stroke-boundary); stroke-dasharray: var(--dash-boundary); }
  .dg .edge  { fill: none; stroke: var(--edge); stroke-width: var(--stroke-edge); stroke-linejoin: round; }
  .dg .edge.hl { stroke: var(--edge-highlight); stroke-width: var(--stroke-highlight); }
  .dg .edge.ret { stroke-dasharray: 10 8; }
  .dg .m-edge { fill: var(--edge); }
  .dg .m-hl { fill: var(--edge-highlight); }
  .dg .rule { stroke: var(--border-strong); stroke-width: 2; }

  /* ==== This slide ==== */
  .s-state .st { fill: var(--bg-elev); stroke: var(--fg-subtle); stroke-width: var(--stroke-node); }
  .s-state .st-in { fill: none; stroke: var(--fg-subtle); stroke-width: 2; }
  .s-state .st.hi { fill: var(--accent); stroke: var(--accent); }
  .s-state text.on-hi { fill: var(--accent-fg); font-weight: var(--weight-semibold); }
  .s-state .start { fill: var(--fg-muted); }
  .s-state .lead { stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 6 8; fill: none; }
  .s-state text.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 12px; stroke-linejoin: round; }
  .s-state tspan.mono { font-family: var(--font-mono); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  /* Preview either scope: open the file with #light or #dark. */
  window.addEventListener('DOMContentLoaded', function () {
    const s = document.querySelector('.frame > section');
    if (location.hash === '#light') s.classList.remove('dark');
    if (location.hash === '#dark') s.classList.add('dark');
  });
</script>
</head>
<body>
<div class="frame">
<section class="dark" data-screen-label="State machine">
  <h1 class="action">A failed send parks the row in retry_wait, so no order event is dropped</h1>
  <div class="evidence s-state">
    <svg class="dg" width="1728" height="736" viewBox="0 0 1728 736" role="img"
     aria-label="Outbox row states: pending, in_flight, sent, retry_wait, dead_letter, with the transitions between them; retry_wait is highlighted">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="m-edge" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<path class="edge" d="M180,34 L180,102" marker-end="url(#arr)"/>
<path class="edge" d="M300,150 L516,150" marker-end="url(#arr)"/>
<path class="edge" d="M760,150 L976,150" marker-end="url(#arr)"/>
<path class="edge" d="M640,194 L640,352" marker-end="url(#arr)"/>
<path class="edge" d="M520,400 L180,400 L180,198" marker-end="url(#arr)"/>
<path class="edge" d="M640,444 L640,592" marker-end="url(#arr)"/>
<path class="edge" d="M520,640 L120,640 L120,198" marker-end="url(#arr)"/>
<text class="muted halo" x="410" y="124" text-anchor="middle" dominant-baseline="central">relay claims</text>
<text class="muted halo" x="870" y="124" text-anchor="middle" dominant-baseline="central">broker acks</text>
<text class="muted halo" x="664" y="275" text-anchor="start" dominant-baseline="central">send fails</text>
<text class="muted halo" x="350" y="376" text-anchor="middle" dominant-baseline="central">backoff ends</text>
<text class="muted halo" x="664" y="520" text-anchor="start" dominant-baseline="central">8th failure</text>
<text class="muted halo" x="320" y="616" text-anchor="middle" dominant-baseline="central">operator replays</text>
<circle class="start" cx="180" cy="22" r="12"/>
<text class="muted" x="212" y="22" dominant-baseline="central">written with the order</text>
<g data-node="state"><rect class="st" x="60" y="106" width="240" height="88" rx="20"/>
<text class="mono" x="180" y="150" text-anchor="middle" dominant-baseline="central">pending</text></g>
<g data-node="state"><rect class="st" x="520" y="106" width="240" height="88" rx="20"/>
<text class="mono" x="640" y="150" text-anchor="middle" dominant-baseline="central">in_flight</text></g>
<g data-node="state"><rect class="st" x="980" y="106" width="240" height="88" rx="20"/>
<rect class="st-in" x="988" y="114" width="224" height="72" rx="14"/>
<text class="mono" x="1100" y="150" text-anchor="middle" dominant-baseline="central">sent</text></g>
<g data-node="state"><rect class="st hi" x="520" y="356" width="240" height="88" rx="20"/>
<text class="mono on-hi" x="640" y="400" text-anchor="middle" dominant-baseline="central">retry_wait</text></g>
<g data-node="state"><rect class="st" x="520" y="596" width="240" height="88" rx="20"/>
<text class="mono" x="640" y="640" text-anchor="middle" dominant-baseline="central">dead_letter</text></g>
<path class="lead" d="M1298,150 L1232,150" marker-end="url(#arr)"/>
<text x="1314" y="150" dominant-baseline="central"><tspan class="mono">orders.v1</tspan> consumer lag</text>
<path class="lead" d="M1298,400 L772,400" marker-end="url(#arr)"/>
<text x="1314" y="400" dominant-baseline="central"><tspan class="mono">outbox_retry_rows</tspan></text>
<text x="1314" y="438" dominant-baseline="central">gauge, alert over 100</text>
<path class="lead" d="M1298,640 L772,640" marker-end="url(#arr)"/>
<text x="1314" y="640" dominant-baseline="central">any row pages sre</text>
    </svg>
  </div>
  <div class="footer">Source: services/checkout/outbox.py and relay config (max_attempts=8, backoff 1&nbsp;s to 5&nbsp;min), 2026-09-22</div>
</section>
</div>

</body>
</html>
