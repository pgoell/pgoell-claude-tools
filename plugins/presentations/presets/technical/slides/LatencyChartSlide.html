<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Latency chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }

  /* ==== Shared grammar ==== */
  /* Action title: top left, 11 of 12 columns, at most two lines.
     Evidence always starts at --evidence-top, whatever the title
     length, so evidence never jumps between slides. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1582px;
    text-wrap: balance;
  }
  .evidence {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: var(--evidence-top); bottom: 112px;
  }
  /* Footer: source line bottom left, only on slides with numbers. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: var(--footer-bottom);
    font-size: var(--fs-micro); line-height: 1.3;
    color: var(--fg-subtle);
  }
  /* Identifiers (services, topics, tables, flags) in mono, never
     below 28px and never inside the action title. */
  .id, code { font-family: var(--font-mono); font-size: inherit; }
  .num, table, .chart { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== Diagram vocabulary (inline SVG) ==== */
  .dg { display: block; overflow: visible; }
  .dg text { font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--fg); }
  .dg text.mono { font-family: var(--font-mono); }
  .dg text.muted { fill: var(--fg-muted); }
  .dg text.subtle { fill: var(--fg-subtle); }
  .dg text.ink { fill: var(--accent-ink); font-weight: var(--weight-semibold); }
  .dg .n-svc { fill: var(--node-service-fill); stroke: var(--node-service); stroke-width: var(--stroke-node); }
  .dg .n-ds  { fill: var(--node-datastore-fill); stroke: var(--node-datastore); stroke-width: var(--stroke-node); }
  .dg .n-q   { fill: var(--node-queue-fill); stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-q-tick { stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-ext { fill: var(--node-external-fill); stroke: var(--node-external); stroke-width: var(--stroke-node); stroke-dasharray: var(--dash-external); }
  .dg .bnd   { fill: none; stroke: var(--node-boundary); stroke-width: var(--stroke-boundary); stroke-dasharray: var(--dash-boundary); }
  .dg .edge  { fill: none; stroke: var(--edge); stroke-width: var(--stroke-edge); stroke-linejoin: round; }
  .dg .edge.hl { stroke: var(--edge-highlight); stroke-width: var(--stroke-highlight); }
  .dg .edge.ret { stroke-dasharray: 10 8; }
  .dg .m-edge { fill: var(--edge); }
  .dg .m-hl { fill: var(--edge-highlight); }
  .dg .rule { stroke: var(--border-strong); stroke-width: 2; }

  /* ==== This slide ==== */
  .s-lat .grid { stroke: var(--chart-grid); stroke-width: 2; }
  .s-lat .axis { stroke: var(--fg-subtle); stroke-width: 2; }
  .s-lat .line { fill: none; stroke: var(--chart-context); stroke-width: 4; stroke-linejoin: round; }
  .s-lat .line.hi { stroke: var(--chart-highlight); stroke-width: 6; }
  .s-lat .slo { stroke: var(--chart-threshold); stroke-width: 3; stroke-dasharray: 14 10; }
  .s-lat text.slo-t { fill: var(--chart-threshold); }
  .s-lat .mark { stroke: var(--fg-subtle); stroke-width: 2; stroke-dasharray: 4 6; }
  .s-lat text.hi { fill: var(--accent-ink); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  /* Preview either scope: open the file with #light or #dark. */
  window.addEventListener('DOMContentLoaded', function () {
    const s = document.querySelector('.frame > section');
    if (location.hash === '#light') s.classList.remove('dark');
    if (location.hash === '#dark') s.classList.add('dark');
  });
</script>
</head>
<body>
<div class="frame">
<section class="dark" data-screen-label="Latency chart">
  <h1 class="action">Checkout p99 jumped from 240 to 610&nbsp;ms after the sync fraud check shipped</h1>
  <div class="evidence s-lat">
    <svg class="dg chart" width="1728" height="736" viewBox="0 0 1728 736" role="img"
         aria-label="Weekly checkout latency percentiles, W27 to W38 2026, with the 300&nbsp;ms p99 SLO"
         data-chart="line" data-unit="ms" data-max="700" data-threshold="300" data-threshold-label="SLO p99 300&nbsp;ms"
         data-annotate="6" data-annotation='["Release 4.12 made the","fraud check synchronous"]'
         data-labels='["W27", "W28", "W29", "W30", "W31", "W32", "W33", "W34", "W35", "W36", "W37", "W38"]'
         data-series='[{"name": "p50", "values": [62, 60, 63, 61, 64, 62, 118, 121, 119, 122, 120, 124]}, {"name": "p95", "values": [150, 148, 155, 152, 149, 151, 380, 395, 388, 402, 391, 398]}, {"name": "p99", "values": [238, 242, 236, 245, 240, 239, 604, 612, 598, 621, 607, 615]}]'
         data-highlight="2"></svg>
  </div>
  <div class="footer">Source: checkout-api Grafana dashboard, weekly percentiles, W27 to W38 2026</div>
</section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-lat .chart');
    const labels = JSON.parse(el.dataset.labels), series = JSON.parse(el.dataset.series);
    const hi = Number(el.dataset.highlight), max = Number(el.dataset.max), unit = el.dataset.unit;
    const L = 110, R = 1480, T = 56, B = 636;           /* plot box */
    const x = (i) => L + i * (R - L) / (labels.length - 1);
    const y = (v) => B - v / max * (B - T);
    let o = '<text class="muted" x="0" y="16">Checkout latency, ' + unit + ', weekly</text>';
    for (let v = 0; v <= max; v += 100) {
      o += '<line class="' + (v ? 'grid' : 'axis') + '" x1="' + L + '" x2="' + R + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
      o += '<text class="subtle" x="' + (L - 20) + '" y="' + y(v) + '" text-anchor="end" dominant-baseline="central">' + v + '</text>';
    }
    labels.forEach((l, i) => { if (i % 2 === 0 || i === labels.length - 1)
      o += '<text class="subtle" x="' + x(i) + '" y="' + (B + 44) + '" text-anchor="middle">' + l + '</text>'; });
    /* annotation at the regression */
    const a = Number(el.dataset.annotate), note = JSON.parse(el.dataset.annotation);
    const ax = (x(a - 1) + x(a)) / 2;
    o += '<line class="mark" x1="' + ax + '" x2="' + ax + '" y1="' + (T - 8) + '" y2="' + B + '"/>';
    note.forEach((t, k) => { o += '<text x="' + (ax - 20) + '" y="' + (T + 30 + k * 38) + '" text-anchor="end">' + t + '</text>'; });
    /* SLO threshold */
    const th = Number(el.dataset.threshold);
    o += '<line class="slo" x1="' + L + '" x2="' + R + '" y1="' + y(th) + '" y2="' + y(th) + '"/>';
    o += '<text class="slo-t" x="' + (R + 24) + '" y="' + y(th) + '" dominant-baseline="central">' + el.dataset.thresholdLabel + '</text>';
    /* context series first, story series last so it sits on top */
    const order = series.map((s, i) => i).filter(i => i !== hi).concat([hi]);
    order.forEach(i => {
      const s = series[i], v = s.values, last = v[v.length - 1];
      o += '<path class="line' + (i === hi ? ' hi' : '') + '" d="' + v.map((d, j) => (j ? 'L' : 'M') + x(j) + ',' + y(d)).join(' ') + '"/>';
      o += '<text class="' + (i === hi ? 'hi' : 'muted') + '" x="' + (R + 24) + '" y="' + y(last) + '" dominant-baseline="central">' + s.name + ' ' + last + ' ' + unit + '</text>';
    });
    el.innerHTML = o;
  })();
</script>
</body>
</html>
