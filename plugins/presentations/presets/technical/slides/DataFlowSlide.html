<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data flow</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    font-size: var(--fs-body);
    line-height: var(--lh-normal);
  }

  /* ==== Shared grammar ==== */
  /* Action title: top left, 11 of 12 columns, at most two lines.
     Evidence always starts at --evidence-top, whatever the title
     length, so evidence never jumps between slides. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1582px;
    text-wrap: balance;
  }
  .evidence {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: var(--evidence-top); bottom: 112px;
  }
  /* Footer: source line bottom left, only on slides with numbers. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: var(--footer-bottom);
    font-size: var(--fs-micro); line-height: 1.3;
    color: var(--fg-subtle);
  }
  /* Identifiers (services, topics, tables, flags) in mono, never
     below 28px and never inside the action title. */
  .id, code { font-family: var(--font-mono); font-size: inherit; }
  .num, table, .chart { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== Diagram vocabulary (inline SVG) ==== */
  .dg { display: block; overflow: visible; }
  .dg text { font-family: var(--font-sans); font-size: var(--fs-label); fill: var(--fg); }
  .dg text.mono { font-family: var(--font-mono); }
  .dg text.muted { fill: var(--fg-muted); }
  .dg text.subtle { fill: var(--fg-subtle); }
  .dg text.ink { fill: var(--accent-ink); font-weight: var(--weight-semibold); }
  .dg .n-svc { fill: var(--node-service-fill); stroke: var(--node-service); stroke-width: var(--stroke-node); }
  .dg .n-ds  { fill: var(--node-datastore-fill); stroke: var(--node-datastore); stroke-width: var(--stroke-node); }
  .dg .n-q   { fill: var(--node-queue-fill); stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-q-tick { stroke: var(--node-queue); stroke-width: var(--stroke-node); }
  .dg .n-ext { fill: var(--node-external-fill); stroke: var(--node-external); stroke-width: var(--stroke-node); stroke-dasharray: var(--dash-external); }
  .dg .bnd   { fill: none; stroke: var(--node-boundary); stroke-width: var(--stroke-boundary); stroke-dasharray: var(--dash-boundary); }
  .dg .edge  { fill: none; stroke: var(--edge); stroke-width: var(--stroke-edge); stroke-linejoin: round; }
  .dg .edge.hl { stroke: var(--edge-highlight); stroke-width: var(--stroke-highlight); }
  .dg .edge.ret { stroke-dasharray: 10 8; }
  .dg .m-edge { fill: var(--edge); }
  .dg .m-hl { fill: var(--edge-highlight); }
  .dg .rule { stroke: var(--border-strong); stroke-width: 2; }

  /* ==== This slide ==== */

</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  /* Preview either scope: open the file with #light or #dark. */
  window.addEventListener('DOMContentLoaded', function () {
    const s = document.querySelector('.frame > section');
    if (location.hash === '#light') s.classList.remove('dark');
    if (location.hash === '#dark') s.classList.add('dark');
  });
</script>
</head>
