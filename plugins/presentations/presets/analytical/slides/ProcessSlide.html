<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>13 Process</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared chrome (Layout grammar in ../guidelines.md) ==== */
  /* Every piece of chrome sits at a fixed position, so nothing moves
     when you flip through the deck. */
  /* Tracker: the deck's sections, current one marked by the accent.
     Each section spans 2 grid columns. */
  .tracker {
    position: absolute; top: var(--tracker-top); left: var(--slide-pad-x);
    display: flex; gap: var(--grid-gutter);
    font-size: var(--fs-micro); line-height: 1.2; color: var(--fg-subtle);
  }
  .tracker span {
    width: calc(2 * var(--grid-col) + var(--grid-gutter));
    padding-top: 12px; border-top: 4px solid var(--border-strong);
  }
  /* Accent job, shared: the current section. */
  .tracker span.on {
    border-top-color: var(--accent); color: var(--fg);
    font-weight: var(--weight-semibold);
  }
  /* Sticker: status of the numbers, top right, only when true. */
  .sticker {
    position: absolute; top: var(--tracker-top); right: var(--slide-pad-x);
    font-size: var(--fs-caption); line-height: 1.2; color: var(--fg-muted);
    border: 2px solid var(--fg-subtle); padding: 6px 20px;
  }
  /* Action title: same place, same size on every content slide. */
  h1.action {
    position: absolute; top: var(--title-top); left: var(--slide-pad-x);
    width: calc(11 * var(--grid-col) + 10 * var(--grid-gutter));
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  /* Evidence area: fixed box under the title band. */
  .body {
    position: absolute; top: var(--body-top); bottom: var(--body-bottom);
    left: var(--slide-pad-x); right: var(--slide-pad-x);
  }
  /* Exhibit subtitle: the measure, its units, and its dates. */
  .exhibit {
    font-size: var(--fs-body); line-height: 1.2; color: var(--fg-muted);
    margin: 0;
  }
  /* Footer: source bottom left, page number bottom right. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: 1.2;
    color: var(--fg-subtle);
  }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }
  svg { display: block; overflow: visible; }

  /* ==== This slide ==== */
  .s-plan svg text { font-size: var(--fs-caption); fill: var(--fg); }
  .s-plan .chev { fill: var(--bg-subtle); stroke: var(--border-strong); stroke-width: 2; }
  .s-plan .ph { font-weight: var(--weight-semibold); }
  .s-plan .dt { fill: var(--fg-muted); }
  .s-plan .ws { font-weight: var(--weight-semibold); }
  .s-plan .lane { stroke: var(--border); stroke-width: 2; }
  .s-plan .task { fill: var(--chart-context); }
  /* Accent job: the milestone the title names. */
  .s-plan .ms { fill: var(--accent); }
  .s-plan .ms-t { fill: var(--accent); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-plan" data-screen-label="13 Process">
    <nav class="tracker" data-role="footer" aria-label="Deck sections"><span>Where cost sits</span><span>What closing saves</span><span>Options</span><span class="on">Plan</span></nav>
    <h1 class="action">A 4-phase plan closes the first depot in January 2027</h1>
    <div class="body">
      <svg width="1728" height="656" viewBox="0 0 1728 656" role="img"
           aria-label="Workplan in 4 phases from April 2026 to March 2027, with network, people, and customer workstreams; Hull closes in January 2027">
        <!-- Phases: 4 chevrons over grid columns 3 to 12 -->
        <path class="chev" d="M292 0 H630 L660 60 L630 120 H292 Z"/>
        <path class="chev" d="M652 0 H990 L1020 60 L990 120 H652 L682 60 Z"/>
        <path class="chev" d="M1012 0 H1350 L1380 60 L1350 120 H1012 L1042 60 Z"/>
        <path class="chev" d="M1372 0 H1728 V120 H1372 L1402 60 Z"/>
        <text class="ph" x="320" y="46">1 Decide</text><text class="dt" x="320" y="88">Apr 2026</text>
        <text class="ph" x="706" y="46">2 Prepare</text><text class="dt" x="706" y="88">May to Jul 2026</text>
        <text class="ph" x="1066" y="46">3 Move volume</text><text class="dt" x="1066" y="88">Aug to Dec 2026</text>
        <text class="ph" x="1426" y="46">4 Close</text><text class="dt" x="1426" y="88">Jan to Mar 2027</text>
        <!-- Workstream lanes -->
        <line class="lane" x1="0" x2="1728" y1="152" y2="152"/>
        <line class="lane" x1="0" x2="1728" y1="320" y2="320"/>
        <line class="lane" x1="0" x2="1728" y1="488" y2="488"/>
        <line class="lane" x1="0" x2="1728" y1="656" y2="656"/>
        <text class="ws" x="0" y="200">Network</text>
        <text class="ws" x="0" y="368">People</text>
        <text class="ws" x="0" y="536">Customers</text>
        <!-- Network -->
        <text x="320" y="200">Board approves</text>
        <text x="320" y="238">closures</text>
        <rect class="task" x="320" y="262" width="300" height="16"/>
        <text x="706" y="200">Add 2 shifts at each</text>
        <text x="706" y="238">of the 8 depots</text>
        <rect class="task" x="706" y="262" width="640" height="16"/>
        <path class="ms" d="M1426 246 L1450 270 L1426 294 L1402 270 Z"/>
        <text class="ms-t" x="1426" y="200">Hull closes in Jan</text>
        <text class="dt" x="1426" y="238">Swindon, Leeds by Mar</text>
        <!-- People -->
        <text x="320" y="368">Consult staff and unions at the 3 sites</text>
        <rect class="task" x="320" y="430" width="660" height="16"/>
        <text x="1066" y="368">Redeploy staff to the</text>
        <text x="1066" y="406">8 receiving depots</text>
        <rect class="task" x="1066" y="430" width="640" height="16"/>
        <!-- Customers -->
        <text x="706" y="536">Brief key accounts</text>
        <rect class="task" x="706" y="598" width="280" height="16"/>
        <text x="1066" y="536">Move routes depot by depot;</text>
        <text x="1066" y="574">track delivery times weekly</text>
        <rect class="task" x="1066" y="598" width="640" height="16"/>
      </svg>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: team workplan, March 2026</span>
      <span class="page" data-role="footer">13</span>
    </div>
  </section>
</div>
</body>
</html>
