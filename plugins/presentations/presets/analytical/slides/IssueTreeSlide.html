<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>08 Issue tree</title>
<style>
  /* ==========================================================
     Synced copy of ../colors.css. Source of truth is the file;
     refresh this block whenever it changes.
     ========================================================== */
  /* ============================================================
     Analytical preset, design tokens ("claim plus number" direction)
     ============================================================
     Source of truth for every slide's embedded variable block.
     Semantic layer only: this preset serves a context, not a
     brand, so it carries no raw brand layer. Slides read these
     names and nothing else.

     Consulting decks read by or presented to decision makers:
     white paper, navy ink, one blue accent, a navy dark scope
     for structure slides.

     Color rule: one accent with one job. The accent marks the
     single thing the audience should look at. Everything else
     is ink or gray. Every text tier holds 4.5:1 or better on
     --bg, --bg-elev, and --bg-subtle in both scopes, and
     --accent holds 4.5:1 on --bg, so it can mark a word or a
     number. Borders are decorative only.
     ============================================================ */

  :root {
    /* =====================================================
       COLOR, Semantic (light theme)
       ===================================================== */
    --bg:                 #FFFFFF;
    --bg-elev:            #FFFFFF;
    --bg-subtle:          #F2F4F7;
    --bg-inverse:         #0B1F33;

    --fg:                 #0B1F33;      /* 16.69 on bg */
    --fg-muted:           #44505E;      /* 8.22 */
    --fg-subtle:          #5B6673;      /* 5.84; source line, page number */
    --fg-inverse:         #F3F6F9;      /* 15.39 on bg-inverse */
    --fg-inverse-muted:   #BAC5D1;
    --fg-inverse-subtle:  #93A1B0;

    --border:             #E1E5EA;      /* decorative only */
    --border-strong:      #C3CAD3;
    --border-inverse:     #27405A;
    --border-accent:      var(--accent);

    --accent:             #1D4ED8;      /* 6.70; the one accent */
    --accent-fg:          #FFFFFF;
    --accent-partner:     #0F766E;      /* second chart series only */

    /* Status (rare on slides, but useful) */
    --status-success:     #2F7A1C;
    --status-warning:     #C77700;
    --status-danger:      #B0271A;
    --status-info:        #00638A;

    /* =====================================================
       COLOR, Charts
       Gray plus one: --chart-highlight marks the story series,
       every other series is --chart-context. The numbered
       categorical colors are for charts where the categories
       are the point, at most 6 series.
       Categorical set passes a Machado 2009 protan, deutan,
       and tritan simulation at CIEDE2000 >= 13 in both scopes.
       No set survives grayscale, so label series directly.
       ===================================================== */
    --chart-highlight:    var(--accent);  /* story series in highlight mode */
    --chart-context:      #9AA5B1;      /* 2.50; the series that are not the story */
    --chart-grid:         var(--border);
    --chart-1:            #1D4ED8;      /* 6.70 */
    --chart-2:            #0F766E;      /* 5.47 */
    --chart-3:            #B45309;      /* 5.02 */
    --chart-4:            #866CFE;      /* 3.76 */
    --chart-5:            #87293D;      /* 8.70 */
    --chart-6:            #374A65;      /* 9.01 */
    --chart-seq-1:        #eff3ff;      /* ColorBrewer Blues 5 */
    --chart-seq-2:        #bdd7e7;
    --chart-seq-3:        #6baed6;
    --chart-seq-4:        #3182bd;
    --chart-seq-5:        #08519c;
    --chart-div-1:        #ca0020;      /* ColorBrewer RdBu 5 */
    --chart-div-2:        #f4a582;
    --chart-div-3:        #f7f7f7;
    --chart-div-4:        #92c5de;
    --chart-div-5:        #0571b0;

    /* =====================================================
       TYPE, slide scale (1920x1080 reference)
       Floors by role (checked by gate H7): body >= 36px,
       captions and chart labels >= 28px, footer and source
       line >= 24px. Use at most three sizes per slide. Never
       shrink text to fit: split the slide or cut words.
       ===================================================== */
    --fs-hero:        200px;     /* The single big number */
    --fs-display:     96px;      /* Structure slides: title, divider, closing */
    --fs-section:     72px;      /* Spare large step */
    --fs-h1:          60px;      /* Action title, same size on every content slide, max 2 lines */
    --fs-h2:          52px;      /* Spare large subhead */
    --fs-h3:          48px;      /* Column heads */
    --fs-subtitle:    44px;      /* Deck subtitle; exhibit subtitle (units and dates) */
    --fs-body-lg:     40px;      /* Executive summary lead phrases */
    --fs-body:        36px;      /* Body text, list items (floor 36px) */
    --fs-caption:     28px;      /* Chart labels, sticker */
    --fs-micro:       24px;      /* Source line, page number; do not go below */

    --lh-tight:         1.12;    /* titles */
    --lh-snug:          1.2;
    --lh-normal:        1.3;     /* body */
    --lh-relaxed:       1.5;

    --tracking-tight:   -0.01em;  /* titles */
    --tracking-normal:  0;
    --tracking-wide:    0.04em;
    --tracking-caps:    0.08em;  /* kept for token parity; tracked caps are banned on slides */

    --weight-regular:   400;
    --weight-medium:    500;
    --weight-semibold:  600;
    --weight-bold:      700;

    /* =====================================================
       SPACING (8pt grid)
       ===================================================== */
    --space-0:   0;
    --space-1:   4px;
    --space-2:   8px;
    --space-3:   12px;
    --space-4:   16px;
    --space-5:   24px;
    --space-6:   32px;
    --space-7:   48px;
    --space-8:   64px;
    --space-9:   80px;
    --space-10:  120px;
    --space-11:  160px;

    /* Slide margins (1920x1080) */
    --slide-pad-x:   96px;
    --slide-pad-y:   72px;
    --slide-w:       1920px;
    --slide-h:       1080px;

    /* Layout grid (see guidelines.md, Layout grammar).
       12 columns of 122px with 24px gutters fill the 1728px
       between the 96px side margins. Chrome sits at fixed
       heights so nothing moves when you flip slides. */
    --grid-cols:     12;
    --grid-col:      122px;
    --grid-gutter:   24px;
    --tracker-top:   48px;      /* tracker and sticker row */
    --title-top:     120px;     /* action title, first line */
    --body-top:      300px;     /* evidence starts here on every content slide */
    --body-bottom:   124px;     /* evidence ends this far above the canvas bottom */

    /* =====================================================
       RADIUS
       ===================================================== */
    --r-0:       0;
    --r-sm:      4px;
    --r-md:      6px;
    --r-lg:      8px;
    --r-pill:    999px;

    /* =====================================================
       SHADOWS (use sparingly, flat is default)
       ===================================================== */
    --shadow-0:  none;
    --shadow-1:  0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-2:  0 10px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);

    /* =====================================================
       MOTION
       ===================================================== */
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
    --ease-in-out: cubic-bezier(0.7, 0, 0.3, 1);
    --dur-fast:    150ms;
    --dur-base:    240ms;
    --dur-slow:    400ms;
  }

  /* =====================================================
     DARK SLIDE THEME, apply `.dark` to a slide root.
     Inverse tokens swap to the light values here.
     ===================================================== */
  .dark,
  [data-theme="dark"] {
    --bg:                 #0B1F33;
    --bg-elev:            #13293F;
    --bg-subtle:          #10253A;
    --bg-inverse:         #FFFFFF;

    --fg:                 #F3F6F9;      /* 15.39 */
    --fg-muted:           #BAC5D1;      /* 9.53 */
    --fg-subtle:          #93A1B0;      /* 6.33 */
    --fg-inverse:         #0B1F33;
    --fg-inverse-muted:   #44505E;
    --fg-inverse-subtle:  #5B6673;

    --border:             #27405A;
    --border-strong:      #3A5673;
    --border-inverse:     #E1E5EA;
    --border-accent:      var(--accent);  /* redeclared so it picks up the dark accent */

    --accent:             #7EA6FF;      /* 6.98 */
    --accent-fg:          #0B1F33;
    --accent-partner:     #279985;      /* 4.75; CVD-safe against the accent */

    --chart-highlight:    var(--accent);  /* redeclared so it picks up the dark accent */
    --chart-context:      #56687C;      /* 2.91 */
    --chart-grid:         var(--border);
    --chart-1:            #7EA6FF;      /* 6.98 */
    --chart-2:            #279985;      /* 4.75 */
    --chart-3:            #F5A524;      /* 8.18 */
    --chart-4:            #897CB4;      /* 4.46 */
    --chart-5:            #C5A2B1;      /* 7.29 */
    --chart-6:            #BBD5ED;      /* 11.01 */
  }

  /* ==========================================================
     Synced copy of ../typography.css. Source of truth is the
     file; refresh this block whenever it changes. Font URLs
     gain a ../ prefix here because this file sits in slides/.
     ========================================================== */
  /* ============================================================
     Analytical preset, font stacks
     ============================================================
     IBM Plex Serif (titles, 600) over IBM Plex Sans (body,
     labels, numbers). Both ship unmodified in assets/fonts/ with
     their OFL.txt and load from that relative path, so slides
     make no network request. Plex carries the Reserved Font Name
     "Plex": never subset or otherwise modify these files. Plex
     Sans figures are tabular by default. The mono stack is for
     code samples only, never for labels, and is not vendored.
     ============================================================ */

  @font-face {
    font-family: 'IBM Plex Serif';
    src: url('../assets/fonts/ibm-plex-serif/IBMPlexSerif-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../assets/fonts/ibm-plex-sans/IBMPlexSans-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }

  :root {
    --font-display: 'IBM Plex Serif', Georgia, serif;
    --font-sans:    'IBM Plex Sans', Arial, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }

  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared chrome (Layout grammar in ../guidelines.md) ==== */
  /* Every piece of chrome sits at a fixed position, so nothing moves
     when you flip through the deck. */
  /* Tracker: the deck's sections, current one marked by the accent.
     Each section spans 2 grid columns. */
  .tracker {
    position: absolute; top: var(--tracker-top); left: var(--slide-pad-x);
    display: flex; gap: var(--grid-gutter);
    font-size: var(--fs-micro); line-height: 1.2; color: var(--fg-subtle);
  }
  .tracker span {
    width: calc(2 * var(--grid-col) + var(--grid-gutter));
    padding-top: 12px; border-top: 4px solid var(--border-strong);
  }
  /* Accent job, shared: the current section. */
  .tracker span.on {
    border-top-color: var(--accent); color: var(--fg);
    font-weight: var(--weight-semibold);
  }
  /* Sticker: status of the numbers, top right, only when true. */
  .sticker {
    position: absolute; top: var(--tracker-top); right: var(--slide-pad-x);
    font-size: var(--fs-caption); line-height: 1.2; color: var(--fg-muted);
    border: 2px solid var(--fg-subtle); padding: 6px 20px;
  }
  /* Action title: same place, same size on every content slide. */
  h1.action {
    position: absolute; top: var(--title-top); left: var(--slide-pad-x);
    width: calc(11 * var(--grid-col) + 10 * var(--grid-gutter));
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  /* Evidence area: fixed box under the title band. */
  .body {
    position: absolute; top: var(--body-top); bottom: var(--body-bottom);
    left: var(--slide-pad-x); right: var(--slide-pad-x);
  }
  /* Exhibit subtitle: the measure, its units, and its dates. */
  .exhibit {
    font-size: var(--fs-body); line-height: 1.2; color: var(--fg-muted);
    margin: 0;
  }
  /* Footer: source bottom left, page number bottom right. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: 1.2;
    color: var(--fg-subtle);
  }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }
  svg { display: block; overflow: visible; }

  /* ==== This slide ==== */
  .s-tree svg text { font-size: var(--fs-caption); fill: var(--fg); }
  .s-tree .node { fill: var(--bg); stroke: var(--border-strong); stroke-width: 2; }
  .s-tree .root { fill: var(--bg-inverse); }
  .s-tree .root-t { fill: var(--fg-inverse); font-weight: var(--weight-semibold); }
  .s-tree .branch-t { font-weight: var(--weight-semibold); }
  .s-tree .link { fill: none; stroke: var(--border-strong); stroke-width: 2; }
  .s-tree .val { fill: var(--fg-muted); }
  .s-tree .head { fill: var(--fg-subtle); }
  /* Accent job: the path to the one lever that reaches the target. */
  .s-tree .link.hi { stroke: var(--accent); stroke-width: 4; }
  .s-tree .node.hi { stroke: var(--accent); stroke-width: 4; }
  .s-tree .val.hi { fill: var(--accent); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-tree" data-screen-label="08 Issue tree">
    <nav class="tracker" data-role="footer" aria-label="Deck sections"><span>Where cost sits</span><span class="on">What closing saves</span><span>Options</span><span>Plan</span></nav>
    <div class="sticker" data-role="label">Preliminary</div>
    <h1 class="action">Closing depots is the only lever that reaches €18M a year on its own</h1>
    <div class="body">
      <svg width="1728" height="656" viewBox="0 0 1728 656" role="img"
           aria-label="Issue tree: 3 cost pools split into 6 levers with their yearly saving; closing 3 depots saves €18M, the next largest lever €6M">
        <!-- Links: root to cost pools, cost pools to levers (elbow connectors) -->
        <path class="link" d="M380 346 H430 V346 H480"/>
        <path class="link" d="M380 346 H430 V562 H480"/>
        <path class="link" d="M860 130 H910 V184 H960"/>
        <path class="link" d="M860 346 H910 V292 H960"/>
        <path class="link" d="M860 346 H910 V400 H960"/>
        <path class="link" d="M860 562 H910 V508 H960"/>
        <path class="link" d="M860 562 H910 V616 H960"/>
        <path class="link hi" d="M380 346 H430 V130 H480"/>
        <path class="link hi" d="M860 130 H910 V76 H960"/>
        <!-- Root question -->
        <rect class="root" x="0" y="266" width="380" height="160"/>
        <text class="root-t" x="32" y="326" dominant-baseline="central">Cut yearly cost to</text>
        <text class="root-t" x="32" y="366" dominant-baseline="central">serve by €18M</text>
        <!-- Cost pools: mutually exclusive, together the whole cost to serve -->
        <rect class="node hi" x="480" y="90" width="380" height="80"/>
        <text class="branch-t" x="508" y="130" dominant-baseline="central">Depot fixed cost</text>
        <rect class="node" x="480" y="306" width="380" height="80"/>
        <text class="branch-t" x="508" y="346" dominant-baseline="central">Line-haul cost</text>
        <rect class="node" x="480" y="522" width="380" height="80"/>
        <text class="branch-t" x="508" y="562" dominant-baseline="central">Labor cost per parcel</text>
        <!-- Levers with their yearly saving -->
        <text class="head" x="1728" y="0" text-anchor="end" dominant-baseline="hanging">Yearly saving</text>
        <rect class="node hi" x="960" y="40" width="520" height="72"/>
        <text x="988" y="76" dominant-baseline="central">Close 3 underused depots</text>
        <text class="val hi" x="1728" y="76" text-anchor="end" dominant-baseline="central">€18M</text>
        <rect class="node" x="960" y="148" width="520" height="72"/>
        <text x="988" y="184" dominant-baseline="central">Sublet unused floor space</text>
        <text class="val" x="1728" y="184" text-anchor="end" dominant-baseline="central">€2M</text>
        <rect class="node" x="960" y="256" width="520" height="72"/>
        <text x="988" y="292" dominant-baseline="central">Consolidate routes</text>
        <text class="val" x="1728" y="292" text-anchor="end" dominant-baseline="central">€5M</text>
        <rect class="node" x="960" y="364" width="520" height="72"/>
        <text x="988" y="400" dominant-baseline="central">Renegotiate carrier rates</text>
        <text class="val" x="1728" y="400" text-anchor="end" dominant-baseline="central">€3M</text>
        <rect class="node" x="960" y="472" width="520" height="72"/>
        <text x="988" y="508" dominant-baseline="central">Automate sorting</text>
        <text class="val" x="1728" y="508" text-anchor="end" dominant-baseline="central">€6M</text>
        <rect class="node" x="960" y="580" width="520" height="72"/>
        <text x="988" y="616" dominant-baseline="central">Match shifts to volume</text>
        <text class="val" x="1728" y="616" text-anchor="end" dominant-baseline="central">€4M</text>
      </svg>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: team estimates from the Kestrel depot cost ledger, 2025</span>
      <span class="page" data-role="footer">8</span>
    </div>
  </section>
</div>
</body>
