<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 Bar chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared chrome (Layout grammar in ../guidelines.md) ==== */
  /* Every piece of chrome sits at a fixed position, so nothing moves
     when you flip through the deck. */
  /* Tracker: the deck's sections, current one marked by the accent.
     Each section spans 2 grid columns. */
  .tracker {
    position: absolute; top: var(--tracker-top); left: var(--slide-pad-x);
    display: flex; gap: var(--grid-gutter);
    font-size: var(--fs-micro); line-height: 1.2; color: var(--fg-subtle);
  }
  .tracker span {
    width: calc(2 * var(--grid-col) + var(--grid-gutter));
    padding-top: 12px; border-top: 4px solid var(--border-strong);
  }
  /* Accent job, shared: the current section. */
  .tracker span.on {
    border-top-color: var(--accent); color: var(--fg);
    font-weight: var(--weight-semibold);
  }
  /* Sticker: status of the numbers, top right, only when true. */
  .sticker {
    position: absolute; top: var(--tracker-top); right: var(--slide-pad-x);
    font-size: var(--fs-caption); line-height: 1.2; color: var(--fg-muted);
    border: 2px solid var(--fg-subtle); padding: 6px 20px;
  }
  /* Action title: same place, same size on every content slide. */
  h1.action {
    position: absolute; top: var(--title-top); left: var(--slide-pad-x);
    width: calc(11 * var(--grid-col) + 10 * var(--grid-gutter));
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  /* Evidence area: fixed box under the title band. */
  .body {
    position: absolute; top: var(--body-top); bottom: var(--body-bottom);
    left: var(--slide-pad-x); right: var(--slide-pad-x);
  }
  /* Exhibit subtitle: the measure, its units, and its dates. */
  .exhibit {
    font-size: var(--fs-body); line-height: 1.2; color: var(--fg-muted);
    margin: 0;
  }
  /* Footer: source bottom left, page number bottom right. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: 1.2;
    color: var(--fg-subtle);
  }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }
  svg { display: block; overflow: visible; }

  /* ==== This slide ==== */
  .s-bar .chart { margin-top: 24px; }
  .s-bar svg text { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-bar svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-bar .bar { fill: var(--chart-context); }
  /* Accent job: the depot the title names. */
  .s-bar .bar.hi { fill: var(--chart-highlight); }
  .s-bar .ref { stroke: var(--fg); stroke-width: 2; stroke-dasharray: 8 8; }
  .s-bar .ref-label { fill: var(--fg); }
  .s-bar .bracket { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-bar" data-screen-label="05 Bar chart">
    <nav class="tracker" data-role="footer" aria-label="Deck sections"><span class="on">Where cost sits</span><span>What closing saves</span><span>Options</span><span>Plan</span></nav>
    <div class="sticker" data-role="label">Preliminary</div>
    <h1 class="action">Hull costs €4.10 per parcel, twice the network median of €2.05</h1>
    <div class="body">
      <p class="exhibit">Cost to serve per parcel by depot, €, 2025</p>
      <svg class="chart" width="1728" height="584" role="img"
           aria-label="Cost to serve per parcel for all 11 depots, 2025: Hull €4.10, the network median €2.05"
           data-chart="bar" data-orientation="horizontal" data-unit="€" data-reference="2.05"
           data-labels='["Hull", "Swindon", "Leeds", "Bristol", "York", "Derby", "Luton", "Crewe", "Reading", "Coventry", "Doncaster"]'
           data-series='[{"name": "Cost to serve per parcel", "values": [4.1, 3.45, 3.2, 2.3, 2.1, 2.05, 1.95, 1.9, 1.85, 1.8, 1.7]}]'
           data-highlight="0" data-bracket="0,2" data-bracket-label="Proposed for closure"></svg>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: Kestrel depot cost ledger, 2025; team analysis</span>
      <span class="page" data-role="footer">5</span>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-bar .chart');
    const d = chartData(el), v = d.series[0].values;
    const lx = 200, W = 1000, top = 48, rowH = 49, barH = 32, max = Math.max(...v);
    const ref = Number(el.dataset.reference);
    const fmt = x => '€' + x.toFixed(2);
    let out = '';
    v.forEach((val, i) => {
      const y = top + i * rowH, hi = i === d.highlight ? ' hi' : '';
      out += '<text class="' + hi + '" x="0" y="' + (y + barH / 2) + '" dominant-baseline="central">' + d.labels[i] + '</text>';
      out += '<rect class="bar' + hi + '" x="' + lx + '" y="' + y + '" width="' + (val / max * W) + '" height="' + barH + '"/>';
      out += '<text class="' + hi + '" x="' + (lx + W + 120) + '" y="' + (y + barH / 2) + '" text-anchor="end" dominant-baseline="central">' + fmt(val) + '</text>';
    });
    // Reference line with a direct label, no legend.
    const rx = lx + ref / max * W, bottom = top + v.length * rowH - (rowH - barH);
    out += '<line class="ref" x1="' + rx + '" x2="' + rx + '" y1="' + (top - 8) + '" y2="' + (bottom + 8) + '"/>';
    out += '<text class="ref-label" x="' + (rx - 12) + '" y="20" text-anchor="start">Network median ' + fmt(ref) + '</text>';
    // Bracket on the rows the recommendation names.
    const [a, b] = el.dataset.bracket.split(',').map(Number);
    const bx = lx + W + 200, y1 = top + a * rowH, y2 = top + b * rowH + barH;
    out += '<path class="bracket" d="M' + (bx - 16) + ' ' + y1 + ' H' + bx + ' V' + y2 + ' H' + (bx - 16) + '"/>';
    out += '<text x="' + (bx + 24) + '" y="' + ((y1 + y2) / 2) + '" dominant-baseline="central">' + el.dataset.bracketLabel + '</text>';
    el.innerHTML = out;
  })();
</script>
</body>
</html>
