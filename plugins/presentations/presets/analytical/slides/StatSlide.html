<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 Stat</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared chrome (Layout grammar in ../guidelines.md) ==== */
  /* Every piece of chrome sits at a fixed position, so nothing moves
     when you flip through the deck. */
  /* Tracker: the deck's sections, current one marked by the accent.
     Each section spans 2 grid columns. */
  .tracker {
    position: absolute; top: var(--tracker-top); left: var(--slide-pad-x);
    display: flex; gap: var(--grid-gutter);
    font-size: var(--fs-micro); line-height: 1.2; color: var(--fg-subtle);
  }
  .tracker span {
    width: calc(2 * var(--grid-col) + var(--grid-gutter));
    padding-top: 12px; border-top: 4px solid var(--border-strong);
  }
  /* Accent job, shared: the current section. */
  .tracker span.on {
    border-top-color: var(--accent); color: var(--fg);
    font-weight: var(--weight-semibold);
  }
  /* Sticker: status of the numbers, top right, only when true. */
  .sticker {
    position: absolute; top: var(--tracker-top); right: var(--slide-pad-x);
    font-size: var(--fs-caption); line-height: 1.2; color: var(--fg-muted);
    border: 2px solid var(--fg-subtle); padding: 6px 20px;
  }
  /* Action title: same place, same size on every content slide. */
  h1.action {
    position: absolute; top: var(--title-top); left: var(--slide-pad-x);
    width: calc(11 * var(--grid-col) + 10 * var(--grid-gutter));
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  /* Evidence area: fixed box under the title band. */
  .body {
    position: absolute; top: var(--body-top); bottom: var(--body-bottom);
    left: var(--slide-pad-x); right: var(--slide-pad-x);
  }
  /* Exhibit subtitle: the measure, its units, and its dates. */
  .exhibit {
    font-size: var(--fs-body); line-height: 1.2; color: var(--fg-muted);
    margin: 0;
  }
  /* Footer: source bottom left, page number bottom right. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: 1.2;
    color: var(--fg-subtle);
  }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }
  svg { display: block; overflow: visible; }

  /* ==== This slide ==== */
  /* Number in columns 1 to 5, the arithmetic behind it in 7 to 12. */
  .s-stat .body {
    display: grid;
    grid-template-columns: calc(5 * var(--grid-col) + 4 * var(--grid-gutter)) 1fr;
    column-gap: calc(var(--grid-col) + 2 * var(--grid-gutter));
    align-items: center;
  }
  .s-stat .num {
    font-size: var(--fs-hero); font-weight: var(--weight-semibold);
    line-height: 0.9; letter-spacing: var(--tracking-tight);
  }
  .s-stat .label {
    font-size: var(--fs-body); line-height: var(--lh-normal);
    color: var(--fg-muted); margin: 40px 0 0;
    border-top: 2px solid var(--fg); padding-top: 32px;
  }
  .s-stat svg text { font-size: var(--fs-body); fill: var(--fg-muted); }
  .s-stat svg text.v { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-stat .bar { fill: var(--chart-context); }
  .s-stat .sum { stroke: var(--fg); stroke-width: 3; }
  .s-stat .tie { stroke: var(--fg-subtle); stroke-width: 2; stroke-dasharray: 6 6; }
  /* Accent job: the net saving the number states. */
  .s-stat .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-stat" data-screen-label="09 Stat">
    <nav class="tracker" data-role="footer" aria-label="Deck sections"><span>Where cost sits</span><span class="on">What closing saves</span><span>Options</span><span>Plan</span></nav>
    <h1 class="action">Closing 3 depots saves €18M a year from 2027</h1>
    <div class="body">
      <div>
        <div class="num">€18M</div>
        <p class="label">Net yearly saving once the 8 other depots take the volume</p>
      </div>
      <svg class="chart" width="852" height="480" role="img"
           aria-label="How the saving adds up: €40M running cost of the 3 depots, less €22M added cost at the 8 others, gives €18M"
           data-chart="waterfall" data-orientation="horizontal" data-unit="€M"
           data-labels='["Running cost of the 3 depots", "Added cost at the 8 others", "Net yearly saving"]'
           data-series='[{"name": "Yearly cost, €M", "values": [40, -22, 18]}]'
           data-highlight="2"></svg>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: Kestrel depot cost ledger, 2025; team analysis</span>
      <span class="page" data-role="footer">9</span>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    // Horizontal bridge: start, change, result. Each row is a label line
    // with the value on the right, then the bar under it.
    const el = document.querySelector('.s-stat .chart');
    const d = chartData(el), v = d.series[0].values;
    const W = 852, rowH = 160, barH = 56, scale = W / v[0];
    const fmt = x => (x < 0 ? '\u2212' : '') + '€' + Math.abs(x) + 'M';
    let out = '', run = 0;
    v.forEach((val, i) => {
      const y = i * rowH, last = i === v.length - 1, hi = i === d.highlight ? ' hi' : '';
      const from = last ? 0 : Math.min(run, run + val), len = last ? val : Math.abs(val);
      if (last) out += '<line class="sum" x1="0" x2="' + W + '" y1="' + (y - 20) + '" y2="' + (y - 20) + '"/>';
      out += '<text x="0" y="' + (y + 36) + '">' + d.labels[i] + '</text>';
      out += '<text class="v" x="' + W + '" y="' + (y + 36) + '" text-anchor="end">' + fmt(val) + '</text>';
      out += '<rect class="bar' + hi + '" x="' + (from * scale) + '" y="' + (y + 60) + '" width="' + (len * scale) + '" height="' + barH + '"/>';
      if (i === 1) out += '<line class="tie" x1="' + (18 * scale) + '" x2="' + (18 * scale) + '" y1="' + (y + 60 + barH) + '" y2="' + (y + rowH + 60) + '"/>';
      run = last ? val : run + val;
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
