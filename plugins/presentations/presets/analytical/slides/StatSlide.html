<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 Stat</title>
<style>
  /* ==========================================================
     Synced copy of ../colors.css. Source of truth is the file;
     refresh this block whenever it changes.
     ========================================================== */
  /* ============================================================
     Analytical preset, design tokens ("claim plus number" direction)
     ============================================================
     Source of truth for every slide's embedded variable block.
     Semantic layer only: this preset serves a context, not a
     brand, so it carries no raw brand layer. Slides read these
     names and nothing else.

     Consulting decks read by or presented to decision makers:
     white paper, navy ink, one blue accent, a navy dark scope
     for structure slides.

     Color rule: one accent with one job. The accent marks the
     single thing the audience should look at. Everything else
     is ink or gray. Every text tier holds 4.5:1 or better on
     --bg, --bg-elev, and --bg-subtle in both scopes, and
     --accent holds 4.5:1 on --bg, so it can mark a word or a
     number. Borders are decorative only.
     ============================================================ */

  :root {
    /* =====================================================
       COLOR, Semantic (light theme)
       ===================================================== */
    --bg:                 #FFFFFF;
    --bg-elev:            #FFFFFF;
    --bg-subtle:          #F2F4F7;
    --bg-inverse:         #0B1F33;

    --fg:                 #0B1F33;      /* 16.69 on bg */
    --fg-muted:           #44505E;      /* 8.22 */
    --fg-subtle:          #5B6673;      /* 5.84; source line, page number */
    --fg-inverse:         #F3F6F9;      /* 15.39 on bg-inverse */
    --fg-inverse-muted:   #BAC5D1;
    --fg-inverse-subtle:  #93A1B0;

    --border:             #E1E5EA;      /* decorative only */
    --border-strong:      #C3CAD3;
    --border-inverse:     #27405A;
    --border-accent:      var(--accent);

    --accent:             #1D4ED8;      /* 6.70; the one accent */
    --accent-fg:          #FFFFFF;
    --accent-partner:     #0F766E;      /* second chart series only */

    /* Status (rare on slides, but useful) */
    --status-success:     #2F7A1C;
    --status-warning:     #C77700;
    --status-danger:      #B0271A;
    --status-info:        #00638A;

    /* =====================================================
       COLOR, Charts
       Gray plus one: --chart-highlight marks the story series,
       every other series is --chart-context. The numbered
       categorical colors are for charts where the categories
       are the point, at most 6 series.
       Categorical set passes a Machado 2009 protan, deutan,
       and tritan simulation at CIEDE2000 >= 13 in both scopes.
       No set survives grayscale, so label series directly.
       ===================================================== */
    --chart-highlight:    var(--accent);  /* story series in highlight mode */
    --chart-context:      #9AA5B1;      /* 2.50; the series that are not the story */
    --chart-grid:         var(--border);
    --chart-1:            #1D4ED8;      /* 6.70 */
    --chart-2:            #0F766E;      /* 5.47 */
    --chart-3:            #B45309;      /* 5.02 */
    --chart-4:            #866CFE;      /* 3.76 */
    --chart-5:            #87293D;      /* 8.70 */
    --chart-6:            #374A65;      /* 9.01 */
    --chart-seq-1:        #eff3ff;      /* ColorBrewer Blues 5 */
    --chart-seq-2:        #bdd7e7;
    --chart-seq-3:        #6baed6;
    --chart-seq-4:        #3182bd;
    --chart-seq-5:        #08519c;
    --chart-div-1:        #ca0020;      /* ColorBrewer RdBu 5 */
    --chart-div-2:        #f4a582;
    --chart-div-3:        #f7f7f7;
    --chart-div-4:        #92c5de;
    --chart-div-5:        #0571b0;

    /* =====================================================
       TYPE, slide scale (1920x1080 reference)
       Floors by role (checked by gate H7): body >= 36px,
       captions and chart labels >= 28px, footer and source
       line >= 24px. Use at most three sizes per slide. Never
       shrink text to fit: split the slide or cut words.
       ===================================================== */
    --fs-hero:        200px;     /* The single big number */
    --fs-display:     96px;      /* Structure slides: title, divider, closing */
    --fs-section:     72px;      /* Spare large step */
    --fs-h1:          60px;      /* Action title, same size on every content slide, max 2 lines */
    --fs-h2:          52px;      /* Spare large subhead */
    --fs-h3:          48px;      /* Column heads */
    --fs-subtitle:    44px;      /* Deck subtitle; exhibit subtitle (units and dates) */
    --fs-body-lg:     40px;      /* Executive summary lead phrases */
    --fs-body:        36px;      /* Body text, list items (floor 36px) */
    --fs-caption:     28px;      /* Chart labels, sticker */
    --fs-micro:       24px;      /* Source line, page number; do not go below */

    --lh-tight:         1.12;    /* titles */
    --lh-snug:          1.2;
    --lh-normal:        1.3;     /* body */
    --lh-relaxed:       1.5;

    --tracking-tight:   -0.01em;  /* titles */
    --tracking-normal:  0;
    --tracking-wide:    0.04em;
    --tracking-caps:    0.08em;  /* kept for token parity; tracked caps are banned on slides */

    --weight-regular:   400;
    --weight-medium:    500;
    --weight-semibold:  600;
    --weight-bold:      700;

    /* =====================================================
       SPACING (8pt grid)
       ===================================================== */
    --space-0:   0;
    --space-1:   4px;
    --space-2:   8px;
    --space-3:   12px;
    --space-4:   16px;
    --space-5:   24px;
    --space-6:   32px;
    --space-7:   48px;
    --space-8:   64px;
    --space-9:   80px;
    --space-10:  120px;
    --space-11:  160px;

    /* Slide margins (1920x1080) */
    --slide-pad-x:   96px;
    --slide-pad-y:   72px;
    --slide-w:       1920px;
    --slide-h:       1080px;

    /* =====================================================
       RADIUS
       ===================================================== */
    --r-0:       0;
    --r-sm:      4px;
    --r-md:      6px;
    --r-lg:      8px;
    --r-pill:    999px;

    /* =====================================================
       SHADOWS (use sparingly, flat is default)
       ===================================================== */
    --shadow-0:  none;
    --shadow-1:  0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-2:  0 10px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);

    /* =====================================================
       MOTION
       ===================================================== */
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
    --ease-in-out: cubic-bezier(0.7, 0, 0.3, 1);
    --dur-fast:    150ms;
    --dur-base:    240ms;
    --dur-slow:    400ms;
  }

  /* =====================================================
     DARK SLIDE THEME, apply `.dark` to a slide root.
     Inverse tokens swap to the light values here.
     ===================================================== */
  .dark,
  [data-theme="dark"] {
    --bg:                 #0B1F33;
    --bg-elev:            #13293F;
    --bg-subtle:          #10253A;
    --bg-inverse:         #FFFFFF;

    --fg:                 #F3F6F9;      /* 15.39 */
    --fg-muted:           #BAC5D1;      /* 9.53 */
    --fg-subtle:          #93A1B0;      /* 6.33 */
    --fg-inverse:         #0B1F33;
    --fg-inverse-muted:   #44505E;
    --fg-inverse-subtle:  #5B6673;

    --border:             #27405A;
    --border-strong:      #3A5673;
    --border-inverse:     #E1E5EA;
    --border-accent:      var(--accent);  /* redeclared so it picks up the dark accent */

    --accent:             #7EA6FF;      /* 6.98 */
    --accent-fg:          #0B1F33;
    --accent-partner:     #279985;      /* 4.75; CVD-safe against the accent */

    --chart-highlight:    var(--accent);  /* redeclared so it picks up the dark accent */
    --chart-context:      #56687C;      /* 2.91 */
    --chart-grid:         var(--border);
    --chart-1:            #7EA6FF;      /* 6.98 */
    --chart-2:            #279985;      /* 4.75 */
    --chart-3:            #F5A524;      /* 8.18 */
    --chart-4:            #897CB4;      /* 4.46 */
    --chart-5:            #C5A2B1;      /* 7.29 */
    --chart-6:            #BBD5ED;      /* 11.01 */
  }

  /* ==========================================================
     Synced copy of ../typography.css. Source of truth is the
     file; refresh this block whenever it changes. Font URLs
     gain a ../ prefix here because this file sits in slides/.
     ========================================================== */
  /* ============================================================
     Analytical preset, font stacks
     ============================================================
     IBM Plex Serif (titles, 600) over IBM Plex Sans (body,
     labels, numbers). Both ship unmodified in assets/fonts/ with
     their OFL.txt and load from that relative path, so slides
     make no network request. Plex carries the Reserved Font Name
     "Plex": never subset or otherwise modify these files. Plex
     Sans figures are tabular by default. The mono stack is for
     code samples only, never for labels, and is not vendored.
     ============================================================ */

  @font-face {
    font-family: 'IBM Plex Serif';
    src: url('../assets/fonts/ibm-plex-serif/IBMPlexSerif-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../assets/fonts/ibm-plex-sans/IBMPlexSans-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: block;
  }

  :root {
    --font-display: 'IBM Plex Serif', Georgia, serif;
    --font-sans:    'IBM Plex Sans', Arial, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }

  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  /* Action title: the dominant heading on every content slide,
     in the same place and size on every slide. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: Source line on the left when the slide shows numbers, the
     page number on the right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 48px 0 88px; }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  .s-stat .evidence {
    display: grid; grid-template-columns: 640px 1fr;
    gap: 120px; align-items: center;
  }
  .s-stat .num {
    font-family: var(--font-sans);
    font-size: var(--fs-hero); font-weight: var(--weight-semibold);
    line-height: 0.9; letter-spacing: var(--tracking-tight);
    color: var(--fg);
  }
  .s-stat .label {
    font-size: var(--fs-body); line-height: var(--lh-normal);
    color: var(--fg-muted); margin-top: 40px; max-width: 620px;
  }
  .s-stat svg { display: block; overflow: visible; }
  .s-stat svg text { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-stat svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-stat .bar { fill: var(--chart-context); }
  /* Accent job: marks the value the big number states. */
  .s-stat .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-stat" data-screen-label="05 Stat">
    <h1 class="action">Closing 3 depots saves €18M a year from 2027</h1>
    <div class="evidence">
      <div>
        <div class="num">€18M</div>
        <div class="label">Yearly saving in cost to serve once the volume moves to the 8 remaining depots</div>
      </div>
      <svg class="chart" width="900" height="300" role="img"
           aria-label="Yearly cost to serve: €129M today, €111M after the 3 closures"
           data-chart="bar" data-orientation="horizontal" data-unit="€M"
           data-labels='["Cost to serve today", "After the 3 closures"]'
           data-series='[{"name": "Yearly cost to serve", "values": [129, 111]}]'
           data-highlight="1"></svg>
    </div>
    <div class="footer">
      <span class="source" data-role="source">Source: Kestrel depot cost ledger, 2025; team analysis</span>
      <span class="page" data-role="footer">9</span>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-stat .chart');
    const d = chartData(el), v = d.series[0].values;
    const W = 900, max = Math.max(...v);
    const fmt = x => '€' + x + 'M a year';
    let out = '';
    v.forEach((val, i) => {
      const y = i * 150, hi = i === d.highlight ? ' hi' : '';
      out += '<text class="' + hi + '" x="0" y="' + (y + 28) + '">' + d.labels[i] + ': ' + fmt(val) + '</text>';
      out += '<rect class="bar' + hi + '" x="0" y="' + (y + 48) + '" width="' + (val / max * W) + '" height="64"/>';
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
