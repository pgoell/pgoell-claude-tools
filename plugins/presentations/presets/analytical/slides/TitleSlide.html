<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 Title</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared chrome (Layout grammar in ../guidelines.md) ==== */
  /* Every piece of chrome sits at a fixed position, so nothing moves
     when you flip through the deck. */
  /* Tracker: the deck's sections, current one marked by the accent.
     Each section spans 2 grid columns. */
  .tracker {
    position: absolute; top: var(--tracker-top); left: var(--slide-pad-x);
    display: flex; gap: var(--grid-gutter);
    font-size: var(--fs-micro); line-height: 1.2; color: var(--fg-subtle);
  }
  .tracker span {
    width: calc(2 * var(--grid-col) + var(--grid-gutter));
    padding-top: 12px; border-top: 4px solid var(--border-strong);
  }
  /* Accent job, shared: the current section. */
  .tracker span.on {
    border-top-color: var(--accent); color: var(--fg);
    font-weight: var(--weight-semibold);
  }
  /* Sticker: status of the numbers, top right, only when true. */
  .sticker {
    position: absolute; top: var(--tracker-top); right: var(--slide-pad-x);
    font-size: var(--fs-caption); line-height: 1.2; color: var(--fg-muted);
    border: 2px solid var(--fg-subtle); padding: 6px 20px;
  }
  /* Action title: same place, same size on every content slide. */
  h1.action {
    position: absolute; top: var(--title-top); left: var(--slide-pad-x);
    width: calc(11 * var(--grid-col) + 10 * var(--grid-gutter));
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; text-wrap: balance;
  }
  /* Evidence area: fixed box under the title band. */
  .body {
    position: absolute; top: var(--body-top); bottom: var(--body-bottom);
    left: var(--slide-pad-x); right: var(--slide-pad-x);
  }
  /* Exhibit subtitle: the measure, its units, and its dates. */
  .exhibit {
    font-size: var(--fs-body); line-height: 1.2; color: var(--fg-muted);
    margin: 0;
  }
  /* Footer: source bottom left, page number bottom right. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: 1.2;
    color: var(--fg-subtle);
  }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }
  svg { display: block; overflow: visible; }

  /* ==== This slide ==== */
  .s-title .client {
    position: absolute; top: var(--tracker-top); left: var(--slide-pad-x);
    font-size: var(--fs-caption); line-height: 1.2; color: var(--fg);
    font-weight: var(--weight-semibold);
  }
  .s-title h1 {
    position: absolute; top: 380px; left: var(--slide-pad-x);
    width: calc(10 * var(--grid-col) + 9 * var(--grid-gutter));
    font-family: var(--font-display);
    font-size: var(--fs-display); font-weight: var(--weight-semibold);
    line-height: var(--lh-tight); letter-spacing: var(--tracking-tight);
    margin: 0; text-wrap: balance;
  }
  .s-title .sub {
    position: absolute; top: 640px; left: var(--slide-pad-x);
    width: calc(10 * var(--grid-col) + 9 * var(--grid-gutter));
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 0;
  }
  /* Document block: who it is for, when, by whom, on the 12-column grid. */
  .s-title .meta {
    position: absolute; left: var(--slide-pad-x); right: var(--slide-pad-x);
    bottom: 120px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    column-gap: var(--grid-gutter);
    border-top: 2px solid var(--border-strong); padding-top: 32px;
    font-size: var(--fs-caption); line-height: var(--lh-snug);
  }
  .s-title .meta .k { color: var(--fg-subtle); }
  .s-title .meta .v { color: var(--fg); font-weight: var(--weight-semibold); margin-top: 4px; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-title" data-screen-label="01 Title">
    <div class="client" data-role="caption">Kestrel Logistics</div>
    <div class="sticker" data-role="label">Draft for discussion</div>
    <h1>Kestrel can cut cost to serve by 14% by closing 3 of 11 depots</h1>
    <p class="sub">Depot network review for the board</p>
    <div class="meta">
      <div><div class="k" data-role="caption">Prepared for</div><div class="v" data-role="caption">Kestrel Logistics board</div></div>
      <div><div class="k" data-role="caption">Date</div><div class="v" data-role="caption">12 March 2026</div></div>
      <div><div class="k" data-role="caption">Prepared by</div><div class="v" data-role="caption">Network strategy team</div></div>
    </div>
  </section>
</div>
</body>
</html>
