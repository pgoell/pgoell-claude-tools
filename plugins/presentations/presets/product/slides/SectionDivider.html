<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 Section divider</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== The ruled page ====
     Rails at the 96px margins and the two band rules are drawn as
     hairlines in --border-strong, full bleed, in a layer above the
     content so filled cells never hide them. Crosshairs (.x) mark where a band rule meets
     a rail. Everything below positions on the 144px columns. */
  .ruled::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(var(--border-strong), var(--border-strong)) 96px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 1823px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-title) / 100% 1px no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-foot) / 100% 1px no-repeat;
  }
  .x {
    position: absolute; z-index: 2; width: 33px; height: 33px; margin: -16px 0 0 -16px;
    background:
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 16px 0 / 1px 100% no-repeat,
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 0 16px / 100% 1px no-repeat;
  }

  /* Action title: top left of the title band, same place and size on
     every content slide, text inset one cell pad from the left rail. */
  h1.action {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px;
    width: 1520px; margin: 0;
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Evidence band: between the two band rules, rail to rail. */
  .ev {
    position: absolute; left: 96px; top: var(--band-title);
    width: 1728px; height: calc(var(--band-foot) - var(--band-title));
  }
  /* Footer band: source line only, and only when the slide shows numbers. */
  .source {
    position: absolute; left: calc(96px + var(--cell-pad)); top: var(--band-foot);
    height: calc(1080px - var(--band-foot)); display: flex; align-items: center;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Elevated panel: the surface for product objects (UI frames,
     terminals, charts). Flat cells carry text; panels carry things. */
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
  }
  .mono { font-family: var(--font-mono); }
  /* Numbers align: tabular lining figures everywhere a number sits. */
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Section title sits on the middle rule; under it, the deck's
     sections as ruled cells, the current one lifted onto --bg-elev.
     The tracker is the deck's real order, so it may repeat. */
  .s-section { --band-title: 680px; --band-foot: 880px; }
  .s-section h1 {
    position: absolute; left: calc(96px + var(--cell-pad)); bottom: calc(1080px - 680px + 40px);
    width: 1520px; margin: 0;
    font-size: var(--fs-display); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-display); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  .s-section .track {
    position: absolute; left: 96px; top: 680px; width: 1728px; height: 200px;
    display: grid; grid-template-columns: repeat(3, 576px);
    margin: 0; padding: 0; list-style: none;
  }
  .s-section .track li {
    padding: 40px var(--cell-pad) 0;
    font-size: var(--fs-body); line-height: var(--lh-snug);
    color: var(--fg-subtle);
    border-left: 1px solid var(--border-strong);
  }
  .s-section .track li:first-child { border-left: 0; }
  .s-section .track li.now { background: var(--bg-elev); color: var(--fg); }
  .s-section .track .step { display: block; font-size: var(--fs-caption); margin-bottom: 12px; color: inherit; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-section dark ruled" data-screen-label="02 Section divider">
    <i class="x" aria-hidden="true" style="left:96px;top:680px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:680px"></i>
    <i class="x" aria-hidden="true" style="left:96px;top:880px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:880px"></i>
    <h1>Your team's builds, cached once</h1>
    <ol class="track" aria-label="Sections">
      <li><span class="step" data-role="label">Part 1</span>Faster runs</li>
      <li class="now"><span class="step" data-role="label">Part 2</span>Shared cache</li>
      <li><span class="step" data-role="label">Part 3</span>Rollout</li>
    </ol>
  </section>
</div>
</body>
</html>
