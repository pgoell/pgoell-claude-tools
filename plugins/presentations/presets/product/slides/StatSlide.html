<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 Stat</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== The ruled page ====
     Rails at the 96px margins and the two band rules are drawn as
     hairlines in --border-strong, full bleed, in a layer above the
     content so filled cells never hide them. Crosshairs (.x) mark where a band rule meets
     a rail. Everything below positions on the 144px columns. */
  .ruled::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(var(--border-strong), var(--border-strong)) 96px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 1823px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-title) / 100% 1px no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-foot) / 100% 1px no-repeat;
  }
  .x {
    position: absolute; z-index: 2; width: 33px; height: 33px; margin: -16px 0 0 -16px;
    background:
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 16px 0 / 1px 100% no-repeat,
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 0 16px / 100% 1px no-repeat;
  }

  /* Action title: top left of the title band, same place and size on
     every content slide, text inset one cell pad from the left rail. */
  h1.action {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px;
    width: 1520px; margin: 0;
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Evidence band: between the two band rules, rail to rail. */
  .ev {
    position: absolute; left: 96px; top: var(--band-title);
    width: 1728px; height: calc(var(--band-foot) - var(--band-title));
  }
  /* Footer band: source line only, and only when the slide shows numbers. */
  .source {
    position: absolute; left: calc(96px + var(--cell-pad)); top: var(--band-foot);
    height: calc(1080px - var(--band-foot)); display: flex; align-items: center;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Elevated panel: the surface for product objects (UI frames,
     terminals, charts). Flat cells carry text; panels carry things. */
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
  }
  .mono { font-family: var(--font-mono); }
  /* Numbers align: tabular lining figures everywhere a number sits. */
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* One number at hero size with tight tracking, then the week it
     comes from as a single full-width strip: what CI still takes in
     --chart-context, what came back in --chart-highlight. */
  .s-stat .top {
    position: absolute; left: 0; top: 48px; width: 1728px;
    display: grid; grid-template-columns: 864px 864px; align-items: last baseline;
  }
  .s-stat .big { margin: 0; padding: 0 var(--cell-pad); display: flex; align-items: baseline; gap: 24px; }
  .s-stat .big .n {
    font-size: var(--fs-hero); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-hero); line-height: 1;
  }
  .s-stat .big .u { font-size: var(--fs-h1); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); }
  .s-stat .ctx {
    margin: 0; padding: 0 var(--cell-pad);
    font-size: var(--fs-body); line-height: var(--lh-snug); color: var(--fg-muted); text-wrap: balance;
  }
  .s-stat svg { position: absolute; left: var(--cell-pad); top: 400px; overflow: visible; }
  .s-stat svg text { font-size: var(--fs-body); fill: var(--fg-muted); }
  .s-stat svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-stat .seg { fill: var(--chart-context); }
  .s-stat .seg.hi { fill: var(--chart-highlight); }
  .s-stat .tick { stroke: var(--fg); stroke-width: 2; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-stat ruled" data-screen-label="05 Stat">
    <i class="x" aria-hidden="true" style="left:96px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:96px;top:992px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:992px"></i>
    <h1 class="action">Each beta team got back 38 hours of CI time a week</h1>
    <div class="ev">
      <div class="top">
        <p class="big num"><span class="n">38</span><span class="u">hours</span></p>
        <p class="ctx">Per team, every week, across all 14 beta teams</p>
      </div>
      <svg class="chart" width="1664" height="200" role="img"
           aria-label="CI hours per team per week: 26 still spent, 38 returned, 64 before Relay 3"
           data-chart="bar" data-orientation="horizontal" data-stacked="true" data-unit="h"
           data-labels='["still spent on CI", "returned by Relay 3"]'
           data-series='[{"name": "CI hours per team per week", "values": [26, 38]}]'
           data-highlight="1"></svg>
    </div>
    <div class="source" data-role="source">Source: Relay beta telemetry, 14 teams, 120 repositories, April 2026</div>
  </section>
<script>
  (function () {
    const el = document.querySelector('.s-stat .chart');
    const labels = JSON.parse(el.dataset.labels), v = JSON.parse(el.dataset.series)[0].values;
    const hiIdx = Number(el.dataset.highlight), W = 1664, total = v.reduce((a, b) => a + b, 0);
    let x = 0, out = '';
    v.forEach((val, i) => {
      const w = val / total * W, hi = i === hiIdx ? ' hi' : '';
      out += '<rect class="seg' + hi + '" x="' + x + '" y="72" width="' + (w - (i < v.length - 1 ? 4 : 0)) + '" height="72"/>';
      out += '<text class="' + hi.trim() + '" x="' + x + '" y="40">' + val + ' h ' + labels[i] + '</text>';
      x += w;
    });
    out += '<line class="tick" x1="0" x2="0" y1="60" y2="156"/><line class="tick" x1="' + W + '" x2="' + W + '" y1="60" y2="156"/>';
    out += '<text x="' + W + '" y="196" text-anchor="end">' + total + ' h a week before Relay 3</text>';
    el.innerHTML = out;
  })();
</script>
</div>
</body>
</html>
