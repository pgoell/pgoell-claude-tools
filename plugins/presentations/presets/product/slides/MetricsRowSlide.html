<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>08 Metrics row</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== The ruled page ====
     Rails at the 96px margins and the two band rules are drawn as
     hairlines in --border-strong, full bleed, in a layer above the
     content so filled cells never hide them. Crosshairs (.x) mark where a band rule meets
     a rail. Everything below positions on the 144px columns. */
  .ruled::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(var(--border-strong), var(--border-strong)) 96px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 1823px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-title) / 100% 1px no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-foot) / 100% 1px no-repeat;
  }
  .x {
    position: absolute; z-index: 2; width: 33px; height: 33px; margin: -16px 0 0 -16px;
    background:
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 16px 0 / 1px 100% no-repeat,
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 0 16px / 100% 1px no-repeat;
  }

  /* Action title: top left of the title band, same place and size on
     every content slide, text inset one cell pad from the left rail. */
  h1.action {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px;
    width: 1520px; margin: 0;
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Evidence band: between the two band rules, rail to rail. */
  .ev {
    position: absolute; left: 96px; top: var(--band-title);
    width: 1728px; height: calc(var(--band-foot) - var(--band-title));
  }
  /* Footer band: source line only, and only when the slide shows numbers. */
  .source {
    position: absolute; left: calc(96px + var(--cell-pad)); top: var(--band-foot);
    height: calc(1080px - var(--band-foot)); display: flex; align-items: center;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Elevated panel: the surface for product objects (UI frames,
     terminals, charts). Flat cells carry text; panels carry things. */
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
  }
  .mono { font-family: var(--font-mono); }
  /* Numbers align: tabular lining figures everywhere a number sits. */
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* One lead metric and up to three supporting ones in a single ruled
     row. The lead takes columns 1 to 6 at hero size; the others take
     two columns each at title size. Unequal widths and sizes are the
     point: one number is the story, the rest are context. Labels on
     top, value in the middle, the delta against the old release under
     it, every row of the grid shared so baselines line up. */
  .s-metrics .m {
    position: absolute; left: 0; top: 0; width: 1728px; height: 100%;
    display: grid; grid-template-columns: 864px 288px 288px 288px;
    grid-template-rows: 1fr auto auto auto 1fr;
    background:
      linear-gradient(var(--border), var(--border)) 864px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border), var(--border)) 1152px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border), var(--border)) 1440px 0 / 1px 100% no-repeat;
  }
  .s-metrics .m > * { padding: 0 var(--cell-pad); margin: 0; }
  .s-metrics .k { grid-row: 2; font-size: var(--fs-caption); color: var(--fg-muted); line-height: var(--lh-snug); align-self: end; }
  .s-metrics .v {
    grid-row: 3; align-self: end; white-space: nowrap;
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1; padding-top: 24px;
  }
  .s-metrics .v .u { font-size: var(--fs-caption); font-weight: var(--weight-regular); letter-spacing: 0; color: var(--fg-muted); margin-left: 8px; }
  .s-metrics .lead.v { font-size: var(--fs-hero); letter-spacing: var(--tracking-hero); color: var(--accent); }
  .s-metrics .lead.v .u { font-size: var(--fs-h1); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); color: var(--fg); margin-left: 16px; }
  .s-metrics .d { grid-row: 4; font-size: var(--fs-caption); color: var(--fg-subtle); padding-top: 16px; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-metrics ruled" data-screen-label="08 Metrics row">
    <i class="x" aria-hidden="true" style="left:96px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:96px;top:992px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:992px"></i>
    <h1 class="action">Relay 3 beta runs CI 59% faster for 62% less</h1>
    <div class="ev">
      <div class="m num">
        <p class="k" data-role="label" style="grid-column:1">Median CI run</p>
        <p class="v lead" style="grid-column:1">9<span class="u" data-role="label">min</span></p>
        <p class="d" data-role="caption" style="grid-column:1">was 22 min on Relay 2.4</p>

        <p class="k" data-role="label" style="grid-column:2">p95 CI run</p>
        <p class="v" style="grid-column:2">21<span class="u" data-role="label">min</span></p>
        <p class="d" data-role="caption" style="grid-column:2">was 48 min</p>

        <p class="k" data-role="label" style="grid-column:3">Cost per run</p>
        <p class="v" style="grid-column:3">$0.14</p>
        <p class="d" data-role="caption" style="grid-column:3">was $0.37</p>

        <p class="k" data-role="label" style="grid-column:4">Cache hit rate</p>
        <p class="v" style="grid-column:4">81%</p>
        <p class="d" data-role="caption" style="grid-column:4">new in 3.0</p>
      </div>
    </div>
    <div class="source" data-role="source">Source: Relay beta telemetry, 120 repositories, April 2026; Relay 2.4 baseline, March 2026</div>
  </section>
</div>
</body>
</html>
