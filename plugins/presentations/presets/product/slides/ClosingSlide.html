<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>06 Closing</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== The ruled page ====
     Rails at the 96px margins and the two band rules are drawn as
     hairlines in --border-strong, full bleed, in a layer above the
     content so filled cells never hide them. Crosshairs (.x) mark where a band rule meets
     a rail. Everything below positions on the 144px columns. */
  .ruled::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(var(--border-strong), var(--border-strong)) 96px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 1823px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-title) / 100% 1px no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-foot) / 100% 1px no-repeat;
  }
  .x {
    position: absolute; z-index: 2; width: 33px; height: 33px; margin: -16px 0 0 -16px;
    background:
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 16px 0 / 1px 100% no-repeat,
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 0 16px / 100% 1px no-repeat;
  }

  /* Action title: top left of the title band, same place and size on
     every content slide, text inset one cell pad from the left rail. */
  h1.action {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px;
    width: 1520px; margin: 0;
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Evidence band: between the two band rules, rail to rail. */
  .ev {
    position: absolute; left: 96px; top: var(--band-title);
    width: 1728px; height: calc(var(--band-foot) - var(--band-title));
  }
  /* Footer band: source line only, and only when the slide shows numbers. */
  .source {
    position: absolute; left: calc(96px + var(--cell-pad)); top: var(--band-foot);
    height: calc(1080px - var(--band-foot)); display: flex; align-items: center;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Elevated panel: the surface for product objects (UI frames,
     terminals, charts). Flat cells carry text; panels carry things. */
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
  }
  .mono { font-family: var(--font-mono); }
  /* Numbers align: tabular lining figures everywhere a number sits. */
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Call to action: the ask as a short declarative, the command to
     run in a full-width terminal panel (the accent border marks the
     one thing to do), and where to go next as ruled cells in the footer band. */
  .s-close { --band-title: 352px; --band-foot: 800px; }
  .s-close h1 {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px; width: 1520px; margin: 0;
    font-size: var(--fs-section); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); text-wrap: balance;
  }
  .s-close .term {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 424px; width: 1664px; height: 296px;
    border-color: var(--border-accent); border-width: 2px;
    display: flex; flex-direction: column;
  }
  .s-close .term .bar {
    height: 64px; padding: 0 var(--cell-pad); display: flex; align-items: center;
    border-bottom: 1px solid var(--border-strong);
    font-size: var(--fs-caption); color: var(--fg-subtle);
  }
  .s-close .term code {
    margin: auto var(--cell-pad); font-family: var(--font-mono);
    font-size: var(--fs-section); color: var(--fg); letter-spacing: -0.02em;
  }
  .s-close .term code .p { color: var(--fg-subtle); }
  .s-close .next {
    position: absolute; left: 96px; top: 800px; width: 1728px; height: 192px;
    display: grid; grid-template-columns: 576px 576px 576px; margin: 0;
  }
  .s-close .next div { padding: 40px var(--cell-pad) 0; border-left: 1px solid var(--border-strong); }
  .s-close .next div:first-child { border-left: 0; }
  .s-close .next .k { display: block; font-size: var(--fs-caption); color: var(--fg-subtle); margin-bottom: 12px; }
  .s-close .next .v { font-size: var(--fs-body); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-close dark ruled" data-screen-label="06 Closing">
    <i class="x" aria-hidden="true" style="left:96px;top:352px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:352px"></i>
    <i class="x" aria-hidden="true" style="left:96px;top:800px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:800px"></i>
    <h1>Move your repo to Relay 3 before the 30 June freeze</h1>
    <div class="term panel">
      <div class="bar" data-role="caption">Run in your repository root: writes one relay.toml from your CI config and opens a pull request</div>
      <code><span class="p">$ </span>npx relay migrate</code>
    </div>
    <div class="next">
      <div><span class="k" data-role="label">Docs</span><span class="v mono">relay.example/docs/3</span></div>
      <div><span class="k" data-role="label">Questions</span><span class="v mono">#relay-launch</span></div>
      <div><span class="k" data-role="label">Product lead</span><span class="v">J. Moreau</span></div>
    </div>
  </section>
</div>
</body>
</html>
