<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 Bar chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== The ruled page ====
     Rails at the 96px margins and the two band rules are drawn as
     hairlines in --border-strong, full bleed, in a layer above the
     content so filled cells never hide them. Crosshairs (.x) mark where a band rule meets
     a rail. Everything below positions on the 144px columns. */
  .ruled::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(var(--border-strong), var(--border-strong)) 96px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 1823px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-title) / 100% 1px no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-foot) / 100% 1px no-repeat;
  }
  .x {
    position: absolute; z-index: 2; width: 33px; height: 33px; margin: -16px 0 0 -16px;
    background:
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 16px 0 / 1px 100% no-repeat,
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 0 16px / 100% 1px no-repeat;
  }

  /* Action title: top left of the title band, same place and size on
     every content slide, text inset one cell pad from the left rail. */
  h1.action {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px;
    width: 1520px; margin: 0;
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Evidence band: between the two band rules, rail to rail. */
  .ev {
    position: absolute; left: 96px; top: var(--band-title);
    width: 1728px; height: calc(var(--band-foot) - var(--band-title));
  }
  /* Footer band: source line only, and only when the slide shows numbers. */
  .source {
    position: absolute; left: calc(96px + var(--cell-pad)); top: var(--band-foot);
    height: calc(1080px - var(--band-foot)); display: flex; align-items: center;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Elevated panel: the surface for product objects (UI frames,
     terminals, charts). Flat cells carry text; panels carry things. */
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
  }
  .mono { font-family: var(--font-mono); }
  /* Numbers align: tabular lining figures everywhere a number sits. */
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* The chart lives in an elevated panel with a header strip that
     names the measure and the sample; columns over releases, the
     story release in --chart-highlight, the drop bracketed. */
  .s-bar .panel {
    position: absolute; left: var(--cell-pad); top: 40px; right: var(--cell-pad); bottom: 40px;
    display: flex; flex-direction: column;
  }
  .s-bar .head {
    display: flex; justify-content: space-between; align-items: center;
    height: 88px; padding: 0 var(--cell-pad); border-bottom: 1px solid var(--border);
    font-size: var(--fs-caption); color: var(--fg-muted);
  }
  .s-bar .head .n { color: var(--fg-subtle); }
  .s-bar svg { display: block; margin: auto var(--cell-pad) 32px; overflow: visible; }
  .s-bar svg text { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-bar svg text.val { font-size: var(--fs-body); font-weight: var(--weight-semibold); fill: var(--fg); }
  .s-bar svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-bar .bar { fill: var(--chart-context); }
  .s-bar .bar.hi { fill: var(--chart-highlight); }
  .s-bar .base { stroke: var(--fg); stroke-width: 2; }
  .s-bar .guide { stroke: var(--fg-subtle); stroke-width: 2; stroke-dasharray: 6 8; }
  .s-bar .bracket { stroke: var(--fg); stroke-width: 2; fill: none; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-bar ruled" data-screen-label="04 Bar chart">
    <i class="x" aria-hidden="true" style="left:96px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:96px;top:992px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:992px"></i>
    <h1 class="action">Relay 3 cuts median CI time from 22 to 9 minutes</h1>
    <div class="ev">
      <div class="panel">
        <div class="head" data-role="caption"><span>Median CI run in minutes, by release</span><span class="n">120 beta repositories</span></div>
        <svg class="chart" width="1536" height="440" role="img"
             aria-label="Median CI run in minutes by release: Relay 2.0 26, Relay 2.2 24, Relay 2.4 22, Relay 3 9"
             data-chart="bar" data-orientation="vertical" data-unit="min"
             data-labels='["Relay 2.0", "Relay 2.2", "Relay 2.4", "Relay 3"]'
             data-series='[{"name": "Median CI run", "values": [26, 24, 22, 9]}]'
             data-highlight="3"></svg>
      </div>
    </div>
    <div class="source" data-role="source">Source: Relay beta telemetry, 120 repositories, releases 2.0 to 3.0, April 2026</div>
  </section>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-bar .chart');
    const d = chartData(el), v = d.series[0].values;
    const slot = 380, bw = 168, base = 380, H = 300, max = Math.max(...v);
    let out = '';
    v.forEach((val, i) => {
      const x = i * slot, h = val / max * H, hi = i === d.highlight ? ' hi' : '';
      out += '<rect class="bar' + hi + '" x="' + x + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '"/>';
      out += '<text class="val" x="' + (x + bw / 2) + '" y="' + (base - h - 20) + '" text-anchor="middle">' + val + '</text>';
      out += '<text class="' + hi.trim() + '" x="' + (x + bw / 2) + '" y="' + (base + 48) + '" text-anchor="middle">' + d.labels[i] + '</text>';
    });
    // Bracket from the previous release's level down to the story bar.
    const h = d.highlight, prev = v[h - 1], cur = v[h];
    const yPrev = base - prev / max * H, yCur = base - cur / max * H, bx = h * slot + bw + 32;
    out += '<line class="guide" x1="' + ((h - 1) * slot + bw) + '" x2="' + (bx + 8) + '" y1="' + yPrev + '" y2="' + yPrev + '"/>';
    out += '<path class="bracket" d="M' + (bx - 8) + ' ' + yPrev + 'H' + bx + 'V' + yCur + 'H' + (bx - 8) + '"/>';
    out += '<text class="val" x="' + (bx + 24) + '" y="' + ((yPrev + yCur) / 2) + '" dominant-baseline="central">−' + (prev - cur) + ' ' + d.unit + '</text>';
    out += '<line class="base" x1="0" x2="' + (v.length * slot - slot + bw) + '" y1="' + base + '" y2="' + base + '"/>';
    el.innerHTML = out;
  })();
</script>
</div>
</body>
</html>
