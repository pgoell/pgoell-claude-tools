<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 Before and after</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== The ruled page ====
     Rails at the 96px margins and the two band rules are drawn as
     hairlines in --border-strong, full bleed, in a layer above the
     content so filled cells never hide them. Crosshairs (.x) mark where a band rule meets
     a rail. Everything below positions on the 144px columns. */
  .ruled::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(var(--border-strong), var(--border-strong)) 96px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 1823px 0 / 1px 100% no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-title) / 100% 1px no-repeat,
      linear-gradient(var(--border-strong), var(--border-strong)) 0 var(--band-foot) / 100% 1px no-repeat;
  }
  .x {
    position: absolute; z-index: 2; width: 33px; height: 33px; margin: -16px 0 0 -16px;
    background:
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 16px 0 / 1px 100% no-repeat,
      linear-gradient(var(--fg-subtle), var(--fg-subtle)) 0 16px / 100% 1px no-repeat;
  }

  /* Action title: top left of the title band, same place and size on
     every content slide, text inset one cell pad from the left rail. */
  h1.action {
    position: absolute; left: calc(96px + var(--cell-pad)); top: 80px;
    width: 1520px; margin: 0;
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Evidence band: between the two band rules, rail to rail. */
  .ev {
    position: absolute; left: 96px; top: var(--band-title);
    width: 1728px; height: calc(var(--band-foot) - var(--band-title));
  }
  /* Footer band: source line only, and only when the slide shows numbers. */
  .source {
    position: absolute; left: calc(96px + var(--cell-pad)); top: var(--band-foot);
    height: calc(1080px - var(--band-foot)); display: flex; align-items: center;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Elevated panel: the surface for product objects (UI frames,
     terminals, charts). Flat cells carry text; panels carry things. */
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
  }
  .mono { font-family: var(--font-mono); }
  /* Numbers align: tabular lining figures everywhere a number sits. */
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Old flow and new flow side by side, columns 1 to 6 and 7 to 12,
     in the same row order so the eye compares across. Step bars share
     one scale, so the new column is visibly shorter. The new flow is
     lifted onto --bg-elev; its bars carry --chart-highlight. */
  .s-ba .col {
    position: absolute; top: 0; width: 864px; height: 100%;
    padding: 40px var(--cell-pad) 0;
  }
  .s-ba .col.old { left: 0; }
  .s-ba .col.new { left: 864px; background: var(--bg-elev); border-left: 1px solid var(--border-strong); }
  .s-ba .hd {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 24px; border-bottom: 1px solid var(--border);
  }
  .s-ba .hd h2 { margin: 0; font-size: var(--fs-body); font-weight: var(--weight-semibold); }
  .s-ba .hd .tot { font-size: var(--fs-h1); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); line-height: 1; }
  .s-ba ol { list-style: none; margin: 0; padding: 0; }
  .s-ba li { padding: 24px 0 20px; border-bottom: 1px solid var(--border); }
  .s-ba li .row { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-body); }
  .s-ba li .row .t { color: var(--fg-muted); }
  .s-ba li .bar { height: 12px; margin-top: 14px; background: var(--chart-context); }
  .s-ba .new li .bar { background: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-ba ruled" data-screen-label="09 Before and after">
    <i class="x" aria-hidden="true" style="left:96px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:288px"></i>
    <i class="x" aria-hidden="true" style="left:96px;top:992px"></i>
    <i class="x" aria-hidden="true" style="left:1823px;top:992px"></i>
    <h1 class="action">Relay 3 skips the full rebuild and the full test suite</h1>
    <div class="ev chart num" data-chart="bar" data-orientation="horizontal" data-unit="min"
         data-labels='["Relay 2.4", "Relay 3"]'
         data-series='[{"name": "Relay 2.4", "steps": ["Install dependencies", "Build every package", "Run the full test suite", "Deploy preview"], "values": [3, 6, 11, 2]}, {"name": "Relay 3", "steps": ["Restore the shared cache", "Build changed packages", "Run affected tests", "Deploy preview"], "values": [1, 2, 4, 2]}]'
         data-highlight="1">
      <div class="col old">
        <div class="hd"><h2>Relay 2.4</h2><span class="tot">22 min</span></div>
        <ol></ol>
      </div>
      <div class="col new">
        <div class="hd"><h2>Relay 3</h2><span class="tot">9 min</span></div>
        <ol></ol>
      </div>
    </div>
    <div class="source" data-role="source">Source: Relay beta telemetry, median run per step, 120 repositories, April 2026</div>
  </section>
<script>
  // Step rows and bars from the data attribute; one scale for both flows.
  (function () {
    const ev = document.querySelector('.s-ba .ev');
    const series = JSON.parse(ev.dataset.series), unit = ev.dataset.unit;
    const max = Math.max(...series.flatMap(s => s.values)), W = 800;
    ev.querySelectorAll('ol').forEach((ol, i) => {
      ol.innerHTML = series[i].steps.map((step, j) => {
        const v = series[i].values[j];
        return '<li><div class="row"><span>' + step + '</span><span class="t">' + v + ' ' + unit + '</span></div>' +
               '<div class="bar" style="width:' + (v / max * W) + 'px"></div></li>';
      }).join('');
    });
  })();
</script>
</div>
</body>
</html>
