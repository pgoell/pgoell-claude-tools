<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 Agenda</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-agenda .list { max-width: 1500px; }
  .s-agenda .item {
    position: relative;
    display: grid; grid-template-columns: 1fr auto;
    align-items: baseline; gap: 48px;
    padding: 28px 0 28px 40px;
    border-top: 1px solid var(--border);
  }
  .s-agenda .item:last-child { border-bottom: 1px solid var(--border); }
  .s-agenda .label { font-size: var(--fs-body); color: var(--fg-muted); }
  .s-agenda .dur { font-size: var(--fs-caption); color: var(--fg-subtle); }
  /* Accent job: marks the part the speaker is on now. */
  .s-agenda .item.current .label { color: var(--fg); font-weight: var(--weight-semibold); }
  .s-agenda .item.current::before {
    content: ''; position: absolute;
    left: 0; top: 28px; bottom: 28px; width: 6px;
    background: var(--accent);
  }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-agenda" data-screen-label="03 Agenda">
    <h1 class="action">We cover 4 topics in 55 minutes and end with the pilot decision</h1>
    <div class="list evidence">
      <div class="item current">
        <span class="label">Why each new use case takes 6 months today</span>
        <span class="dur" data-role="label">10 min</span>
      </div>
      <div class="item">
        <span class="label">How we deliver in 12 weeks</span>
        <span class="dur" data-role="label">15 min</span>
      </div>
      <div class="item">
        <span class="label">What 3 client migrations delivered</span>
        <span class="dur" data-role="label">20 min</span>
      </div>
      <div class="item">
        <span class="label">The pilot decision and next steps</span>
        <span class="dur" data-role="label">10 min</span>
      </div>
    </div>
    <div class="footer">
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
</body>
</html>
