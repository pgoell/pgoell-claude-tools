<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>26 Positioning map</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  /* Two thin axes crossing at the center of a 10-column plot (1395px,
     columns 2 to 11), plain-language ends instead of scales, the
     shortlist as small neutral dots with names, and one ring round
     the region nobody holds. No quadrant fills and no "us" plotted:
     the argument is the empty space. */
  .s-pos svg { display: block; overflow: visible; }
  .s-pos .axis { stroke: var(--fg-subtle); stroke-width: 2; }
  .s-pos .dot { fill: var(--chart-context); stroke: var(--fg-subtle); stroke-width: 2; }
  .s-pos svg text { font-size: var(--fs-caption); }
  .s-pos svg text.end { fill: var(--fg-muted); }
  .s-pos svg text.name { fill: var(--fg); }
  /* Accent job: marks the empty region the title names. */
  .s-pos .ring { fill: none; stroke: var(--chart-highlight); stroke-width: 5; }
  .s-pos svg text.gap { font-size: var(--fs-body); font-weight: var(--weight-semibold); fill: var(--fg); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-pos" data-screen-label="26 Positioning map">
    <h1 class="action">No option on the retailer&rsquo;s shortlist starts fast and covers every&nbsp;workload</h1>
    <div class="evidence">
      <svg class="map" width="1680" height="600" role="img"
           aria-label="7 shortlisted options placed by speed to start and share of workloads covered; none is fast and covers every workload"
           data-x-ends='["Slow to start","Fast to start"]'
           data-y-ends='["Covers one workload","Covers every workload"]'
           data-labels='["Global systems integrator","In-house rebuild","Cloud vendor services","Offshore delivery team","Lift-and-shift specialist","Point-tool vendors","Contract data engineers"]'
           data-x='[-0.62,-0.84,-0.2,-0.5,0.46,0.66,0.1]'
           data-y='[0.7,0.3,0.1,-0.36,-0.4,-0.84,-0.66]'
           data-side='["r","r","l","r","r","r","r"]'
           data-gap='[0.52,0.58]' data-gap-label='["Open: fast to start","and every workload"]'></svg>
    </div>
    <div class="footer">
      <span class="source">Source: Acme review of the retailer&rsquo;s 7-option shortlist, 2026</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-pos .map');
    const J = k => JSON.parse(el.dataset[k]);
    const names = J('labels'), xs = J('x'), ys = J('y'), side = J('side'), gap = J('gap');
    const xe = J('xEnds'), ye = J('yEnds'), gl = J('gapLabel');
    // Plot spans columns 2 to 11 of the 12-column grid.
    const left = 142.7, right = 1537.3, top = 40, bottom = 560;
    const cx = (left + right) / 2, cy = (top + bottom) / 2;
    const X = v => cx + v * (right - left) / 2, Y = v => cy - v * (bottom - top) / 2;
    let out = '';
    out += '<line class="axis" x1="' + left + '" x2="' + right + '" y1="' + cy + '" y2="' + cy + '"/>';
    out += '<line class="axis" x1="' + cx + '" x2="' + cx + '" y1="' + top + '" y2="' + bottom + '"/>';
    out += '<text class="end" x="' + left + '" y="' + (cy + 44) + '">' + xe[0] + '</text>';
    out += '<text class="end" x="' + right + '" y="' + (cy + 44) + '" text-anchor="end">' + xe[1] + '</text>';
    out += '<text class="end" x="' + (cx - 20) + '" y="' + (top + 10) + '" text-anchor="end">' + ye[1] + '</text>';
    out += '<text class="end" x="' + (cx - 20) + '" y="' + bottom + '" text-anchor="end">' + ye[0] + '</text>';
    names.forEach((n, i) => {
      const x = X(xs[i]), y = Y(ys[i]), flip = side[i] === 'l';
      out += '<circle class="dot" cx="' + x + '" cy="' + y + '" r="12"/>';
      out += '<text class="name" x="' + (flip ? x - 24 : x + 24) + '" y="' + (y + 10) + '"' + (flip ? ' text-anchor="end"' : '') + '>' + n + '</text>';
    });
    const gx = X(gap[0]), gy = Y(gap[1]);
    out += '<ellipse class="ring" cx="' + gx + '" cy="' + gy + '" rx="240" ry="124"/>';
    out += '<text class="gap" x="' + gx + '" y="' + (gy - 8) + '" text-anchor="middle">' + gl[0] + '</text>';
    out += '<text class="gap" x="' + gx + '" y="' + (gy + 44) + '" text-anchor="middle">' + gl[1] + '</text>';
    el.innerHTML = out;
  })();
</script>
</body>
</html>
