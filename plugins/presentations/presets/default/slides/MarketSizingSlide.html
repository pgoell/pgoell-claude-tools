<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>25 Market sizing</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  /* Three separate circles in one row, one per 4-column slot, each
     area true to its figure, shrinking left to right on one shared
     bottom line. One unit throughout, so the row reads as a funnel.
     Labels share one baseline under the largest circle. */
  .s-size svg { display: block; overflow: visible; }
  .s-size .ctx { fill: var(--chart-context); }
  /* Accent job: marks the part the pilot takes on. */
  .s-size .hi { fill: var(--chart-highlight); }
  .s-size svg text { font-variant-numeric: tabular-nums lining-nums; }
  .s-size svg text.fig { font-size: var(--fs-h2); font-weight: var(--weight-semibold); fill: var(--fg); }
  .s-size svg text.fig.on-hi { fill: var(--fg-inverse); }
  /* A figure too wide for its circle sits just above it. */
  .s-size svg text.fig.above-hi { fill: var(--accent-ink); }
  .s-size svg text.name { font-size: var(--fs-caption); font-weight: var(--weight-semibold); fill: var(--fg); }
  .s-size svg text.sub { font-size: var(--fs-caption); fill: var(--fg-muted); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-size" data-screen-label="25 Market sizing">
    <h1 class="action">The 3 pilot workloads carry $9M of the retailer&rsquo;s $120M yearly data run&nbsp;cost</h1>
    <div class="evidence">
      <svg class="chart" width="1680" height="600" role="img"
           aria-label="Yearly data run cost: whole estate $120M, 11 candidate workloads $52M, 3 pilot workloads $9M"
           data-chart="bubble" data-unit="$M"
           data-labels='["Whole data estate","11 candidate workloads","3 pilot workloads"]'
           data-sublabels='["Yearly run cost today","Assessed for migration","Moved in the 12-week pilot"]'
           data-series='[{"name":"Yearly data run cost","values":[120,52,9]}]'
           data-highlight="2"></svg>
    </div>
    <div class="footer">
      <span class="source">Source: Acme workload assessment, global retailer, 2025 run cost, 2026</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-size .chart');
    const d = chartData(el), v = d.series[0].values;
    const subs = JSON.parse(el.dataset.sublabels);
    // Area true to value: radius grows with the square root.
    const maxR = 240, max = Math.max(...v), slot = 1680 / 3;
    const R = x => maxR * Math.sqrt(x / max);
    const labelY = 2 * maxR + 64;
    let out = '';
    v.forEach((val, i) => {
      const r = R(val), cx = slot * i + slot / 2, cy = 2 * maxR - r, hi = i === d.highlight;
      out += '<circle class="' + (hi ? 'hi' : 'ctx') + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
      const inside = 2 * r > 56 * 0.6 * String(val).length + 150;
      const cls = 'fig' + (inside ? (hi ? ' on-hi' : '') : (hi ? ' above-hi' : ''));
      out += '<text class="' + cls + '" x="' + cx + '" y="' + (inside ? cy + 20 : cy - r - 24) + '" text-anchor="middle">$' + val + 'M</text>';
      out += '<text class="name" x="' + cx + '" y="' + labelY + '" text-anchor="middle">' + d.labels[i] + '</text>';
      out += '<text class="sub" x="' + cx + '" y="' + (labelY + 40) + '" text-anchor="middle">' + subs[i] + '</text>';
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
