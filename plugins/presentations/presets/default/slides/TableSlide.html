<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>15 Table</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-table table {
    width: 100%; border-collapse: collapse;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .s-table th {
    font-size: var(--fs-caption); font-weight: var(--weight-regular);
    color: var(--fg-muted); text-align: left;
    padding: 0 32px 20px;
    border-bottom: 2px solid var(--fg-subtle);
  }
  .s-table td {
    font-size: var(--fs-body);
    padding: 28px 32px;
    border-bottom: 1px solid var(--border);
  }
  .s-table th:first-child, .s-table td:first-child { padding-left: 0; }
  .s-table .n { text-align: right; }
  /* Accent job: marks the column the title names. */
  .s-table .hi { background: var(--brand-green-tint); font-weight: var(--weight-semibold); }
  .s-table th.hi { color: var(--fg); border-bottom-color: var(--accent); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-table" data-screen-label="15 Table">
    <h1 class="action">All 3 client migrations reached production within 16 weeks</h1>
    <div class="evidence">
      <table>
        <thead>
          <tr>
            <th>Client</th>
            <th class="n">Workloads moved</th>
            <th class="n hi">Weeks to production</th>
            <th class="n">Yearly saving</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Global retailer</td><td class="n">40</td><td class="n hi">14</td><td class="n">$52M</td></tr>
          <tr><td>Regional bank</td><td class="n">22</td><td class="n hi">11</td><td class="n">$31M</td></tr>
          <tr><td>Insurer</td><td class="n">31</td><td class="n hi">16</td><td class="n">$37M</td></tr>
        </tbody>
      </table>
    </div>
    <div class="footer">
      <span class="source">Source: Acme delivery records, 3 client migrations, 2023-2025</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
</body>
</html>
