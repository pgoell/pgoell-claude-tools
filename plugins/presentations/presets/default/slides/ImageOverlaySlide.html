<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>18 Image overlay</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-img { justify-content: flex-start; }
  /* Stand-in evidence image: a schematic store map drawn inline.
     Real decks place a real evidence photo or map here, at least
     1920x1080, as the full-bleed layer. */
  .s-img .image { position: absolute; inset: 0; display: block; }
  .s-img .image .land { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.18); stroke-width: 2; }
  .s-img .image .road { stroke: rgba(255, 255, 255, 0.08); stroke-width: 2; fill: none; }
  .s-img .image .store { fill: rgba(250, 250, 247, 0.55); }
  /* Accent job: marks the 6 distribution centers the caption names. */
  .s-img .image .dc { fill: var(--accent); }
  .s-img .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      var(--brand-deep) 0%, var(--brand-deep) 40%,
      rgba(27, 49, 57, 0.6) 55%, rgba(27, 49, 57, 0) 68%);
  }
  .s-img h1.action, .s-img .caption { position: relative; max-width: 1040px; }
  .s-img .caption {
    margin-top: 48px;
    font-size: var(--fs-caption); line-height: var(--lh-normal);
    color: var(--fg-muted); max-width: 760px;
  }
  .s-img .footer { z-index: 1; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-img dark" data-screen-label="18 Image overlay">
    <svg class="image" width="1920" height="1080" role="img"
         aria-label="Schematic map of 1,200 stores and 6 distribution centers"
         data-stores="1200" data-dcs='[[1320,300],[1620,230],[1290,650],[1540,520],[1770,760],[1450,860]]'></svg>
    <div class="overlay"></div>
    <h1 class="action">1,200 stores now restock from sales data under 1 hour old</h1>
    <p class="caption">Each dot is a store. Green squares mark the 6 distribution centers that plan restocking from the hourly feed.</p>
    <div class="footer">
      <span class="source">Source: Global retailer store network and data feed logs, 2025</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-img .image');
    const n = Number(el.dataset.stores), dcs = JSON.parse(el.dataset.dcs);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let out = '<path class="land" d="M 820 -20 C 900 140 760 260 880 420 C 980 560 820 700 940 860 C 1010 960 980 1040 1000 1100 L 1940 1100 L 1940 -20 Z"/>';
    for (let i = 0; i < 9; i++) {
      out += '<path class="road" d="M ' + (900 + i * 120) + ' -20 C ' + (960 + i * 110) + ' 400 ' + (880 + i * 130) + ' 700 ' + (940 + i * 120) + ' 1100"/>';
      out += '<path class="road" d="M 860 ' + (i * 130) + ' C 1200 ' + (i * 130 + 60) + ' 1600 ' + (i * 130 - 40) + ' 1940 ' + (i * 130 + 20) + '"/>';
    }
    for (let i = 0; i < n; i++) {
      const c = dcs[i % dcs.length];
      const r = 170 * Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * 0.55, a = rnd() * 2 * Math.PI;
      const x = c[0] + r * Math.cos(a), y = c[1] + r * Math.sin(a) * 0.8;
      if (x > 900 && x < 1920 && y > 0 && y < 1080) out += '<circle class="store" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5"/>';
    }
    dcs.forEach(c => { out += '<rect class="dc" x="' + (c[0] - 14) + '" y="' + (c[1] - 14) + '" width="28" height="28"/>'; });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
