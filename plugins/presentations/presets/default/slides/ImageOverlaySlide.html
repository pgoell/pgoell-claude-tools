<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>18 Image overlay</title>
<style>
  /* ==========================================================
     Synced copy of ../colors.css. Source of truth is the file;
     refresh this block whenever it changes.
     ========================================================== */
  /* ============================================================
     Default preset, design tokens ("quiet" direction)
     ============================================================
     Source of truth for every slide's embedded variable block.
     Raw brand layer first, semantic layer second; slides read
     only the semantic names unless a specific raw value is the
     point (charts, swatches).

     Color rule: one accent with one job. The accent marks the
     single thing the audience should look at (the highlighted
     series, the current step, the new state). Everything else
     is ink or gray. The ember and lava values stay for charts
     that need a second series color; slides do not use them as
     a second accent.
     ============================================================ */

  :root {
    /* =====================================================
       COLOR, Brand (raw layer)
       ===================================================== */
    --brand-green:        #86BC24;   /* Bright accent green; graphics only, fails as text on white */
    --brand-green-dark:   #5C8A18;   /* Pressed / hover variant, text-safe ramp step */
    --brand-green-tint:   #E5F2C9;   /* Background wash */
    --brand-ink:          #0F0B0B;   /* Headlines, warmer than pure black */

    --brand-ember:        #FF3621;   /* Warm red-orange, secondary accent */
    --brand-ember-dark:   #D62914;   /* Pressed */
    --brand-ember-tint:   #FFE3DE;
    --brand-deep:         #1B3139;   /* Deep blue-green for dark slides */
    --brand-oat:          #EEEDE9;   /* Warm off-white */
    --brand-lava:         #FF8B6B;   /* Secondary warm */
    --brand-navy:         #00263A;   /* Secondary deep */

    /* =====================================================
       COLOR, Semantic (light theme, default)
       ===================================================== */
    --bg:                 #FAFAF7;   /* Slide background, warmer than #fff */
    --bg-elev:            #FFFFFF;   /* Card / tile surface */
    --bg-subtle:          #F2F2EC;   /* Subtle wash for sections */
    --bg-inverse:         #1B3139;   /* Dark slide background */

    --fg:                 #0F0B0B;   /* Primary text */
    --fg-muted:           #595452;   /* Secondary text */
    --fg-subtle:          #6F6B68;   /* Tertiary text: source lines, footer (about 5:1 on --bg) */
    --fg-inverse:         #FAFAF7;   /* Text on dark bg */
    --fg-inverse-muted:   rgba(250, 250, 247, 0.72);
    --fg-inverse-subtle:  rgba(250, 250, 247, 0.50);

    --border:             #E8E8E3;
    --border-strong:      #D2D2CB;
    --border-inverse:     rgba(255, 255, 255, 0.12);
    --border-accent:      var(--brand-green);   /* Accent hairline */

    --accent:             var(--brand-green);   /* The one accent: graphics that mark the focus */
    --accent-fg:          var(--brand-ink);
    --accent-partner:     var(--brand-ember);   /* Second chart series only, never a second accent */

    /* Status (rare on slides, but useful) */
    --status-success:     #2F7A1C;
    --status-warning:     #C77700;
    --status-danger:      #B0271A;
    --status-info:        #00638A;

    /* =====================================================
       TYPE, slide scale (1920x1080 reference)
       Floors by role (starting points, checked by gate H7):
       body >= 36px, captions and chart labels >= 28px,
       footer and source line >= 24px. Use at most three
       sizes per slide. Never shrink text to fit: split the
       slide or cut words.
       ===================================================== */
    --fs-hero:        280px;   /* The single big number */
    --fs-display:     128px;   /* Structure slides: title, divider, closing */
    --fs-section:     96px;    /* Spare large step */
    --fs-h1:          72px;    /* Action title on content slides */
    --fs-h2:          56px;    /* Quote text, large subheads */
    --fs-h3:          48px;    /* Subheads */
    --fs-subtitle:    44px;    /* Deck subtitle */
    --fs-body-lg:     44px;    /* Emphasis body (agenda rows) */
    --fs-body:        40px;    /* Body text, list items (floor 36px) */
    --fs-caption:     28px;    /* Captions, labels, source line, footer */
    --fs-micro:       24px;    /* Floor for footer and source line; do not go below */

    --lh-tight:       1.05;
    --lh-snug:        1.18;
    --lh-normal:      1.35;
    --lh-relaxed:     1.55;

    --tracking-tight:   -0.02em;
    --tracking-normal:  0;
    --tracking-wide:    0.04em;
    --tracking-caps:    0.08em;

    --weight-regular:   400;
    --weight-medium:    500;
    --weight-semibold:  600;
    --weight-bold:      700;

    /* =====================================================
       SPACING (8pt grid)
       ===================================================== */
    --space-0:   0;
    --space-1:   4px;
    --space-2:   8px;
    --space-3:   12px;
    --space-4:   16px;
    --space-5:   24px;
    --space-6:   32px;
    --space-7:   48px;
    --space-8:   64px;
    --space-9:   80px;
    --space-10:  120px;
    --space-11:  160px;

    /* Slide margins (1920x1080) */
    --slide-pad-x:   120px;
    --slide-pad-y:   96px;
    --slide-w:       1920px;
    --slide-h:       1080px;

    /* =====================================================
       RADIUS
       ===================================================== */
    --r-0:       0;
    --r-sm:      4px;
    --r-md:      6px;
    --r-lg:      8px;
    --r-pill:    999px;

    /* =====================================================
       SHADOWS (use sparingly, flat is default)
       ===================================================== */
    --shadow-0:  none;
    --shadow-1:  0 1px 2px rgba(15, 11, 11, 0.04), 0 1px 3px rgba(15, 11, 11, 0.06);
    --shadow-2:  0 10px 24px rgba(15, 11, 11, 0.08), 0 2px 6px rgba(15, 11, 11, 0.04);

    /* =====================================================
       MOTION
       ===================================================== */
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
    --ease-in-out: cubic-bezier(0.7, 0, 0.3, 1);
    --dur-fast:    150ms;
    --dur-base:    240ms;
    --dur-slow:    400ms;
  }

  /* =====================================================
     DARK SLIDE THEME, apply `.dark` to a slide root
     ===================================================== */
  .dark,
  [data-theme="dark"] {
    --bg:            var(--brand-deep);
    --bg-elev:       rgba(255, 255, 255, 0.04);
    --bg-subtle:     rgba(255, 255, 255, 0.02);
    --fg:            var(--fg-inverse);
    --fg-muted:      var(--fg-inverse-muted);
    --fg-subtle:     var(--fg-inverse-subtle);
    --border:        var(--border-inverse);
    --border-strong: rgba(255, 255, 255, 0.24);
    --accent-fg:     var(--fg-inverse);
  }

  /* ==========================================================
     Synced copy of ../typography.css. Source of truth is the
     file; refresh this block whenever it changes.
     ========================================================== */
  /* ============================================================
     Default preset, font stacks
     ============================================================
     Webfonts: "DM Sans" and "JetBrains Mono" (both on Google
     Fonts, OFL-licensed). The preset does not vendor or import
     them, so standalone slides render on the system fallbacks
     below. Deck builds that must render identically offline
     vendor the webfont files per the creating-presentations
     caveats. The gallery sets all text in the sans stack; the
     mono stack is for code samples only, never for labels.
     ============================================================ */

  :root {
    --font-sans:    'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --font-display: var(--font-sans);
  }

  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-img { justify-content: flex-start; }
  /* Stand-in evidence image: a schematic store map drawn inline.
     Real decks place a real evidence photo or map here, at least
     1920x1080, as the full-bleed layer. */
  .s-img .image { position: absolute; inset: 0; display: block; }
  .s-img .image .land { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.18); stroke-width: 2; }
  .s-img .image .road { stroke: rgba(255, 255, 255, 0.08); stroke-width: 2; fill: none; }
  .s-img .image .store { fill: rgba(250, 250, 247, 0.55); }
  /* Accent job: marks the 6 distribution centers the caption names. */
  .s-img .image .dc { fill: var(--accent); }
  .s-img .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      var(--brand-deep) 0%, var(--brand-deep) 40%,
      rgba(27, 49, 57, 0.6) 55%, rgba(27, 49, 57, 0) 68%);
  }
  .s-img h1.action, .s-img .caption { position: relative; max-width: 1040px; }
  .s-img .caption {
    margin-top: 48px;
    font-size: var(--fs-caption); line-height: var(--lh-normal);
    color: var(--fg-muted); max-width: 760px;
  }
  .s-img .footer { z-index: 1; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-img dark" data-screen-label="18 Image overlay">
    <svg class="image" width="1920" height="1080" role="img"
         aria-label="Schematic map of 1,200 stores and 6 distribution centers"
         data-stores="1200" data-dcs='[[1320,300],[1620,230],[1290,650],[1540,520],[1770,760],[1450,860]]'></svg>
    <div class="overlay"></div>
    <h1 class="action">1,200 stores now restock from sales data under 1 hour old</h1>
    <p class="caption">Each dot is a store. Green squares mark the 6 distribution centers that plan restocking from the hourly feed.</p>
    <div class="footer">
      <span class="source">Source: Global retailer store network and data feed logs, 2025</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-img .image');
    const n = Number(el.dataset.stores), dcs = JSON.parse(el.dataset.dcs);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let out = '<path class="land" d="M 820 -20 C 900 140 760 260 880 420 C 980 560 820 700 940 860 C 1010 960 980 1040 1000 1100 L 1940 1100 L 1940 -20 Z"/>';
    for (let i = 0; i < 9; i++) {
      out += '<path class="road" d="M ' + (900 + i * 120) + ' -20 C ' + (960 + i * 110) + ' 400 ' + (880 + i * 130) + ' 700 ' + (940 + i * 120) + ' 1100"/>';
      out += '<path class="road" d="M 860 ' + (i * 130) + ' C 1200 ' + (i * 130 + 60) + ' 1600 ' + (i * 130 - 40) + ' 1940 ' + (i * 130 + 20) + '"/>';
    }
    for (let i = 0; i < n; i++) {
      const c = dcs[i % dcs.length];
      const r = 170 * Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * 0.55, a = rnd() * 2 * Math.PI;
      const x = c[0] + r * Math.cos(a), y = c[1] + r * Math.sin(a) * 0.8;
      if (x > 900 && x < 1920 && y > 0 && y < 1080) out += '<circle class="store" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5"/>';
    }
    dcs.forEach(c => { out += '<rect class="dc" x="' + (c[0] - 14) + '" y="' + (c[1] - 14) + '" width="28" height="28"/>'; });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
