<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>19 Diagram</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-diag svg { display: block; overflow: visible; }
  .s-diag svg text { font-size: var(--fs-body); fill: var(--fg); }
  .s-diag svg text.head { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-diag svg text.sub { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-diag svg text.hi { font-weight: var(--weight-semibold); }
  .s-diag .box { fill: var(--bg-elev); stroke: var(--border-strong); stroke-width: 2; }
  .s-diag .link { stroke: var(--fg-subtle); stroke-width: 3; fill: none; }
  .s-diag .head-arrow { fill: var(--fg-subtle); }
  /* Accent job: marks the one governed copy the title names. */
  .s-diag .box.hi { stroke: var(--accent); stroke-width: 6; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-diag" data-screen-label="19 Diagram">
    <h1 class="action">BI dashboards, ML models, and AI apps all read one governed copy of each table</h1>
    <div class="evidence">
      <svg width="1680" height="540" role="img"
           aria-label="Architecture: 3 sources feed one governed platform, which serves BI, ML, and AI">
        <text class="head" x="0" y="28">Sources</text>
        <text class="head" x="620" y="28">One platform</text>
        <text class="head" x="1300" y="28">Consumers</text>

        <rect class="box" x="0" y="64" width="380" height="120"/>
        <text x="40" y="138">ERP</text>
        <rect class="box" x="0" y="242" width="380" height="120"/>
        <text x="40" y="316">Point of sale</text>
        <rect class="box" x="0" y="420" width="380" height="120"/>
        <text x="40" y="494">CRM</text>

        <rect class="box hi" x="620" y="64" width="440" height="476"/>
        <text class="hi" x="660" y="270">Governed tables</text>
        <text class="sub" x="660" y="322">One copy of each table</text>
        <text class="sub" x="660" y="362">One catalog for access rules</text>

        <rect class="box" x="1300" y="64" width="380" height="120"/>
        <text x="1340" y="138">BI dashboards</text>
        <rect class="box" x="1300" y="242" width="380" height="120"/>
        <text x="1340" y="316">ML models</text>
        <rect class="box" x="1300" y="420" width="380" height="120"/>
        <text x="1340" y="494">AI apps</text>

        <line class="link" x1="380" y1="124" x2="598" y2="124"/><polygon class="head-arrow" points="618,124 596,113 596,135"/>
        <line class="link" x1="380" y1="302" x2="598" y2="302"/><polygon class="head-arrow" points="618,302 596,291 596,313"/>
        <line class="link" x1="380" y1="480" x2="598" y2="480"/><polygon class="head-arrow" points="618,480 596,469 596,491"/>
        <line class="link" x1="1060" y1="124" x2="1278" y2="124"/><polygon class="head-arrow" points="1298,124 1276,113 1276,135"/>
        <line class="link" x1="1060" y1="302" x2="1278" y2="302"/><polygon class="head-arrow" points="1298,302 1276,291 1276,313"/>
        <line class="link" x1="1060" y1="480" x2="1278" y2="480"/><polygon class="head-arrow" points="1298,480 1276,469 1276,491"/>
      </svg>
    </div>
    <div class="footer">
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
</body>
</html>
