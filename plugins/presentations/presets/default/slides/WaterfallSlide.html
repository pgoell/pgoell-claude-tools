<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>14 Waterfall</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-wf svg { display: block; overflow: visible; }
  .s-wf svg text { font-size: var(--fs-caption); fill: var(--fg-muted); font-variant-numeric: tabular-nums lining-nums; }
  .s-wf svg text.val { font-size: var(--fs-body); fill: var(--fg); }
  .s-wf svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-wf .bar { fill: var(--chart-context); }
  .s-wf .bar.neg { fill: var(--bg-subtle); stroke: var(--fg-subtle); stroke-width: 2; }
  .s-wf .bar.total { fill: var(--fg-muted); }
  .s-wf .link { stroke: var(--fg-subtle); stroke-width: 2; stroke-dasharray: 6 6; }
  .s-wf .axis { stroke: var(--fg-subtle); stroke-width: 2; }
  /* Accent job: marks the step the title names. */
  .s-wf .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-wf" data-screen-label="14 Waterfall">
    <h1 class="action">Retired licenses make up $18M of the $40M average yearly saving per client</h1>
    <div class="evidence">
      <svg class="chart" width="1680" height="560" role="img"
           aria-label="Average yearly saving per client, by source, in $M"
           data-chart="waterfall" data-unit="$M"
           data-labels='["Licenses","Compute","Storage","Operations","Platform cost","Net saving"]'
           data-series='[{"name":"Average yearly saving per client","values":[18,11,4,9,-2,40]}]'
           data-totals="[5]" data-highlight="0"></svg>
    </div>
    <div class="footer">
      <span class="source">Source: Acme delivery records, run cost before and after migration, 12 reference accounts, 2021-2025</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-wf .chart');
    const d = chartData(el), v = d.series[0].values;
    const totals = JSON.parse(el.dataset.totals || '[]');
    const colW = 1680 / v.length, barW = 160, y0 = 60, y1 = 480;
    let run = 0;
    const steps = v.map((val, i) => {
      if (totals.includes(i)) { run = val; return [0, val]; }
      const a = run; run += val; return [Math.min(a, run), Math.max(a, run)];
    });
    const top = Math.max(...steps.map(s => s[1])) * 1.1;
    const Y = val => y1 - val / top * (y1 - y0);
    const money = val => (val < 0 ? '-$' : '$') + Math.abs(val) + 'M';
    let out = '<line class="axis" x1="0" x2="1680" y1="' + y1 + '" y2="' + y1 + '"/>';
    steps.forEach((s, i) => {
      const cx = colW * i + colW / 2, x = cx - barW / 2;
      let cls = 'bar';
      if (i === d.highlight) cls += ' hi';
      else if (totals.includes(i)) cls += ' total';
      else if (v[i] < 0) cls += ' neg';
      out += '<rect class="' + cls + '" x="' + x + '" y="' + Y(s[1]) + '" width="' + barW + '" height="' + (Y(s[0]) - Y(s[1])) + '"/>';
      out += '<text class="val' + (i === d.highlight ? ' hi' : '') + '" x="' + cx + '" y="' + (Y(s[1]) - 20) + '" text-anchor="middle">' + money(v[i]) + '</text>';
      out += '<text class="' + (i === d.highlight ? 'hi' : '') + '" x="' + cx + '" y="' + (y1 + 48) + '" text-anchor="middle">' + d.labels[i] + '</text>';
      if (i < steps.length - 1) {
        const level = totals.includes(i) ? s[1] : (v[i] < 0 ? s[0] : s[1]);
        out += '<line class="link" x1="' + (x + barW) + '" x2="' + (x + colW) + '" y1="' + Y(level) + '" y2="' + Y(level) + '"/>';
      }
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
