<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 Timeline</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-time .track { position: relative; }
  .s-time .line {
    position: absolute; top: 75px; left: 0; right: 0; height: 2px;
    background: var(--border-strong);
  }
  .s-time .nodes {
    position: relative;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 48px;
  }
  .s-time .node { display: flex; flex-direction: column; gap: 16px; }
  .s-time .dot {
    width: 24px; height: 24px; border-radius: var(--r-pill);
    background: var(--bg);
    border: 3px solid var(--border-strong);
    margin-bottom: 24px;
  }
  /* Accent job: marks the milestone the title names. */
  .s-time .node.key .dot { background: var(--accent); border-color: var(--accent); }
  .s-time .when { font-size: var(--fs-caption); color: var(--fg-muted); }
  .s-time .what { font-size: var(--fs-body); font-weight: var(--weight-semibold); line-height: 1.1; }
  .s-time .desc { font-size: var(--fs-caption); line-height: var(--lh-normal); color: var(--fg-muted); text-wrap: balance; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-time" data-screen-label="09 Timeline">
    <h1 class="action">3 priority workloads reach production in 12 weeks</h1>
    <div class="track evidence">
      <div class="line"></div>
      <div class="nodes">
        <div class="node">
          <div class="dot"></div>
          <div class="when" data-role="label">Weeks 1-2</div>
          <div class="what">Discovery</div>
          <div class="desc" data-role="label">Workload list and business case</div>
        </div>
        <div class="node">
          <div class="dot"></div>
          <div class="when" data-role="label">Weeks 3-5</div>
          <div class="what">Foundation</div>
          <div class="desc" data-role="label">Catalog, network, identity, CI/CD</div>
        </div>
        <div class="node">
          <div class="dot"></div>
          <div class="when" data-role="label">Weeks 6-10</div>
          <div class="what">Migration</div>
          <div class="desc" data-role="label">3 workloads, parity tested</div>
        </div>
        <div class="node key">
          <div class="dot"></div>
          <div class="when" data-role="label">Weeks 11-12</div>
          <div class="what">Cutover</div>
          <div class="desc" data-role="label">Handover, then 30 days of support</div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
</body>
</html>
