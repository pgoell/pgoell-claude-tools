<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>13 Bar chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  .wordmark {
    display: inline-flex; align-items: center; gap: 0.4em;
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
  }
  .wordmark .wordmark-dot {
    width: 0.55em; height: 0.55em; border-radius: var(--r-pill);
    background: var(--accent);
  }
  /* Action title: the dominant heading on every content slide. */
  h1.action {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: 1.1;
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: optional. Source line on the left when the slide
     shows numbers, the wordmark on the right when the brand
     needs it. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 64px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-caption);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 64px 0 96px; }
  .footer .wordmark { margin-left: auto; font-size: var(--fs-caption); color: var(--fg-subtle); }

  /* ==== This slide ==== */
  .s-bar svg { display: block; overflow: visible; }
  .s-bar svg text { font-size: var(--fs-body); fill: var(--fg-muted); font-variant-numeric: tabular-nums lining-nums; }
  .s-bar svg text.cap { font-size: var(--fs-caption); fill: var(--fg-subtle); }
  .s-bar svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .s-bar .bar { fill: var(--chart-context); }
  .s-bar .axis { stroke: var(--fg-subtle); stroke-width: 2; }
  /* Accent job: marks the client the title names. */
  .s-bar .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-bar" data-screen-label="13 Bar chart">
    <h1 class="action">The global retailer cut its nightly batch window 91%, the most of 5 benchmarked clients</h1>
    <div class="evidence">
      <svg class="chart" width="1680" height="560" role="img"
           aria-label="Reduction in nightly batch window after migration, by client"
           data-chart="bar" data-orientation="horizontal" data-unit="%"
           data-labels='["Global retailer","Regional bank","Insurer","Manufacturer","Pharma group"]'
           data-series='[{"name":"Reduction in nightly batch window","values":[91,78,64,55,42]}]'
           data-highlight="0"></svg>
    </div>
    <div class="footer">
      <span class="source">Source: Acme migration benchmarks, 5 clients, batch window before and after migration, 2023-2025</span>
      <div class="wordmark"><span class="wordmark-dot"></span>ACME</div>
    </div>
  </section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-bar .chart');
    const d = chartData(el), v = d.series[0].values;
    const lx = 400, W = 1100, rowH = 100, barH = 60, top = 60;
    let out = '<text class="cap" x="' + lx + '" y="24">Reduction in nightly batch window after migration</text>';
    v.forEach((val, i) => {
      const y = top + i * rowH, hi = i === d.highlight ? ' hi' : '';
      out += '<text class="' + hi + '" x="0" y="' + (y + barH / 2 + 14) + '">' + d.labels[i] + '</text>';
      out += '<rect class="bar' + hi + '" x="' + lx + '" y="' + y + '" width="' + (val / 100 * W) + '" height="' + barH + '"/>';
      out += '<text class="' + hi + '" x="' + (lx + val / 100 * W + 24) + '" y="' + (y + barH / 2 + 14) + '">' + val + d.unit + '</text>';
    });
    out += '<line class="axis" x1="' + lx + '" x2="' + lx + '" y1="' + (top - 16) + '" y2="' + (top + v.length * rowH - 24) + '"/>';
    el.innerHTML = out;
  })();
</script>
</body>
</html>
