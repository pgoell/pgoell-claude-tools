<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>19 Prediction scorecard</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* A forecast checked against the outcome: the forecast across
     columns one to three, a narrow verdict column in column four,
     what happened across columns five and six. Hairline rows, no
     boxes. The verdict reads down one strip; only a miss carries
     the accent, so the eye lands on it first. */
  .s-score table {
    width: 100%; border-collapse: collapse;
    font-size: 36px; line-height: var(--lh-snug);
    table-layout: fixed;
  }
  .s-score col.fc { width: 888px; }
  .s-score col.vd { width: 296px; }
  .s-score th {
    font-size: var(--fs-caption); font-weight: var(--weight-semibold);
    color: var(--fg-muted); text-align: left;
    padding: 0 24px 12px 0; border-bottom: var(--rule-hair) solid var(--fg);
  }
  .s-score td {
    padding: 22px 24px 22px 0; vertical-align: top;
    border-bottom: var(--rule-hair) solid var(--border);
  }
  .s-score th:last-child, .s-score td:last-child { padding-right: 0; }
  .s-score td.vd { font-weight: var(--weight-semibold); }
  .s-score td.ev { color: var(--fg-muted); }
  /* Accent job: the one forecast that missed. */
  .s-score td.vd.missed { color: var(--accent); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-score" data-screen-label="19 Prediction scorecard">
    <h1 class="action">The 2022 plan got four of six forecasts right and misjudged painted lanes</h1>
    <figure class="figure">
      <table>
        <colgroup><col class="fc"><col class="vd"><col></colgroup>
        <thead>
          <tr><th>Forecast in the 2022 plan, for 2025</th><th>Verdict</th><th>What happened</th></tr>
        </thead>
        <tbody>
          <tr><td>Winter bike trips double on protected corridors</td><td class="vd">Right</td><td class="ev">Tripled, 4k to 12k a day</td></tr>
          <tr><td>All six corridors protected by the end of 2023</td><td class="vd">Right</td><td class="ev">Last one done in Sept 2023</td></tr>
          <tr><td>Collisions involving cyclists fall by a third</td><td class="vd">Right</td><td class="ev">Fell by half</td></tr>
          <tr><td>Winter loss of riders halves</td><td class="vd">Right</td><td class="ev">From 49% to 24%</td></tr>
          <tr><td>Car trips on the corridors fall by a tenth</td><td class="vd">Partly</td><td class="ev">Fell 6%, 96k to 90k</td></tr>
          <tr><td>Painted corridors grow a third as riders spread</td><td class="vd missed">Missed</td><td class="ev">Flat at about 3k a day</td></tr>
        </tbody>
      </table>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Sources: Brenford corridor plan, March 2022; Brenford bike counters; police collision records; city traffic counts</span>
      <span class="page" data-role="footer">19</span>
    </div>
  </section>
</div>
</body>
</html>
