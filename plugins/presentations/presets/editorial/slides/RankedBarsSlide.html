<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>14 Ranked bars</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Ranked bars: twelve places sorted from most to least, names in
     column one, bars across columns two to five, the value at each
     bar end, the subject in the accent among gray peers. Position
     in the ranking is the point, so there is no axis beyond the
     zero line; one note in column six adds the change. */
  .s-rank .bar { fill: var(--chart-context); }
  /* Accent job: Brenford, the place the headline ranks. */
  .s-rank .bar.hi { fill: var(--chart-highlight); }
  .s-rank .chart text.name { fill: var(--fg); }
  .s-rank .chart text.name.hi, .s-rank .chart text.val.hi { font-weight: var(--weight-semibold); }
  .s-rank .axis { stroke: var(--fg); stroke-width: var(--rule-hair); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-rank" data-screen-label="14 Ranked bars">
    <h1 class="action">Brenford keeps two thirds of its summer riders in winter, third of 12 similar cities</h1>
    <p class="standfirst">Winter bike trips as a share of summer bike trips, %, 2025</p>
    <figure class="figure">
      <svg class="chart" width="1728" height="560" role="img"
           aria-label="Winter bike trips as a share of summer, 2025, 12 cities ranked: Aldmoor 78%, Kestwick 71%, Brenford 66%, Halvern 61%, Dunmere 58%, Ostby 55%, Fellbridge 52%, Carrow 49%, Wexham 47%, Tarnley 44%, Saltmarsh 38%, Greyhaven 35%. Brenford was 47% in 2022."
           data-chart="bar" data-orientation="horizontal" data-unit="%"
           data-labels='["Aldmoor","Kestwick","Brenford","Halvern","Dunmere","Ostby","Fellbridge","Carrow","Wexham","Tarnley","Saltmarsh","Greyhaven"]'
           data-series='[{"name":"Winter trips as a share of summer trips, 2025, %","values":[78,71,66,61,58,55,52,49,47,44,38,35]}]'
           data-highlight="2"
           data-annotations='[{"index":2,"text":["Up from 47%","in 2022"]}]'></svg>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Sources: Brenford bike counters; published counter data of 11 cities. Winter is Q1, summer Q3; team calculation</span>
      <span class="page" data-role="footer">14</span>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-rank .chart');
    const labels = JSON.parse(el.dataset.labels), v = JSON.parse(el.dataset.series)[0].values;
    const hl = Number(el.dataset.highlight), ann = JSON.parse(el.dataset.annotations);
    // Names end at column one's right edge; bars start at column two
    // and a full 80% reaches the end of column five.
    const nameX = 248, x0 = 296, w80 = 1136, rowH = 46, barH = 32, y0 = 4;
    const X = p => x0 + p / 80 * w80;
    const rowY = i => y0 + i * rowH;
    let out = '';
    v.forEach((val, i) => {
      const hi = i === hl ? ' hi' : '';
      const y = rowY(i);
      out += '<rect class="bar' + hi + '" x="' + x0 + '" y="' + y + '" width="' + (X(val) - x0) + '" height="' + barH + '"/>';
      out += '<text class="name' + hi + '" x="' + nameX + '" y="' + (y + barH / 2 + 10) + '" text-anchor="end">' + labels[i] + '</text>';
      out += '<text class="val' + hi + '" x="' + (X(val) + 14) + '" y="' + (y + barH / 2 + 10) + '">' + val + '%</text>';
    });
    // The zero line: every bar starts on it.
    out += '<line class="zero" x1="' + x0 + '" x2="' + x0 + '" y1="0" y2="' + (rowY(v.length - 1) + barH + 4) + '"/>';
    // Note in column six, level with the subject row, with a leader back to its value.
    ann.forEach(a => {
      const y = rowY(a.index) + barH / 2;
      const tx = 1480;
      out += '<path class="leader" d="M' + (X(v[a.index]) + 90) + ' ' + y + ' H' + (tx - 16) + '"/>';
      a.text.forEach((line, j) => {
        out += '<text class="ann" x="' + tx + '" y="' + (y + 10 + (j - (a.text.length - 1) / 2) * 38) + '">' + line + '</text>';
      });
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
