<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>11 Table</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Editorial table: ink rule on top, a thin rule under the header,
     no vertical rules, no zebra stripes, figures right aligned in
     tabular lining numerals, one tinted row the headline names, and
     a hairline before the totals. */
  .s-table table {
    width: 100%; border-collapse: collapse;
    font-size: 32px; line-height: var(--lh-snug);
  }
  .s-table col.name { width: 560px; }
  .s-table col.since { width: 420px; }
  .s-table th {
    font-weight: var(--weight-semibold); color: var(--fg-muted); text-align: left;
    padding: 0 16px 14px; border-bottom: var(--rule-hair) solid var(--fg);
    vertical-align: bottom;
  }
  .s-table td { padding: 9px 16px; }
  .s-table .n { text-align: right; }
  .s-table th:first-child, .s-table td:first-child { padding-left: 0; }
  .s-table th:last-child, .s-table td:last-child { padding-right: 0; }
  .s-table tr.total td { border-top: var(--rule-hair) solid var(--border-strong); }
  .s-table td.muted { color: var(--fg-muted); }
  .s-table tr.hi td { background: var(--bg-subtle); font-weight: var(--weight-semibold); }
  /* The tint bleeds 16px past the text edges so the names stay aligned. */
  .s-table tr.hi td:first-child { box-shadow: -16px 0 0 var(--bg-subtle); }
  .s-table tr.hi td:last-child { box-shadow: 16px 0 0 var(--bg-subtle); }
  /* Accent job: the change figure of the corridor the headline names. */
  .s-table tr.hi td.change { color: var(--accent); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-table" data-screen-label="11 Table">
    <h1 class="action">Station Avenue, protected last, grew fastest: 3.2 times its 2022 count</h1>
    <p class="standfirst">Average weekday bike trips in January, thousands</p>
    <figure class="figure">
      <table>
        <colgroup><col class="name"><col class="since"><col><col><col></colgroup>
        <thead>
          <tr><th>Corridor</th><th>Protected since</th><th class="n">2022</th><th class="n">2025</th><th class="n">Change</th></tr>
        </thead>
        <tbody>
          <tr><td>Harbour Road</td><td class="muted">Apr 2022</td><td class="n">0.9</td><td class="n">2.6</td><td class="n change">2.9&times;</td></tr>
          <tr><td>Mill Street</td><td class="muted">Jun 2022</td><td class="n">0.8</td><td class="n">2.4</td><td class="n change">3.0&times;</td></tr>
          <tr><td>Canal Path</td><td class="muted">Oct 2022</td><td class="n">0.7</td><td class="n">2.1</td><td class="n change">3.0&times;</td></tr>
          <tr><td>Northgate</td><td class="muted">Mar 2023</td><td class="n">0.5</td><td class="n">1.5</td><td class="n change">3.0&times;</td></tr>
          <tr><td>Riverside</td><td class="muted">Jun 2023</td><td class="n">0.5</td><td class="n">1.5</td><td class="n change">3.0&times;</td></tr>
          <tr class="hi"><td>Station Avenue</td><td>Sep 2023</td><td class="n">0.6</td><td class="n">1.9</td><td class="n change">3.2&times;</td></tr>
          <tr class="total"><td>All 6 protected</td><td class="muted"></td><td class="n">4.0</td><td class="n">12.0</td><td class="n change">3.0&times;</td></tr>
          <tr><td>All 4 painted</td><td class="muted">Not protected</td><td class="n">3.0</td><td class="n">3.0</td><td class="n change">1.0&times;</td></tr>
        </tbody>
      </table>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Source: Brenford bike counters, January 2022 and 2025. Change is 2025 over 2022, team calculation</span>
      <span class="page" data-role="footer">11</span>
    </div>
  </section>
</div>
</body>
</html>
