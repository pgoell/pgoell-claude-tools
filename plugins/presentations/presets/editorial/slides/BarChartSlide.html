<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 Bar chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Column chart as a newspaper graphic: standfirst with the measure,
     ink rule, gridline labels sitting on their lines, a heavy zero
     line, and one annotation in the chart instead of value labels. */
  .s-bar .bar { fill: var(--chart-context); }
  /* Accent job: marks the year the headline names. */
  .s-bar .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-bar" data-screen-label="04 Bar chart">
    <h1 class="action">Winter bike trips on protected corridors tripled in three years</h1>
    <p class="standfirst">Average weekday bike trips in January, 6 protected corridors, 2022 to 2025</p>
    <figure class="figure">
      <svg class="chart" width="1728" height="520" role="img"
           aria-label="Average weekday bike trips in January on protected corridors: 4k in 2022, 5k in 2023, 9k in 2024, 12k in 2025"
           data-chart="bar" data-orientation="vertical" data-unit="k"
           data-labels='["2022", "2023", "2024", "2025"]'
           data-series='[{"name": "Average weekday bike trips in January, thousands", "values": [4, 5, 9, 12]}]'
           data-highlight="3"
           data-annotations='[{"index": 3, "text": ["12k trips a day,", "three times the", "2022 level"]}]'></svg>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Source: Brenford bike counters, January 2022 to 2025</span>
      <span class="page" data-role="footer">4</span>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-bar .chart');
    const labels = JSON.parse(el.dataset.labels), v = JSON.parse(el.dataset.series)[0].values;
    const hl = Number(el.dataset.highlight), ann = JSON.parse(el.dataset.annotations);
    const x0 = 120, x1 = 1260, base = 440, top = 44, max = 12, colW = 180;
    const Y = x => base - x / max * (base - top);
    const step = (x1 - x0) / v.length, cx = i => x0 + step * i + step / 2;
    let out = '';
    [4, 8, 12].forEach(t => {
      out += '<line class="grid" x1="0" x2="' + x1 + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>';
      out += '<text x="0" y="' + (Y(t) - 12) + '">' + t + 'k</text>';
    });
    v.forEach((val, i) => {
      const hi = i === hl ? ' hi' : '';
      out += '<rect class="bar' + hi + '" x="' + (cx(i) - colW / 2) + '" y="' + Y(val) + '" width="' + colW + '" height="' + (base - Y(val)) + '"/>';
      out += '<text class="' + hi.trim() + '" x="' + cx(i) + '" y="' + (base + 52) + '" text-anchor="middle">' + labels[i] + '</text>';
    });
    out += '<line class="zero" x1="0" x2="' + x1 + '" y1="' + base + '" y2="' + base + '"/>';
    out += '<text x="0" y="' + (base - 12) + '">0</text>';
    // Annotation to the right of the highlighted column, level with its top.
    ann.forEach(a => {
      const bx = cx(a.index) + colW / 2, by = Y(v[a.index]);
      const tx = 1320;
      out += '<path class="leader" d="M' + (bx + 12) + ' ' + (by + 20) + ' H' + (tx - 16) + '"/>';
      a.text.forEach((line, j) => {
        out += '<text class="ann" x="' + tx + '" y="' + (by + 30 + j * 40) + '">' + line + '</text>';
      });
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
