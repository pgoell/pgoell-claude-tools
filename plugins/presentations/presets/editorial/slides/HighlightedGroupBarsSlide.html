<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>13 Highlighted group bars</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Small multiples folded onto one axis: four corridors side by
     side on one shared scale, eight January bars each, history in
     context gray and the latest year in the accent in every group,
     so the eye makes four comparisons in one sweep. A dashed marker
     shows when each corridor was protected; names sit under the
     groups, so there is no legend. */
  .s-groups .bar { fill: var(--chart-context); }
  /* Accent job: January 2025, the "now" bar, in every group. */
  .s-groups .bar.hi { fill: var(--chart-highlight); }
  .s-groups .marker { stroke: var(--fg-subtle); stroke-width: 2; stroke-dasharray: 8 8; }
  .s-groups .chart text.name { fill: var(--fg); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-groups" data-screen-label="13 Highlighted group bars">
    <h1 class="action">January riding on the busiest corridors sat flat for years, then tripled once protected</h1>
    <p class="standfirst">Average weekday bike trips in January, thousands, 4 busiest corridors, 2018 to 2025</p>
    <figure class="figure">
      <svg class="chart" width="1728" height="584" role="img"
           aria-label="Average weekday bike trips in January, 2018 to 2025. Harbour Road about 0.8k to 0.9k until 2022, then 2.6k in 2025. Mill Street 0.7k to 0.8k, then 2.4k. Canal Path 0.6k to 0.7k, then 2.1k. Station Avenue 0.5k to 0.6k until 2022, 0.8k in 2023, protected later that year, then 1.9k."
           data-chart="bar" data-orientation="vertical" data-unit="k"
           data-labels='["2018","2019","2020","2021","2022","2023","2024","2025"]'
           data-series='[{"name":"Harbour Road","values":[0.8,0.9,0.8,0.9,0.9,1.1,2.0,2.6]},{"name":"Mill Street","values":[0.8,0.7,0.8,0.8,0.8,1.0,1.8,2.4]},{"name":"Canal Path","values":[0.7,0.7,0.6,0.7,0.7,0.9,1.6,2.1]},{"name":"Station Avenue","values":[0.6,0.6,0.5,0.6,0.6,0.8,1.4,1.9]}]'
           data-highlight="7"
           data-annotations='[{"series":0,"after":4.5,"text":"Protected"},{"series":1,"after":4.5},{"series":2,"after":4.5},{"series":3,"after":5.5}]'></svg>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Source: Brenford bike counters, January 2018 to 2025. Dashed line: first January after the corridor was protected</span>
      <span class="page" data-role="footer">13</span>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-groups .chart');
    const labels = JSON.parse(el.dataset.labels), s = JSON.parse(el.dataset.series);
    const hl = Number(el.dataset.highlight), ann = JSON.parse(el.dataset.annotations);
    const x0 = 96, x1 = 1696, gx = 1728, base = 450, top = 50, max = 3, gap = 72, barW = 34;
    const Y = v => base - v / max * (base - top);
    const gw = (x1 - x0 - gap * (s.length - 1)) / s.length, n = labels.length, step = gw / n;
    const cx = (g, i) => x0 + g * (gw + gap) + step * i + step / 2;
    let out = '';
    [1, 2, 3].forEach(t => {
      out += '<line class="grid" x1="0" x2="' + gx + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>';
      out += '<text x="0" y="' + (Y(t) - 12) + '">' + t + 'k</text>';
    });
    // Protection markers sit behind the bars.
    ann.forEach(a => {
      const mx = cx(a.series, a.after);
      out += '<line class="marker" x1="' + mx + '" x2="' + mx + '" y1="' + (Y(3) + 40) + '" y2="' + base + '"/>';
      if (a.text) out += '<text class="ann" x="' + (mx - 14) + '" y="' + (Y(3) + 66) + '" text-anchor="end">' + a.text + '</text>';
    });
    s.forEach((ser, g) => {
      ser.values.forEach((v, i) => {
        const hi = i === hl ? ' hi' : '';
        out += '<rect class="bar' + hi + '" x="' + (cx(g, i) - barW / 2) + '" y="' + Y(v) + '" width="' + barW + '" height="' + (base - Y(v)) + '"/>';
      });
      // Value on the story bar only, first and last year under each group, name below.
      out += '<text class="hi" x="' + cx(g, hl) + '" y="' + (Y(ser.values[hl]) - 16) + '" text-anchor="middle">' + ser.values[hl].toFixed(1) + 'k</text>';
      out += '<text x="' + cx(g, 0) + '" y="' + (base + 46) + '" text-anchor="middle">' + labels[0] + '</text>';
      out += '<text x="' + cx(g, n - 1) + '" y="' + (base + 46) + '" text-anchor="middle">' + labels[n - 1] + '</text>';
      out += '<text class="name" x="' + (x0 + g * (gw + gap) + gw / 2) + '" y="' + (base + 104) + '" text-anchor="middle">' + ser.name + '</text>';
    });
    out += '<line class="zero" x1="0" x2="' + gx + '" y1="' + base + '" y2="' + base + '"/>';
    out += '<text x="0" y="' + (base - 12) + '">0</text>';
    el.innerHTML = out;
  })();
</script>
</body>
</html>
