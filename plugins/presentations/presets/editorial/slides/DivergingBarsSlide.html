<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>20 Diverging bars</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Diverging columns around a heavy zero line: gains above in
     context gray, losses below in the accent, one column per quarter,
     so the mirror image carries the claim. Series names sit at the
     right end of each half instead of a legend; one note marks the
     year the swing peaks. */
  .s-div .bar { fill: var(--chart-context); }
  /* Accent job: the car trips lost, the series the headline names. */
  .s-div .bar.hi { fill: var(--chart-highlight); }
  .s-div .yeartick { stroke: var(--fg); stroke-width: var(--rule-hair); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-div" data-screen-label="20 Diverging bars">
    <h1 class="action">Car trips on the corridors fell in every quarter that bike trips rose</h1>
    <p class="standfirst">Weekday trips against a year earlier, protected corridors, thousands, 2023 to 2025</p>
    <figure class="figure">
      <svg class="chart" width="1728" height="560" role="img"
           aria-label="Change in average weekday trips on the protected corridors against the same quarter a year earlier, Q1 2023 to Q4 2025. Bike trips rose every quarter, by 0.9k to 1.4k in 2023, 4.0k to 4.7k in 2024, and 2.1k to 3.0k in 2025. Car trips fell every quarter, by 0.6k to 1.1k in 2023, 3.4k to 3.9k in 2024, and 1.4k to 1.9k in 2025."
           data-chart="bar" data-orientation="vertical" data-unit="k" data-diverging="true"
           data-labels='["Q1 23","Q2 23","Q3 23","Q4 23","Q1 24","Q2 24","Q3 24","Q4 24","Q1 25","Q2 25","Q3 25","Q4 25"]'
           data-series='[{"name":"Bike trips gained","values":[1.0,0.9,1.1,1.4,4.0,4.7,4.7,4.2,3.0,2.1,2.2,2.6]},{"name":"Car trips lost","values":[-0.8,-0.6,-0.9,-1.1,-3.4,-3.9,-3.8,-3.5,-1.8,-1.4,-1.5,-1.9]}]'
           data-highlight-series="1"
           data-annotations='[{"from":4,"to":7,"text":"2024, first full year with all six protected"}]'></svg>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Sources: Brenford bike counters; city traffic counts, 2022 to 2025. Change on the same quarter a year earlier</span>
      <span class="page" data-role="footer">20</span>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-div .chart');
    const s = JSON.parse(el.dataset.series), hs = Number(el.dataset.highlightSeries);
    const ann = JSON.parse(el.dataset.annotations), n = s[0].values.length;
    const x0 = 110, x1 = 1440, gx = 1728, zero = 290, unit = 46, barW = 64;
    const Y = v => zero - v * unit;
    const step = (x1 - x0) / n, cx = i => x0 + step * i + step / 2;
    let out = '';
    [-4, -2, 2, 4].forEach(t => {
      out += '<line class="grid" x1="0" x2="' + gx + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>';
      out += '<text x="0" y="' + (Y(t) - 12) + '">' + (t > 0 ? '+' : '&minus;') + Math.abs(t) + 'k</text>';
    });
    s.forEach((ser, k) => {
      const hi = k === hs ? ' hi' : '';
      ser.values.forEach((v, i) => {
        const y = Math.min(Y(v), zero), h = Math.abs(v) * unit;
        out += '<rect class="bar' + hi + '" x="' + (cx(i) - barW / 2) + '" y="' + y + '" width="' + barW + '" height="' + h + '"/>';
      });
      // Series names at the right end of each half, in column six.
      const last = ser.values[n - 1];
      out += '<text class="' + hi.trim() + '" x="' + (x1 + 40) + '" y="' + (Y(last / 2) + 10) + '">' + ser.name + '</text>';
    });
    out += '<line class="zero" x1="0" x2="' + gx + '" y1="' + zero + '" y2="' + zero + '"/>';
    out += '<text x="0" y="' + (zero - 12) + '">0</text>';
    // Years under the chart, with ticks between them.
    const bottom = Y(-4);
    ['2023', '2024', '2025'].forEach((yr, j) => {
      out += '<text x="' + cx(j * 4 + 1.5) + '" y="' + (bottom + 52) + '" text-anchor="middle">' + yr + '</text>';
      if (j) out += '<line class="yeartick" x1="' + cx(j * 4 - 0.5) + '" x2="' + cx(j * 4 - 0.5) + '" y1="' + bottom + '" y2="' + (bottom + 18) + '"/>';
    });
    // Note over the peak year, with a bracket spanning its four quarters.
    ann.forEach(a => {
      const l = cx(a.from) - barW / 2, r = cx(a.to) + barW / 2, y = Y(5.2);
      out += '<path class="leader" d="M' + l + ' ' + (y + 14) + ' V' + y + ' H' + r + ' V' + (y + 14) + '"/>';
      out += '<text class="ann" x="' + l + '" y="' + (y - 16) + '">' + a.text + '</text>';
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
