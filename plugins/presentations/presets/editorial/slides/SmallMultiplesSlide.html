<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>08 Small multiples</title>
<style>
  /* ==========================================================
     Synced copy of ../colors.css. Source of truth is the file;
     refresh this block whenever it changes.
     ========================================================== */
  /* ============================================================
     Editorial preset, design tokens ("paper and claret" direction)
     ============================================================
     Source of truth for every slide's embedded variable block.
     Semantic layer only: this preset serves a context, not a
     brand, so it carries no raw brand layer. Slides read these
     names and nothing else.

     Data stories, research readouts, reports presented as
     decks: tinted paper, warm ink, one claret accent, and a
     slate dark scope. Chart grammar follows newsroom practice:
     headline, subtitle with units and dates, source line,
     horizontal gridlines only, direct labels.

     Color rule: one accent with one job. The accent marks the
     single thing the audience should look at. Everything else
     is ink or gray. Every text tier holds 4.5:1 or better on
     --bg, --bg-elev, and --bg-subtle in both scopes, and
     --accent holds 4.5:1 on --bg, so it can mark a word or a
     number. Borders are decorative only.
     ============================================================ */

  :root {
    /* =====================================================
       COLOR, Semantic (light theme)
       ===================================================== */
    --bg:                 #FBF4EA;      /* tinted paper */
    --bg-elev:            #FFFAF3;
    --bg-subtle:          #F3E8DA;
    --bg-inverse:         #1F2229;

    --fg:                 #221C18;      /* 15.42 */
    --fg-muted:           #52473F;      /* 8.25 */
    --fg-subtle:          #6A5E55;      /* 5.75 */
    --fg-inverse:         #F4EEE6;
    --fg-inverse-muted:   #CFC6BA;
    --fg-inverse-subtle:  #A69D92;

    --border:             #E6D9C8;      /* decorative only */
    --border-strong:      #CDBCA6;
    --border-inverse:     #383C45;
    --border-accent:      var(--accent);

    --accent:             #9E1B3C;      /* 7.19; claret */
    --accent-fg:          #FFFFFF;
    --accent-partner:     #1F5A8A;      /* second chart series only */

    /* Status (rare on slides, but useful) */
    --status-success:     #2F7A1C;
    --status-warning:     #C77700;
    --status-danger:      #B0271A;
    --status-info:        #00638A;

    /* =====================================================
       COLOR, Charts
       Gray plus one: --chart-highlight marks the story series,
       every other series is --chart-context. The numbered
       categorical colors are for charts where the categories
       are the point, at most 6 series.
       Zero line in --fg. Categorical set passes a Machado 2009
       protan, deutan, and tritan simulation at CIEDE2000 >= 13.
       ===================================================== */
    --chart-highlight:    var(--accent);  /* story series in highlight mode */
    --chart-context:      #B9AD9E;      /* 2.02 */
    --chart-grid:         #E6D9C8;      /* lighter than axis labels */
    --chart-1:            #9E1B3C;      /* 7.19 */
    --chart-2:            #13415C;      /* 9.92 */
    --chart-3:            #0D7680;      /* 4.91 */
    --chart-4:            #6544A3;      /* 6.61 */
    --chart-5:            #B8860B;      /* 2.98; only with direct labels */

    /* =====================================================
       TYPE, slide scale (1920x1080 reference)
       Floors by role (checked by gate H7): body >= 36px,
       captions and chart labels >= 28px, footer and source
       line >= 24px. Use at most three sizes per slide. Never
       shrink text to fit: split the slide or cut words.
       ===================================================== */
    --fs-hero:        220px;     /* The single big number */
    --fs-display:     120px;     /* Structure slides */
    --fs-section:     96px;      /* Spare large step */
    --fs-h1:          72px;      /* Sentence headline */
    --fs-h2:          56px;
    --fs-h3:          52px;
    --fs-subtitle:    48px;      /* Chart subtitle with units and dates */
    --fs-body-lg:     44px;
    --fs-body:        40px;      /* Body text (floor 36px) */
    --fs-caption:     30px;      /* Chart labels */
    --fs-micro:       24px;      /* Source line, page number; do not go below */

    --lh-tight:         1.1;     /* titles */
    --lh-snug:          1.2;
    --lh-normal:        1.4;     /* body */
    --lh-relaxed:       1.55;

    --tracking-tight:   0;       /* serif titles: no negative tracking */
    --tracking-normal:  0;
    --tracking-wide:    0.04em;
    --tracking-caps:    0.08em;  /* kept for token parity; tracked caps are banned on slides */

    --weight-regular:   400;
    --weight-medium:    500;
    --weight-semibold:  600;
    --weight-bold:      700;

    /* =====================================================
       SPACING (8pt grid)
       ===================================================== */
    --space-0:   0;
    --space-1:   4px;
    --space-2:   8px;
    --space-3:   12px;
    --space-4:   16px;
    --space-5:   24px;
    --space-6:   32px;
    --space-7:   48px;
    --space-8:   64px;
    --space-9:   80px;
    --space-10:  120px;
    --space-11:  160px;

    /* Slide margins (1920x1080) */
    --slide-pad-x:   96px;
    --slide-pad-y:   80px;
    --slide-w:       1920px;
    --slide-h:       1080px;

    /* =====================================================
       PAGE GRID AND RULES (newspaper page on 1920x1080)
       Six columns inside the 96px side margins:
       6 x 248 + 5 x 48 = 1728. Headlines span five
       columns, running text four (about 55 to 60 characters
       at body size), margin figures and notes two.
       ===================================================== */
    --grid-col:      248px;
    --grid-gutter:   48px;
    --span-2:        544px;     /* 2 columns: margin figure, text column */
    --span-3:        840px;
    --span-4:        1136px;    /* running text measure */
    --span-5:        1432px;    /* headline measure */
    --rule-hair:     2px;       /* column rules, table hairlines, gridlines */
    --rule-figure:   3px;       /* ink rule above every figure */
    --rule-zero:     4px;       /* zero line: the heaviest line in a chart */

    /* =====================================================
       RADIUS
       ===================================================== */
    --r-0:       0;
    --r-sm:      4px;
    --r-md:      6px;
    --r-lg:      8px;
    --r-pill:    999px;

    /* =====================================================
       SHADOWS (use sparingly, flat is default)
       ===================================================== */
    --shadow-0:  none;
    --shadow-1:  0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-2:  0 10px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);

    /* =====================================================
       MOTION
       ===================================================== */
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
    --ease-in-out: cubic-bezier(0.7, 0, 0.3, 1);
    --dur-fast:    150ms;
    --dur-base:    240ms;
    --dur-slow:    400ms;
  }

  /* =====================================================
     DARK SLIDE THEME, apply `.dark` to a slide root.
     Inverse tokens swap to the light values here.
     ===================================================== */
  .dark,
  [data-theme="dark"] {
    --bg:                 #1F2229;      /* slate */
    --bg-elev:            #292D35;
    --bg-subtle:          #252830;
    --bg-inverse:         #FBF4EA;

    --fg:                 #F4EEE6;      /* 13.81 */
    --fg-muted:           #CFC6BA;      /* 9.43 */
    --fg-subtle:          #A69D92;      /* 5.96 */
    --fg-inverse:         #221C18;
    --fg-inverse-muted:   #52473F;
    --fg-inverse-subtle:  #6A5E55;

    --border:             #383C45;
    --border-strong:      #4B505B;
    --border-inverse:     #E6D9C8;
    --border-accent:      var(--accent);  /* redeclared so it picks up the dark accent */

    --accent:             #F08BA3;      /* 6.77 */
    --accent-fg:          #1F2229;
    --accent-partner:     #8CB8E0;      /* 7.62 */

    --chart-highlight:    var(--accent);  /* redeclared so it picks up the dark accent */
    --chart-context:      #6E6760;      /* 2.86 */
    --chart-grid:         var(--border);
    --chart-1:            #F08BA3;      /* 6.77 */
    --chart-2:            #5D83A1;      /* 3.96 */
    --chart-3:            #5FD1DB;      /* 8.82 */
    --chart-4:            #DFBE61;      /* 8.85 */
    --chart-5:            #AA8EEE;      /* 5.92 */
  }

  /* ==========================================================
     Synced copy of ../typography.css. Source of truth is the
     file; refresh this block whenever it changes. Font URLs
     gain a ../ prefix here because this file sits in slides/.
     ========================================================== */
  /* ============================================================
     Editorial preset, font stacks
     ============================================================
     Newsreader for titles (display optical size, 500 to 600)
     over Source Sans 3 for body, subtitles, labels, and the
     source line. Both ship unmodified in assets/fonts/ with their
     OFL.txt and load from that relative path, so slides make no
     network request. Source Sans 3 carries the Reserved Font
     Name "Source": never subset or otherwise modify its file.
     Both families set tabular figures by default, so every
     number in a chart aligns. Newsreader has a low x-height:
     keep titles at 72px or more. The mono stack is for code
     samples only and is not vendored.
     ============================================================ */

  @font-face {
    font-family: 'Newsreader';
    src: url('../assets/fonts/newsreader/Newsreader-Variable.woff2') format('woff2');
    font-weight: 200 800;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Source Sans 3';
    src: url('../assets/fonts/source-sans-3/SourceSans3VF-Upright.ttf.woff2') format('woff2');
    font-weight: 200 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --font-display: 'Newsreader', Georgia, serif;
    --font-sans:    'Source Sans 3', -apple-system, 'Segoe UI', Helvetica, sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }

  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Six small charts on the six-column grid (three panels of two
     columns each, two rows), one shared scale, gridline labels in
     the first column only, years in the bottom row only. */
  .s-sm .grid6 {
    display: grid;
    grid-template-columns: repeat(3, var(--span-2));
    column-gap: var(--grid-gutter); row-gap: 20px;
  }
  .s-sm .panel .name {
    font-size: var(--fs-caption); font-weight: var(--weight-semibold);
    line-height: var(--lh-snug); margin: 0 0 4px;
  }
  .s-sm .line { fill: none; stroke: var(--chart-context); stroke-width: 4; }
  /* Accent job: each panel's own corridor; gray is the painted-corridor average. */
  .s-sm .line.hi { stroke: var(--chart-highlight); stroke-width: 6; stroke-linejoin: round; }
  .s-sm .pt { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-sm" data-screen-label="08 Small multiples">
    <h1 class="action">Winter riding roughly tripled on every protected corridor, not only the busiest</h1>
    <p class="standfirst">Average weekday bike trips in January, thousands, same scale in every panel</p>
    <figure class="figure">
      <div class="grid6">
        <div class="panel"><p class="name" data-role="label">Harbour Road</p><svg class="chart" width="544" height="214" role="img" aria-label="Harbour Road: 0.9k in 2022 to 2.6k in 2025" data-chart="line" data-unit="k" data-labels='["2022","2023","2024","2025"]' data-series='[{"name":"Harbour Road","values":[0.9,1.1,2.0,2.6]},{"name":"Painted average","values":[0.75,0.78,0.73,0.75]}]' data-highlight-series="0"></svg></div>
        <div class="panel"><p class="name" data-role="label">Mill Street</p><svg class="chart" width="544" height="214" role="img" aria-label="Mill Street: 0.8k in 2022 to 2.4k in 2025" data-chart="line" data-unit="k" data-labels='["2022","2023","2024","2025"]' data-series='[{"name":"Mill Street","values":[0.8,1.0,1.8,2.4]},{"name":"Painted average","values":[0.75,0.78,0.73,0.75]}]' data-highlight-series="0"></svg></div>
        <div class="panel"><p class="name" data-role="label">Canal Path</p><svg class="chart" width="544" height="214" role="img" aria-label="Canal Path: 0.7k in 2022 to 2.1k in 2025" data-chart="line" data-unit="k" data-labels='["2022","2023","2024","2025"]' data-series='[{"name":"Canal Path","values":[0.7,0.9,1.6,2.1]},{"name":"Painted average","values":[0.75,0.78,0.73,0.75]}]' data-highlight-series="0"></svg></div>
        <div class="panel"><p class="name" data-role="label">Northgate</p><svg class="chart" width="544" height="254" role="img" aria-label="Northgate: 0.5k in 2022 to 1.5k in 2025" data-chart="line" data-unit="k" data-labels='["2022","2023","2024","2025"]' data-series='[{"name":"Northgate","values":[0.5,0.6,1.1,1.5]},{"name":"Painted average","values":[0.75,0.78,0.73,0.75]}]' data-highlight-series="0"></svg></div>
        <div class="panel"><p class="name" data-role="label">Riverside</p><svg class="chart" width="544" height="254" role="img" aria-label="Riverside: 0.5k in 2022 to 1.5k in 2025" data-chart="line" data-unit="k" data-labels='["2022","2023","2024","2025"]' data-series='[{"name":"Riverside","values":[0.5,0.6,1.1,1.5]},{"name":"Painted average","values":[0.75,0.78,0.73,0.75]}]' data-highlight-series="0"></svg></div>
        <div class="panel"><p class="name" data-role="label">Station Avenue</p><svg class="chart" width="544" height="254" role="img" aria-label="Station Avenue: 0.6k in 2022 to 1.9k in 2025" data-chart="line" data-unit="k" data-labels='["2022","2023","2024","2025"]' data-series='[{"name":"Station Avenue","values":[0.6,0.8,1.4,1.9]},{"name":"Painted average","values":[0.75,0.78,0.73,0.75]}]' data-highlight-series="0"></svg></div>
      </div>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Source: Brenford bike counters, January 2022 to 2025. Gray line: average of the 4 painted corridors</span>
      <span class="page" data-role="footer">8</span>
    </div>
  </section>
</div>
<script>
  (function () {
    const charts = document.querySelectorAll('.s-sm .chart');
    const x0 = 64, x1 = 400, base = 188, top = 48, max = 3;
    const Y = v => base - v / max * (base - top);
    charts.forEach((el, p) => {
      const s = JSON.parse(el.dataset.series), labels = JSON.parse(el.dataset.labels);
      const hs = Number(el.dataset.highlightSeries), n = labels.length;
      const X = i => x0 + i * (x1 - x0) / (n - 1);
      const firstCol = p % 3 === 0, bottomRow = p >= 3;
      let out = '';
      [1, 2, 3].forEach(t => {
        out += '<line class="grid" x1="0" x2="' + x1 + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>';
        if (firstCol) out += '<text x="0" y="' + (Y(t) - 10) + '">' + t + 'k</text>';
      });
      out += '<line class="zero" x1="0" x2="' + x1 + '" y1="' + base + '" y2="' + base + '"/>';
      if (firstCol) out += '<text x="0" y="' + (base - 10) + '">0</text>';
      [1, 0].forEach(k => {
        const hi = k === hs ? ' hi' : '';
        out += '<polyline class="line' + hi + '" points="' + s[k].values.map((v, i) => X(i) + ',' + Y(v)).join(' ') + '"/>';
      });
      const last = s[hs].values[n - 1];
      out += '<circle class="pt" cx="' + X(n - 1) + '" cy="' + Y(last) + '" r="9"/>';
      out += '<text class="hi" x="' + (x1 + 18) + '" y="' + (Y(last) + 10) + '">' + last.toFixed(1) + 'k</text>';
      if (p === 0) out += '<text x="' + (x1 + 18) + '" y="' + (Y(s[1].values[n - 1]) + 10) + '">Painted</text>';
      if (bottomRow) {
        out += '<text x="' + X(0) + '" y="' + (base + 50) + '" text-anchor="middle">' + labels[0] + '</text>';
        out += '<text x="' + X(n - 1) + '" y="' + (base + 50) + '" text-anchor="middle">' + labels[n - 1] + '</text>';
      }
      el.innerHTML = out;
    });
  })();
</script>
</body>
</html>
