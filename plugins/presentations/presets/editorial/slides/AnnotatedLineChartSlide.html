<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>07 Annotated line chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits: the editorial page ==== */
  /* Sentence headline: serif, top left, five columns wide, the
     dominant heading on every content slide, same place and size. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: var(--span-5);
    text-wrap: balance;
  }
  /* Standfirst: the plain line under the headline. On chart slides
     it carries the measure, the units, and the dates. */
  .standfirst {
    font-size: var(--fs-subtitle); line-height: var(--lh-snug);
    color: var(--fg-muted); margin: 20px 0 0;
  }
  /* Figure: every chart, table, or margin figure hangs from an ink
     rule; nothing else on the slide is boxed or carded. */
  .figure {
    border-top: var(--rule-figure) solid var(--fg);
    padding-top: 28px; margin: 44px 0 0;
  }
  /* Footer: source and note line bottom left in the sans, page
     number bottom right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro); line-height: var(--lh-snug);
    color: var(--fg-subtle);
  }
  .footer .source { max-width: var(--span-5); }
  /* Body block on text-led slides: centered in the space between the
     headline and the footer, so no dead band opens under the text. */
  .body { margin: auto 0; padding-bottom: 72px; }
  /* Chart grammar: horizontal gridlines only, value labels sitting
     on top of their gridline at the left edge, a heavier ink zero
     line, direct labels and annotations in the sans. */
  .chart { display: block; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-caption); fill: var(--fg-muted); }
  .chart text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
  .chart text.ann { fill: var(--fg); }
  .chart .grid { stroke: var(--chart-grid); stroke-width: var(--rule-hair); }
  .chart .zero { stroke: var(--fg); stroke-width: var(--rule-zero); }
  .chart .leader { stroke: var(--fg-subtle); stroke-width: 2; fill: none; }
  .chart, .num, table { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Line chart with the story written onto the data: the story
     series in the accent, the comparison in context gray, both
     labelled at their line ends, and two or three short notes with
     leaders placed where the data makes the point. */
  .s-line .line { fill: none; stroke: var(--chart-context); stroke-width: 5; stroke-linejoin: round; }
  /* Accent job: the protected corridors, the series the headline names. */
  .s-line .line.hi { stroke: var(--chart-highlight); stroke-width: 6; }
  .s-line .pt { fill: var(--chart-highlight); stroke: var(--bg); stroke-width: 4; }
  .s-line .marker { stroke: var(--fg-subtle); stroke-width: 2; stroke-dasharray: 8 8; }
  .s-line .yeartick { stroke: var(--fg); stroke-width: var(--rule-hair); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-line" data-screen-label="07 Annotated line chart">
    <h1 class="action">Protected corridors now lose a quarter of their riders in winter, down from half</h1>
    <p class="standfirst">Average weekday bike trips by quarter, thousands, 2022 to 2025</p>
    <figure class="figure">
      <svg class="chart" width="1728" height="560" role="img"
           aria-label="Average weekday bike trips by quarter, 2022 to 2025. Protected corridors: winter low rose from 4.0k in Q1 2022 to 12.0k in Q1 2025, 24% below the summer high of 15.8k. Painted corridors: about 3k every winter, 7k every summer."
           data-chart="line" data-unit="k"
           data-labels='["Q1 22","Q2 22","Q3 22","Q4 22","Q1 23","Q2 23","Q3 23","Q4 23","Q1 24","Q2 24","Q3 24","Q4 24","Q1 25","Q2 25","Q3 25","Q4 25"]'
           data-series='[{"name":"Protected","values":[4.0,7.5,7.8,5.2,5.0,8.4,8.9,6.6,9.0,13.1,13.6,10.8,12.0,15.2,15.8,13.4]},{"name":"Painted","values":[3.0,6.8,7.0,4.1,3.1,6.9,7.1,4.0,2.9,6.7,7.2,4.2,3.0,7.0,7.1,4.1]}]'
           data-highlight-series="0"
           data-annotations='[{"index":0,"text":["Winter 2022: 49%","below summer"]},{"index":12,"text":["Winter 2025: 24%","below summer"]},{"after":6.67,"text":["Last corridor","protected, Sept 2023"]}]'></svg>
    </figure>
    <div class="footer">
      <span class="source" data-role="source">Source: Brenford bike counters, 2022 to 2025. Note: winter is Q1, summer is Q3 of the same year</span>
      <span class="page" data-role="footer">7</span>
    </div>
  </section>
</div>
<script>
  (function () {
    const el = document.querySelector('.s-line .chart');
    const s = JSON.parse(el.dataset.series), ann = JSON.parse(el.dataset.annotations);
    const hs = Number(el.dataset.highlightSeries), n = s[0].values.length;
    const x0 = 90, x1 = 1500, base = 480, top = 40, max = 16;
    const X = i => x0 + i * (x1 - x0) / (n - 1);
    const Y = v => base - v / max * (base - top);
    let out = '';
    [4, 8, 12, 16].forEach(t => {
      out += '<line class="grid" x1="0" x2="' + x1 + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>';
      out += '<text x="0" y="' + (Y(t) - 12) + '">' + t + 'k</text>';
    });
    out += '<line class="zero" x1="0" x2="' + x1 + '" y1="' + base + '" y2="' + base + '"/>';
    out += '<text x="0" y="' + (base - 12) + '">0</text>';
    // Year labels under each group of four quarters, ticks at year breaks.
    ['2022', '2023', '2024', '2025'].forEach((yr, k) => {
      out += '<text x="' + X(k * 4 + 1.5) + '" y="' + (base + 52) + '" text-anchor="middle">' + yr + '</text>';
      if (k) out += '<line class="yeartick" x1="' + X(k * 4 - 0.5) + '" x2="' + X(k * 4 - 0.5) + '" y1="' + base + '" y2="' + (base + 18) + '"/>';
    });
    // Annotation 3: the event marker, text to its left, clear of both lines.
    const m = ann[2], mx = X(m.after);
    out += '<line class="marker" x1="' + mx + '" x2="' + mx + '" y1="' + (top + 20) + '" y2="' + base + '"/>';
    m.text.forEach((line, j) => {
      out += '<text class="ann" x="' + (mx - 16) + '" y="' + (top + 44 + j * 40) + '" text-anchor="end">' + line + '</text>';
    });
    // Lines: context first, story on top.
    [1, 0].forEach(k => {
      const hi = k === hs ? ' hi' : '';
      out += '<polyline class="line' + hi + '" points="' + s[k].values.map((v, i) => X(i) + ',' + Y(v)).join(' ') + '"/>';
      const last = s[k].values[n - 1];
      out += '<text class="' + hi.trim() + '" x="' + (x1 + 20) + '" y="' + (Y(last) + 10) + '">' + s[k].name + '</text>';
    });
    // Annotation 1: Q1 2022, note in the empty space above, leader down to the point.
    const p0 = ann[0], ax = X(p0.index), ay = Y(s[hs].values[p0.index]);
    p0.text.forEach((line, j) => {
      out += '<text class="ann" x="' + (ax + 24) + '" y="' + (Y(12) + j * 40) + '">' + line + '</text>';
    });
    out += '<path class="leader" d="M' + (ax + 12) + ' ' + (Y(12) - 24) + ' V' + (ay - 20) + '"/>';
    out += '<circle class="pt" cx="' + ax + '" cy="' + ay + '" r="11"/>';
    // Annotation 2: Q1 2025, note to the lower right of the point.
    const p1 = ann[1], bx = X(p1.index), by = Y(s[hs].values[p1.index]);
    p1.text.forEach((line, j) => {
      out += '<text class="ann" x="' + (bx + 36) + '" y="' + (by + 52 + j * 40) + '">' + line + '</text>';
    });
    out += '<path class="leader" d="M' + (bx + 12) + ' ' + (by + 14) + ' L' + (bx + 28) + ' ' + (by + 30) + '"/>';
    out += '<circle class="pt" cx="' + bx + '" cy="' + by + '" r="11"/>';
    el.innerHTML = out;
  })();
</script>
</body>
</html>
