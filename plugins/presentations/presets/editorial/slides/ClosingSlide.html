<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>06 Closing</title>
<style>
  /* ==========================================================
     Synced copy of ../colors.css. Source of truth is the file;
     refresh this block whenever it changes.
     ========================================================== */
  /* ============================================================
     Editorial preset, design tokens ("paper and claret" direction)
     ============================================================
     Source of truth for every slide's embedded variable block.
     Semantic layer only: this preset serves a context, not a
     brand, so it carries no raw brand layer. Slides read these
     names and nothing else.

     Data stories, research readouts, reports presented as
     decks: tinted paper, warm ink, one claret accent, and a
     slate dark scope. Chart grammar follows newsroom practice:
     headline, subtitle with units and dates, source line,
     horizontal gridlines only, direct labels.

     Color rule: one accent with one job. The accent marks the
     single thing the audience should look at. Everything else
     is ink or gray. Every text tier holds 4.5:1 or better on
     --bg, --bg-elev, and --bg-subtle in both scopes, and
     --accent holds 4.5:1 on --bg, so it can mark a word or a
     number. Borders are decorative only.
     ============================================================ */

  :root {
    /* =====================================================
       COLOR, Semantic (light theme)
       ===================================================== */
    --bg:                 #FBF4EA;      /* tinted paper */
    --bg-elev:            #FFFAF3;
    --bg-subtle:          #F3E8DA;
    --bg-inverse:         #1F2229;

    --fg:                 #221C18;      /* 15.42 */
    --fg-muted:           #52473F;      /* 8.25 */
    --fg-subtle:          #6A5E55;      /* 5.75 */
    --fg-inverse:         #F4EEE6;
    --fg-inverse-muted:   #CFC6BA;
    --fg-inverse-subtle:  #A69D92;

    --border:             #E6D9C8;      /* decorative only */
    --border-strong:      #CDBCA6;
    --border-inverse:     #383C45;
    --border-accent:      var(--accent);

    --accent:             #9E1B3C;      /* 7.19; claret */
    --accent-fg:          #FFFFFF;
    --accent-partner:     #1F5A8A;      /* second chart series only */

    /* Status (rare on slides, but useful) */
    --status-success:     #2F7A1C;
    --status-warning:     #C77700;
    --status-danger:      #B0271A;
    --status-info:        #00638A;

    /* =====================================================
       COLOR, Charts
       Gray plus one: --chart-highlight marks the story series,
       every other series is --chart-context. The numbered
       categorical colors are for charts where the categories
       are the point, at most 6 series.
       Zero line in --fg. Categorical set passes a Machado 2009
       protan, deutan, and tritan simulation at CIEDE2000 >= 13.
       ===================================================== */
    --chart-highlight:    var(--accent);  /* story series in highlight mode */
    --chart-context:      #B9AD9E;      /* 2.02 */
    --chart-grid:         #E6D9C8;      /* lighter than axis labels */
    --chart-1:            #9E1B3C;      /* 7.19 */
    --chart-2:            #13415C;      /* 9.92 */
    --chart-3:            #0D7680;      /* 4.91 */
    --chart-4:            #6544A3;      /* 6.61 */
    --chart-5:            #B8860B;      /* 2.98; only with direct labels */

    /* =====================================================
       TYPE, slide scale (1920x1080 reference)
       Floors by role (checked by gate H7): body >= 36px,
       captions and chart labels >= 28px, footer and source
       line >= 24px. Use at most three sizes per slide. Never
       shrink text to fit: split the slide or cut words.
       ===================================================== */
    --fs-hero:        220px;     /* The single big number */
    --fs-display:     120px;     /* Structure slides */
    --fs-section:     96px;      /* Spare large step */
    --fs-h1:          72px;      /* Sentence headline */
    --fs-h2:          56px;
    --fs-h3:          52px;
    --fs-subtitle:    48px;      /* Chart subtitle with units and dates */
    --fs-body-lg:     44px;
    --fs-body:        40px;      /* Body text (floor 36px) */
    --fs-caption:     30px;      /* Chart labels */
    --fs-micro:       24px;      /* Source line, page number; do not go below */

    --lh-tight:         1.1;     /* titles */
    --lh-snug:          1.2;
    --lh-normal:        1.4;     /* body */
    --lh-relaxed:       1.55;

    --tracking-tight:   0;       /* serif titles: no negative tracking */
    --tracking-normal:  0;
    --tracking-wide:    0.04em;
    --tracking-caps:    0.08em;  /* kept for token parity; tracked caps are banned on slides */

    --weight-regular:   400;
    --weight-medium:    500;
    --weight-semibold:  600;
    --weight-bold:      700;

    /* =====================================================
       SPACING (8pt grid)
       ===================================================== */
    --space-0:   0;
    --space-1:   4px;
    --space-2:   8px;
    --space-3:   12px;
    --space-4:   16px;
    --space-5:   24px;
    --space-6:   32px;
    --space-7:   48px;
    --space-8:   64px;
    --space-9:   80px;
    --space-10:  120px;
    --space-11:  160px;

    /* Slide margins (1920x1080) */
    --slide-pad-x:   96px;
    --slide-pad-y:   80px;
    --slide-w:       1920px;
    --slide-h:       1080px;

    /* =====================================================
       RADIUS
       ===================================================== */
    --r-0:       0;
    --r-sm:      4px;
    --r-md:      6px;
    --r-lg:      8px;
    --r-pill:    999px;

    /* =====================================================
       SHADOWS (use sparingly, flat is default)
       ===================================================== */
    --shadow-0:  none;
    --shadow-1:  0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-2:  0 10px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);

    /* =====================================================
       MOTION
       ===================================================== */
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
    --ease-in-out: cubic-bezier(0.7, 0, 0.3, 1);
    --dur-fast:    150ms;
    --dur-base:    240ms;
    --dur-slow:    400ms;
  }

  /* =====================================================
     DARK SLIDE THEME, apply `.dark` to a slide root.
     Inverse tokens swap to the light values here.
     ===================================================== */
  .dark,
  [data-theme="dark"] {
    --bg:                 #1F2229;      /* slate */
    --bg-elev:            #292D35;
    --bg-subtle:          #252830;
    --bg-inverse:         #FBF4EA;

    --fg:                 #F4EEE6;      /* 13.81 */
    --fg-muted:           #CFC6BA;      /* 9.43 */
    --fg-subtle:          #A69D92;      /* 5.96 */
    --fg-inverse:         #221C18;
    --fg-inverse-muted:   #52473F;
    --fg-inverse-subtle:  #6A5E55;

    --border:             #383C45;
    --border-strong:      #4B505B;
    --border-inverse:     #E6D9C8;
    --border-accent:      var(--accent);  /* redeclared so it picks up the dark accent */

    --accent:             #F08BA3;      /* 6.77 */
    --accent-fg:          #1F2229;
    --accent-partner:     #8CB8E0;      /* 7.62 */

    --chart-highlight:    var(--accent);  /* redeclared so it picks up the dark accent */
    --chart-context:      #6E6760;      /* 2.86 */
    --chart-grid:         var(--border);
    --chart-1:            #F08BA3;      /* 6.77 */
    --chart-2:            #5D83A1;      /* 3.96 */
    --chart-3:            #5FD1DB;      /* 8.82 */
    --chart-4:            #DFBE61;      /* 8.85 */
    --chart-5:            #AA8EEE;      /* 5.92 */
  }

  /* ==========================================================
     Synced copy of ../typography.css. Source of truth is the
     file; refresh this block whenever it changes. Font URLs
     gain a ../ prefix here because this file sits in slides/.
     ========================================================== */
  /* ============================================================
     Editorial preset, font stacks
     ============================================================
     Newsreader for titles (display optical size, 500 to 600)
     over Source Sans 3 for body, subtitles, labels, and the
     source line. Both ship unmodified in assets/fonts/ with their
     OFL.txt and load from that relative path, so slides make no
     network request. Source Sans 3 carries the Reserved Font
     Name "Source": never subset or otherwise modify its file.
     Both families set tabular figures by default, so every
     number in a chart aligns. Newsreader has a low x-height:
     keep titles at 72px or more. The mono stack is for code
     samples only and is not vendored.
     ============================================================ */

  @font-face {
    font-family: 'Newsreader';
    src: url('../assets/fonts/newsreader/Newsreader-Variable.woff2') format('woff2');
    font-weight: 200 800;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Source Sans 3';
    src: url('../assets/fonts/source-sans-3/SourceSans3VF-Upright.ttf.woff2') format('woff2');
    font-weight: 200 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --font-display: 'Newsreader', Georgia, serif;
    --font-sans:    'Source Sans 3', -apple-system, 'Segoe UI', Helvetica, sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }

  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: var(--slide-pad-y) var(--slide-pad-x);
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
    display: flex;
    flex-direction: column;
  }

  /* ==== Shared bits ==== */
  /* Action title: the dominant heading on every content slide,
     in the same place and size on every slide. */
  h1.action {
    font-family: var(--font-display);
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    margin: 0; max-width: 1560px;
    text-wrap: balance;
  }
  /* Footer: Source line on the left when the slide shows numbers, the
     page number on the right. No rule, no slide counter. */
  .footer {
    position: absolute;
    left: var(--slide-pad-x); right: var(--slide-pad-x); bottom: 48px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 64px;
    font-size: var(--fs-micro);
    color: var(--fg-subtle);
  }
  /* Evidence block under the action title: centered in the space
     left between title and footer. */
  .evidence { margin: auto 0; padding: 48px 0 88px; }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  .s-close { justify-content: flex-end; gap: 120px; padding-bottom: 150px; }
  .s-close h1 {
    font-family: var(--font-display);
    font-size: var(--fs-section); font-weight: var(--weight-semibold);
    line-height: var(--lh-tight); letter-spacing: var(--tracking-tight);
    margin: 0; max-width: 1680px;
    text-wrap: balance;
  }
  .s-close .contact { display: flex; gap: 120px; }
  .s-close .contact .k { font-size: var(--fs-caption); color: var(--fg-muted); margin-bottom: 8px; }
  .s-close .contact .v { font-size: var(--fs-body); color: var(--fg); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-close dark" data-screen-label="06 Closing">
    <h1>Protect the 4 remaining corridors in the 2027 budget</h1>
    <div class="contact">
      <div>
        <div class="k" data-role="label">Author</div>
        <div class="v">S. Lindqvist</div>
      </div>
      <div>
        <div class="k" data-role="label">Desk</div>
        <div class="v">Transport analytics</div>
      </div>
      <div>
        <div class="k" data-role="label">Email</div>
        <div class="v">data@brenford.example</div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
