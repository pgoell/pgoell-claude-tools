<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>18 Positioning dots (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Two axes drawn only by the four words at their ends: fast at
     the top, slow at the bottom, risky at the left, reliable at the
     right, crossing at the canvas center. No axis lines, no frame.
     Step 1 the empty field, step 2 the alternatives in
     --chart-context, step 3 the answer in the accent, alone in the
     corner the others leave empty. */
  .s-position svg { position: absolute; left: 0; top: 0; display: block; }
  .s-position svg text { font-size: var(--fs-caption); dominant-baseline: middle; text-anchor: middle; }
  .s-position svg text.axis { font-size: var(--fs-body); fill: var(--fg-muted); }
  .s-position .dot { fill: var(--chart-context); stroke: var(--bg); stroke-width: 8; }
  .s-position .name { fill: var(--fg); }
  /* Accent job: the answer. */
  .s-position .dot.hi { fill: var(--chart-highlight); }
  .s-position .name.hi { fill: var(--accent-fg); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-position dark" data-screen-label="18 Positioning dots" data-build-step="1" data-build-steps="3">
  <svg class="chart" width="1920" height="1080" role="img"
       aria-label="Speed against reliability: agencies, task forces, and big programs sit slow and risky; a team of four sits fast and reliable">
    <text class="axis" x="960" y="132">fast</text>
    <text class="axis" x="960" y="948">slow</text>
    <text class="axis" x="120" y="540" style="text-anchor: start">risky</text>
    <text class="axis" x="1800" y="540" style="text-anchor: end">reliable</text>
  </svg>
</section>
<section class="s-position dark" data-screen-label="18 Positioning dots" data-build-step="2" data-build-steps="3">
  <svg class="chart" width="1920" height="1080" role="img"
       aria-label="Speed against reliability: agencies, task forces, and big programs sit slow and risky; a team of four sits fast and reliable">
    <text class="axis" x="960" y="132">fast</text>
    <text class="axis" x="960" y="948">slow</text>
    <text class="axis" x="120" y="540" style="text-anchor: start">risky</text>
    <text class="axis" x="1800" y="540" style="text-anchor: end">reliable</text>
    <circle class="dot" cx="410" cy="640" r="124"/>
    <circle class="dot" cx="710" cy="640" r="124"/>
    <circle class="dot" cx="560" cy="860" r="124"/>
    <text class="name" x="410" y="640">Agency</text>
    <text class="name" x="710" y="640">Task force</text>
    <text class="name" x="560" y="860">Big program</text>
  </svg>
</section>
<section class="s-position dark" data-screen-label="18 Positioning dots" data-build-step="3" data-build-steps="3">
  <svg class="chart" width="1920" height="1080" role="img"
       aria-label="Speed against reliability: agencies, task forces, and big programs sit slow and risky; a team of four sits fast and reliable">
    <text class="axis" x="960" y="132">fast</text>
    <text class="axis" x="960" y="948">slow</text>
    <text class="axis" x="120" y="540" style="text-anchor: start">risky</text>
    <text class="axis" x="1800" y="540" style="text-anchor: end">reliable</text>
    <circle class="dot" cx="410" cy="640" r="124"/>
    <circle class="dot" cx="710" cy="640" r="124"/>
    <circle class="dot" cx="560" cy="860" r="124"/>
    <text class="name" x="410" y="640">Agency</text>
    <text class="name" x="710" y="640">Task force</text>
    <text class="name" x="560" y="860">Big program</text>
    <circle class="dot hi" cx="1400" cy="300" r="150"/>
    <text class="name hi" x="1400" y="300">Team of four</text>
  </svg>
</section>
</div>
</body>
</html>
