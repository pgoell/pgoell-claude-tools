<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>14 Line exits the frame (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Title in the left third; one line across the right two thirds
     with no axis, no gridlines, and no legend. The canvas is the
     frame: the line's own history sets the scale, and the story
     segment runs out through the top edge. Step 1 draws the
     history in --chart-context; step 2 adds the band and the
     story segment. The script renders both steps from the data. */
  .s-exit h1 {
    position: absolute; left: var(--slide-pad-x); top: var(--third-y);
    width: 520px;
    font-size: var(--fs-h2);
  }
  .s-exit svg { position: absolute; left: 0; top: 0; display: block; }
  .s-exit svg text { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-exit .band { fill: var(--bg-elev); }
  .s-exit .line { fill: none; stroke: var(--chart-context); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  /* Accent job: the segment that leaves the frame. */
  .s-exit .line.hi { stroke: var(--chart-highlight); stroke-width: 8; }
  .s-exit svg text.hi { fill: var(--fg); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-exit dark" data-screen-label="14 Line exits the frame" data-build-step="1" data-build-steps="2">
  <h1 class="display">Releases broke out of their range</h1>
  <svg class="chart" width="1920" height="1080" role="img" data-show="history"
       data-chart="line" data-unit="releases" data-start="2021" data-per-year="4" data-highlight-from="16"
       data-labels='["2021 Q1","2021 Q2","2021 Q3","2021 Q4","2022 Q1","2022 Q2","2022 Q3","2022 Q4","2023 Q1","2023 Q2","2023 Q3","2023 Q4","2024 Q1","2024 Q2","2024 Q3","2024 Q4","2025 Q1","2025 Q2","2025 Q3","2025 Q4"]'
       data-series='[{"name": "Releases per quarter", "values": [31, 34, 29, 33, 32, 36, 33, 35, 34, 31, 37, 35, 36, 39, 37, 41, 58, 77, 96, 118]}]'
       aria-label="Releases per quarter: between 29 and 41 every quarter from 2021 to 2024, then 58, 77, 96, and 118 in 2025"></svg>
  <p class="source" data-role="source">Releases to production per quarter. Source: Lumen release log, 2021 to 2025</p>
</section>
<section class="s-exit dark" data-screen-label="14 Line exits the frame" data-build-step="2" data-build-steps="2">
  <h1 class="display">Releases broke out of their range</h1>
  <svg class="chart" width="1920" height="1080" role="img" data-show="all"
       data-chart="line" data-unit="releases" data-start="2021" data-per-year="4" data-highlight-from="16"
       data-labels='["2021 Q1","2021 Q2","2021 Q3","2021 Q4","2022 Q1","2022 Q2","2022 Q3","2022 Q4","2023 Q1","2023 Q2","2023 Q3","2023 Q4","2024 Q1","2024 Q2","2024 Q3","2024 Q4","2025 Q1","2025 Q2","2025 Q3","2025 Q4"]'
       data-series='[{"name": "Releases per quarter", "values": [31, 34, 29, 33, 32, 36, 33, 35, 34, 31, 37, 35, 36, 39, 37, 41, 58, 77, 96, 118]}]'
       aria-label="Releases per quarter: between 29 and 41 every quarter from 2021 to 2024, then 58, 77, 96, and 118 in 2025"></svg>
  <p class="source" data-role="source">Releases to production per quarter. Source: Lumen release log, 2021 to 2025</p>
</section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      from: Number(el.dataset.highlightFrom)
    };
  }
  /* Scale: x runs from 760 to 1760 across the right two thirds;
     12px per release puts the history (29 to 41) in a calm band
     from y 792 to 648, so the 2025 values climb past the top edge
     (y 0) in Q3 and the slide clips them. */
  document.querySelectorAll('.s-exit .chart').forEach(el => {
    const d = chartData(el), v = d.series[0].values, n = v.length;
    const x0 = 760, x1 = 1760, step = (x1 - x0) / (n - 1);
    const X = i => x0 + i * step, Y = val => 780 - (val - 30) * 12;
    const pts = (a, b) => v.slice(a, b + 1).map((val, k) => X(a + k).toFixed(1) + ',' + Y(val).toFixed(1)).join(' ');
    const all = el.dataset.show === 'all', h = d.from;
    const bandL = (X(h - 1) + X(h)) / 2, bandR = x1 + step / 2;
    let out = '';
    if (all) out += '<rect class="band" x="' + bandL + '" y="0" width="' + (bandR - bandL) + '" height="880"/>';
    out += '<polyline class="line" points="' + pts(0, h - 1) + '"/>';
    if (all) out += '<polyline class="line hi" points="' + pts(h - 1, n - 1) + '"/>';
    out += '<text text-anchor="end" dominant-baseline="middle" x="' + (X(0) - 24) + '" y="' + Y(v[0]) + '">' + v[0] + '</text>';
    out += '<text x="' + X(0) + '" y="930">' + d.labels[0].slice(0, 4) + '</text>';
    if (all) {
      out += '<text class="hi" text-anchor="end" x="' + (bandL - 32) + '" y="172">' + v[n - 1] + ' in Q4</text>';
      out += '<text text-anchor="middle" x="' + ((bandL + bandR) / 2) + '" y="930">' + d.labels[n - 1].slice(0, 4) + '</text>';
    } else {
      out += '<text text-anchor="middle" x="' + X(h - 1) + '" y="930">' + d.labels[h - 1].slice(0, 4) + '</text>';
    }
    el.innerHTML = out;
  });
</script>
</body>
</html>
