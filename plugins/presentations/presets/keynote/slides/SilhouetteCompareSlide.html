<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>17 Silhouette compare (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Two side profiles overlaid on one baseline at true relative
     scale, in the right two thirds; the title in the left third.
     Step 1 draws the old device in --chart-context with its end
     thicknesses; step 2 lays the new device over it in the accent.
     Labels sit at the ends, no axis, no legend. The script draws
     both silhouettes from the data. */
  .s-silhouette h1 {
    position: absolute; left: var(--slide-pad-x); top: var(--third-y);
    width: 520px;
    font-size: var(--fs-h2);
  }
  .s-silhouette svg { position: absolute; left: 0; top: 0; display: block; }
  .s-silhouette svg text { font-size: var(--fs-caption); fill: var(--fg-muted); dominant-baseline: middle; }
  .s-silhouette .old { fill: var(--chart-context); }
  /* Accent job: the new device and its thicknesses. */
  .s-silhouette .new { fill: var(--chart-highlight); }
  .s-silhouette svg text.hi { fill: var(--accent); font-weight: var(--weight-semibold); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-silhouette dark" data-screen-label="17 Silhouette compare" data-build-step="1" data-build-steps="2">
  <h1 class="display">Now a third as thick</h1>
  <svg class="chart" width="1920" height="1080" role="img" data-show="1"
       data-chart="profile" data-unit="mm" data-length="160"
       data-labels='["thick end", "thin end"]'
       data-series='[{"name": "Old reader", "values": [42, 28]}, {"name": "New reader", "values": [14, 9]}]'
       data-highlight="1"
       aria-label="Side profiles of two card readers, both 160 mm long: the old reader is 42 mm thick at the back and 28 mm at the front, the new reader 14 mm and 9 mm"></svg>
  <p class="source" data-role="source">Side profiles at the same scale, both 160 mm long. Source: Lumen hardware spec sheets, 2025</p>
</section>
<section class="s-silhouette dark" data-screen-label="17 Silhouette compare" data-build-step="2" data-build-steps="2">
  <h1 class="display">Now a third as thick</h1>
  <svg class="chart" width="1920" height="1080" role="img" data-show="2"
       data-chart="profile" data-unit="mm" data-length="160"
       data-labels='["thick end", "thin end"]'
       data-series='[{"name": "Old reader", "values": [42, 28]}, {"name": "New reader", "values": [14, 9]}]'
       data-highlight="1"
       aria-label="Side profiles of two card readers, both 160 mm long: the old reader is 42 mm thick at the back and 28 mm at the front, the new reader 14 mm and 9 mm"></svg>
  <p class="source" data-role="source">Side profiles at the same scale, both 160 mm long. Source: Lumen hardware spec sheets, 2025</p>
</section>
</div>
<script>
  function chartData(el) {
    return {
      series: JSON.parse(el.dataset.series || '[]'),
      unit: el.dataset.unit || '',
      length: Number(el.dataset.length)
    };
  }
  /* A device profile: a wedge on the baseline from x0 to x1, back
     height hb, front height hf, top corners rounded by r, bottom
     corners by rb. The top edge is a straight taper. */
  function profile(x0, x1, base, hb, hf, r, rb) {
    const k = (hb - hf) / (x1 - x0), top = x => base - hb + (x - x0) * k;
    return 'M' + (x0 + rb) + ',' + base + ' L' + (x1 - rb) + ',' + base +
      ' Q' + x1 + ',' + base + ' ' + x1 + ',' + (base - rb) +
      ' L' + x1 + ',' + (top(x1) + r) +
      ' Q' + x1 + ',' + top(x1) + ' ' + (x1 - r) + ',' + top(x1 - r) +
      ' L' + (x0 + r) + ',' + top(x0 + r) +
      ' Q' + x0 + ',' + top(x0) + ' ' + x0 + ',' + (top(x0) + r) +
      ' L' + x0 + ',' + (base - rb) +
      ' Q' + x0 + ',' + base + ' ' + (x0 + rb) + ',' + base + ' Z';
  }
  /* Scale: 160 mm spans x 820 to 1640 (5.125 px per mm); the
     shared baseline is the lower thirds line, y 720. */
  document.querySelectorAll('.s-silhouette .chart').forEach(el => {
    const d = chartData(el), x0 = 820, x1 = 1640, base = 720, s = (x1 - x0) / d.length;
    const [old, nu] = d.series.map(p => p.values.map(v => v * s));
    const u = ' ' + d.unit, ov = d.series[0].values, nv = d.series[1].values;
    let out = '<path class="old" d="' + profile(x0, x1, base, old[0], old[1], 28, 10) + '"/>';
    out += '<text text-anchor="end" x="' + (x0 - 28) + '" y="' + (base - old[0] + 24) + '">' + ov[0] + u + '</text>';
    out += '<text x="' + (x1 + 28) + '" y="' + (base - old[1] + 24) + '">' + ov[1] + u + '</text>';
    if (el.dataset.show === '2') {
      out += '<path class="new" d="' + profile(x0, x1, base, nu[0], nu[1], nu[1] / 2, 6) + '"/>';
      out += '<text class="hi" text-anchor="end" x="' + (x0 - 28) + '" y="' + (base - nu[0] / 2) + '">' + nv[0] + u + '</text>';
      out += '<text class="hi" x="' + (x1 + 28) + '" y="' + (base - nu[1] / 2) + '">' + nv[1] + u + '</text>';
    }
    el.innerHTML = out;
  });
</script>
</body>
</html>
