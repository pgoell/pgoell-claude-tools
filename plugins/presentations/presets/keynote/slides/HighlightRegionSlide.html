<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>15 Highlight region (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* One image, centered at 70% of the width, never dimmed. Each
     step outlines one region in the accent and names it in the
     caption under the image, at body size as on ImageSlide; the previous outline goes, so the
     accent marks one thing at a time.
     IMAGE SLOT: set data-image on .image-slot to a relative path
     and the script paints it over the placeholder. Move each
     .region (left, top, width, height in % of the image) onto the
     part of the real photo the speaker points at. */
  .s-region .image-slot {
    position: absolute; left: 288px; top: var(--slide-pad-y);
    width: 1344px; height: 756px;
    background: var(--image, none) center / cover no-repeat, var(--image-placeholder);
    background-size: cover, 240px 240px, auto, auto, auto, auto, auto;
  }
  .s-region .region {
    position: absolute;
    border: 4px solid var(--border-accent); border-radius: var(--r-sm);
  }
  .s-region .caption {
    position: absolute; left: 288px; top: 884px;
    font-size: var(--fs-body); line-height: var(--lh-snug); color: var(--fg);
  }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-region dark" data-screen-label="15 Highlight region image" data-build-step="1" data-build-steps="3">
  <!-- IMAGE SLOT: placeholder until data-image names a real photo -->
  <figure class="image-slot" data-image="" data-placeholder="image"
          role="img" aria-label="The printed launch plan for the checkout redesign, pinned to a wall">
  </figure>
  <p class="caption">The checkout launch plan, week one</p>
</section>
<section class="s-region dark" data-screen-label="15 Highlight region image" data-build-step="2" data-build-steps="3">
  <!-- IMAGE SLOT: placeholder until data-image names a real photo -->
  <figure class="image-slot" data-image="" data-placeholder="image"
          role="img" aria-label="The printed launch plan for the checkout redesign, pinned to a wall">
    <div class="region" style="left: 7%; top: 12%; width: 30%; height: 24%;"></div>
  </figure>
  <p class="caption">Four sign-offs before any code</p>
</section>
<section class="s-region dark" data-screen-label="15 Highlight region image" data-build-step="3" data-build-steps="3">
  <!-- IMAGE SLOT: placeholder until data-image names a real photo -->
  <figure class="image-slot" data-image="" data-placeholder="image"
          role="img" aria-label="The printed launch plan for the checkout redesign, pinned to a wall">
    <div class="region" style="left: 55%; top: 60%; width: 36%; height: 22%;"></div>
  </figure>
  <p class="caption">The launch date, moved twice</p>
</section>
</div>
<script>
  /* Image slot: data-image="assets/<file>.jpg" swaps the
     placeholder for the real photo. */
  document.querySelectorAll('.image-slot[data-image]').forEach(el => {
    if (el.dataset.image) {
      el.style.setProperty('--image', 'url("' + el.dataset.image + '")');
      el.removeAttribute('data-placeholder');
    }
  });
</script>
</body>
</html>
