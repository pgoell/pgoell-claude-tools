<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>16 Replace build (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Replacement, not accumulation. Steps 1 to 3 put one part dead
     center with one line under it, each step replacing the last in
     the same place; step 4 sets the three parts in one centered
     row; step 5 names the whole, alone. No accent: the repetition
     is the build. */
  .s-replace .one {
    position: absolute; left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: 50%; transform: translateY(-50%);
    text-align: center;
  }
  .s-replace .one h1 { font-size: var(--fs-statement); }
  .s-replace .one p {
    margin-top: 32px;
    font-size: var(--fs-body); line-height: var(--lh-normal); color: var(--fg-muted);
  }
  .s-replace .row {
    position: absolute; left: var(--slide-pad-x); right: var(--slide-pad-x);
    top: 50%; transform: translateY(-50%);
    display: flex; justify-content: center; gap: 96px;
  }
  .s-replace .row p {
    font-size: var(--fs-h2); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight);
  }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-replace dark" data-screen-label="16 Replace build" data-build-step="1" data-build-steps="5">
  <div class="one">
    <h1 class="display">Designer</h1>
    <p>draws it with the customer</p>
  </div>
</section>
<section class="s-replace dark" data-screen-label="16 Replace build" data-build-step="2" data-build-steps="5">
  <div class="one">
    <h1 class="display">Two engineers</h1>
    <p>build it and run it</p>
  </div>
</section>
<section class="s-replace dark" data-screen-label="16 Replace build" data-build-step="3" data-build-steps="5">
  <div class="one">
    <h1 class="display">Owner</h1>
    <p>decides and answers for it</p>
  </div>
</section>
<section class="s-replace dark" data-screen-label="16 Replace build" data-build-step="4" data-build-steps="5">
  <div class="row">
    <p>Designer</p>
    <p>Two engineers</p>
    <p>Owner</p>
  </div>
</section>
<section class="s-replace dark" data-screen-label="16 Replace build" data-build-step="5" data-build-steps="5">
  <div class="one">
    <h1 class="display">One team</h1>
  </div>
</section>
</div>
</body>
</html>
