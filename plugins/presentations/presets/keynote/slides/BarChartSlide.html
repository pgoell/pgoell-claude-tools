<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 Bar chart</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Title in the left third, three columns in the right two
     thirds, all standing on the lower thirds line plus one row.
     Values sit on the columns, names under them; no axis, no
     gridlines, no legend. */
  .s-bar h1 {
    position: absolute; left: var(--slide-pad-x); top: var(--third-y);
    width: 520px;
    font-size: var(--fs-h2);
  }
  .s-bar svg { position: absolute; left: 700px; top: 120px; display: block; overflow: visible; }
  .s-bar svg text { font-size: var(--fs-caption); fill: var(--fg-muted); }
  .s-bar svg text.val { font-size: var(--fs-body); font-weight: var(--weight-semibold); fill: var(--fg-muted); }
  .s-bar svg text.hi { fill: var(--fg); }
  .s-bar .bar { fill: var(--chart-context); }
  /* Accent job: the one column the title names. */
  .s-bar .bar.hi { fill: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-bar dark" data-screen-label="04 Bar chart">
  <h1 class="display">Teams of four shipped twice as fast</h1>
  <svg class="chart" width="1100" height="840" role="img"
       aria-label="Median weeks from kickoff to launch: 6 for teams of 4, 12 for teams of 8, 15 for teams of 12"
       data-chart="bar" data-orientation="vertical" data-unit="weeks"
       data-labels='["4 people", "8 people", "12 people"]'
       data-series='[{"name": "Median weeks from kickoff to launch", "values": [6, 12, 15]}]'
       data-highlight="0"></svg>
  <p class="source" data-role="source">Median weeks from kickoff to launch. Source: Lumen launch log, 40 launches, 2023 to 2025</p>
</section>
</div>
<script>
  function chartData(el) {
    return {
      labels: JSON.parse(el.dataset.labels || '[]'),
      series: JSON.parse(el.dataset.series || '[]'),
      highlight: el.dataset.highlight === undefined ? -1 : Number(el.dataset.highlight),
      unit: el.dataset.unit || ''
    };
  }
  (function () {
    const el = document.querySelector('.s-bar .chart');
    const d = chartData(el), v = d.series[0].values;
    const base = 700, H = 560, colW = 240, step = 360, max = Math.max(...v);
    let out = '';
    v.forEach((val, i) => {
      const x = i * step, h = val / max * H, hi = i === d.highlight ? ' hi' : '';
      out += '<rect class="bar' + hi + '" x="' + x + '" y="' + (base - h) + '" width="' + colW + '" height="' + h + '"/>';
      out += '<text class="val' + hi + '" x="' + x + '" y="' + (base - h - 28) + '">' + val + ' ' + d.unit + '</text>';
      out += '<text class="' + hi + '" x="' + x + '" y="' + (base + 64) + '">' + d.labels[i] + '</text>';
    });
    el.innerHTML = out;
  })();
</script>
</body>
</html>
