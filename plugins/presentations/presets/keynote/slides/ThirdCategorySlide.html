<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>13 Third category (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Two known things stand in the outer thirds; two hairlines on
     the vertical thirds lines frame the middle third as a stage.
     The frame never moves: only the middle changes, step by step.
     Step 1 a question mark, steps 2 to 4 the criteria as a line
     build (earlier lines dim), step 5 the wrong answer in
     --fg-subtle, step 6 the answer in the accent.
     IMAGE SLOTS: set data-image on each .image-slot to a relative
     path and the script paints it over the placeholder. */
  .s-third .rule {
    position: absolute; top: var(--slide-pad-y); bottom: var(--slide-pad-y);
    width: 2px; background: var(--border-strong);
  }
  .s-third .rule.l { left: calc(var(--third-x) - 1px); }
  .s-third .rule.r { left: calc(2 * var(--third-x) - 1px); }
  .s-third .known { position: absolute; top: var(--third-y); width: 400px; margin: 0; }
  .s-third .known.l { left: 180px; }
  .s-third .known.r { left: 1340px; }
  .s-third .image-slot {
    height: 300px; border-radius: var(--r-md);
    background: var(--image, none) center / cover no-repeat, var(--image-placeholder);
    background-size: cover, 240px 240px, auto, auto, auto, auto, auto;
  }
  .s-third .known figcaption {
    margin-top: 32px; text-align: center;
    font-size: var(--fs-caption); color: var(--fg-muted);
  }
  .s-third .mid {
    position: absolute; left: var(--third-x); width: var(--third-x);
    top: 50%; transform: translateY(-50%);
    display: flex; justify-content: center;
  }
  .s-third .mid .word {
    font-size: var(--fs-statement); line-height: 1; color: var(--fg);
  }
  .s-third .mid .word.wrong { color: var(--fg-subtle); }
  /* Accent job: the answer. */
  .s-third .mid .word.answer { color: var(--accent); }
  .s-third .mid ol {
    list-style: none; padding: 0;
    display: flex; flex-direction: column; gap: 40px;
  }
  .s-third .mid li {
    font-size: var(--fs-body); line-height: var(--lh-normal); color: var(--fg-subtle);
  }
  .s-third .mid li[aria-current] { color: var(--fg); }
  /* Lines not yet built hold their place, so earlier lines never
     move between steps. */
  .s-third .mid li.later { visibility: hidden; }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>

<script>
  /* Image slot: data-image="assets/<file>.jpg" swaps the
     placeholder for the real photo. */
  document.querySelectorAll('.image-slot[data-image]').forEach(el => {
    if (el.dataset.image) {
      el.style.setProperty('--image', 'url("' + el.dataset.image + '")');
      el.removeAttribute('data-placeholder');
    }
  });
</script>
