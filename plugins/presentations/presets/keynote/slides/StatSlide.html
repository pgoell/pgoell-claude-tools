<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 Stat</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Before and after as two numbers on the thirds lines: the old
     number dimmed on the left line, the new one in the accent on
     the right line, both standing on the lower thirds line. */
  .s-stat h1 {
    position: absolute; left: var(--slide-pad-x); top: var(--slide-pad-y);
    font-size: var(--fs-h1);
  }
  .s-stat .pair { position: absolute; top: 330px; left: 0; right: 0; }
  .s-stat .fig { position: absolute; }
  .s-stat .fig.before { left: var(--third-x); }
  .s-stat .fig.after { left: calc(2 * var(--third-x)); }
  .s-stat .num {
    font-size: var(--fs-hero); font-weight: var(--weight-semibold);
    line-height: 1; letter-spacing: var(--tracking-tight);
  }
  .s-stat .before .num { color: var(--fg-subtle); }
  /* Accent job: the new number. */
  .s-stat .after .num { color: var(--accent); }
  .s-stat .label {
    margin-top: 16px;
    font-size: var(--fs-caption); color: var(--fg-muted);
  }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-stat dark" data-screen-label="05 Stat">
  <h1 class="display">Launch time halved</h1>
  <div class="pair">
    <div class="fig before">
      <div class="num">12</div>
      <p class="label">weeks with eight people</p>
    </div>
    <div class="fig after">
      <div class="num">6</div>
      <p class="label">weeks with four people</p>
    </div>
  </div>
  <p class="source" data-role="source">Median weeks from kickoff to launch. Source: Lumen launch log, 40 launches, 2023 to 2025</p>
</section>
</div>
</body>
</html>
