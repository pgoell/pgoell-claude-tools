<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 Image</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Full-bleed image slot with a caption on a bottom scrim.
     IMAGE SLOT: set data-image on .image-slot to a relative path
     (at least 1920x1080) and the script below paints it over the
     placeholder. With no data-image, --image-placeholder paints a
     dim stage-lit frame; never ship a deck with the placeholder
     showing. */
  .s-image .image-slot {
    position: absolute; inset: 0;
    background: var(--image, none) center / cover no-repeat, var(--image-placeholder);
    background-size: cover, 240px 240px, auto, auto, auto, auto, auto;
  }
  .s-image .scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 360px;
    background: linear-gradient(0deg, var(--scrim) 0%, var(--scrim) 45%, rgba(12, 12, 14, 0) 100%);
  }
  .s-image .caption {
    position: absolute; left: var(--slide-pad-x); right: var(--third-x);
    bottom: var(--slide-pad-y);
    font-size: var(--fs-body); line-height: var(--lh-snug); color: var(--fg);
  }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-image dark" data-screen-label="09 Image">
  <!-- IMAGE SLOT: placeholder until data-image names a real photo -->
  <figure class="image-slot" data-image="" data-placeholder="image"
          role="img" aria-label="The payments team at their desks on launch day"></figure>
  <div class="scrim"></div>
  <p class="caption">The payments team of four on launch day, week six</p>
</section>
</div>
<script>
  /* Image slot: data-image="assets/launch-day.jpg" swaps the
     placeholder for the real photo. */
  document.querySelectorAll('.image-slot[data-image]').forEach(el => {
    if (el.dataset.image) {
      el.style.setProperty('--image', 'url("' + el.dataset.image + '")');
      el.removeAttribute('data-placeholder');
    }
  });
</script>
</body>
</html>
