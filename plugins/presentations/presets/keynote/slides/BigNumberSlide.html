<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>08 Big number</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* One number at --fs-mega, spanning about 80% of the width,
     centered; one line of context under it. Size the number to
     the width: a 3 to 4 character number at --fs-mega spans
     about 1400 to 1600px. */
  .s-big .num {
    position: absolute; left: 0; right: 0; top: 40px;
    text-align: center;
    font-size: var(--fs-mega); font-weight: var(--weight-semibold);
    line-height: 0.95; letter-spacing: -0.04em;
  }
  /* Accent job: the number is the slide. */
  .s-big .num { color: var(--accent); }
  .s-big .context {
    position: absolute; left: 0; right: 0; top: 760px;
    text-align: center;
    font-size: var(--fs-body); color: var(--fg-muted);
  }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-big dark" data-screen-label="08 Big number">
  <div class="num">85%</div>
  <p class="context">of launches by teams of four shipped on the date they set</p>
  <p class="source" data-role="source">Source: Lumen launch log, 17 of 20 launches by teams of four, 2023 to 2025</p>
</section>
</div>
</body>
</html>
