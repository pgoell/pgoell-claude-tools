<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 Content (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* A build, not a list. The same slide repeats once per line;
     each copy adds the next line and dims the ones before it.
     This file shows the last step. Lines hang from the left
     thirds line, centered on the canvas height; no markers. */
  .s-content .build {
    list-style: none; padding: 0;
    position: absolute; left: var(--third-x); right: var(--slide-pad-x);
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 56px;
  }
  .s-content .build li {
    font-size: var(--fs-h1); font-weight: var(--weight-semibold);
    line-height: var(--lh-tight); letter-spacing: var(--tracking-tight);
    color: var(--fg-subtle);
  }
  .s-content .build li[aria-current] { color: var(--fg); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-content dark" data-screen-label="03 Content build" data-build-step="3" data-build-steps="3">
  <ol class="build">
    <li>Four people</li>
    <li>One owner</li>
    <li aria-current="step">A demo every Friday</li>
  </ol>
</section>
</div>
</body>
</html>
