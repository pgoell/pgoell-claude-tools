<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>19 Unit grid (build)</title>
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../typography.css">
<style>
  /* ==== Standalone viewer shell ==== */
  html, body { margin: 0; height: 100vh; background: #000; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .frame {
    position: absolute;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  .frame > section {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--font-sans);
    font-weight: var(--weight-regular);
  }

  /* ==== Shared bits (keynote layout grammar) ==== */
  /* Everything is placed absolutely on the thirds grid
     (--third-x, --third-y) or dead center; there is no header
     band, no footer band, and no page number. */
  h1, p, blockquote, figure, ol { margin: 0; }
  .display {
    font-family: var(--font-display);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
    text-wrap: balance;
  }
  /* Source line: bottom left at --fs-micro, only on slides that
     show a number. It is the only small text the preset allows. */
  .source {
    position: absolute; left: var(--slide-pad-x); bottom: 64px;
    font-size: var(--fs-micro); color: var(--fg-subtle);
  }
  /* Numbers align: tabular lining figures in charts and big numbers. */
  .chart, .num { font-variant-numeric: tabular-nums lining-nums; }

  /* ==== This slide ==== */
  /* Every unit drawn, nothing else: 480 hollow squares fill the
     canvas inside the margins, one per person-day a team of eight
     spends on a twelve-week launch (8 x 12 x 5). No title, no
     caption, no number: the count carries the slide while the
     speaker talks. Step 2 fills the 120 person-days a team of four
     needs (4 x 6 x 5), as whole columns from the left. The script
     draws the grid from the data. */
  .s-units svg { position: absolute; left: 0; top: 0; display: block; }
  .s-units .unit { fill: none; stroke: var(--fg-subtle); stroke-width: 2; }
  /* Accent job: the units the speaker names. */
  .s-units .unit.hi { fill: var(--chart-highlight); stroke: var(--chart-highlight); }
</style>
<script>
  function fit() {
    const f = document.querySelector('.frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = 'scale(' + s + ')';
    const sw = 1920 * s, sh = 1080 * s;
    f.style.left = ((window.innerWidth - sw) / 2) + 'px';
    f.style.top  = ((window.innerHeight - sh) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
</script>
</head>
<body>
<div class="frame">
<section class="s-units dark" data-screen-label="19 Unit grid" data-build-step="1" data-build-steps="2">
  <svg class="chart" width="1920" height="1080" role="img" data-units="480" data-cols="32" data-highlight="0"
       aria-label="480 empty squares, one per person-day of a twelve-week launch by a team of eight"></svg>
</section>
<section class="s-units dark" data-screen-label="19 Unit grid" data-build-step="2" data-build-steps="2">
  <svg class="chart" width="1920" height="1080" role="img" data-units="480" data-cols="32" data-highlight="120"
       aria-label="480 squares, one per person-day of a twelve-week launch by a team of eight; the first 120, what a team of four needed, are filled"></svg>
</section>
</div>
<script>
  /* Grid: the columns span the 1680px measure from x 120; the
     rows center vertically. Units fill column by column, so the
     highlight reads as a solid block of whole columns. */
  document.querySelectorAll('.s-units .chart').forEach(el => {
    const n = Number(el.dataset.units), cols = Number(el.dataset.cols), hi = Number(el.dataset.highlight);
    const rows = Math.ceil(n / cols), pitch = 1680 / cols, size = pitch - 12;
    const top = (1080 - rows * pitch) / 2 + 6;
    let out = '';
    for (let k = 0; k < n; k++) {
      const c = Math.floor(k / rows), r = k % rows;
      out += '<rect class="unit' + (k < hi ? ' hi' : '') + '" x="' + (120 + 6 + c * pitch).toFixed(1) +
        '" y="' + (top + r * pitch).toFixed(1) + '" width="' + size.toFixed(1) + '" height="' + size.toFixed(1) + '" rx="2"/>';
    }
    el.innerHTML = out;
  });
</script>
</body>
</html>
