[default.extend-words]
mise = "mise"
cocogitto = "cocogitto"
dprint = "dprint"
lefthook = "lefthook"
gws = "gws"
acli = "acli"
# Legitimate hyphen-prefixed compounds ("mis-formatting", "mis-teaches");
# typos' tokenizer splits on the hyphen and flags the prefix alone.
mis = "mis"
# "CRDTs over OT" - OT (Operational Transform) is a real technical term.
OT = "OT"
# "PNGs" gets split as "PN" + "Gs" by the tokenizer.
PN = "PN"
# Accepted alternate spellings used intentionally and consistently.
unparseable = "unparseable"
writeable = "writeable"
driveable = "driveable"
# CSS class name in a reference HTML template, not an English word.
ba = "ba"
# PPTX chart-series XML element (`c:ser`); the tokenizer splits on the colon.
ser = "ser"
# Company name (Canva pitch deck) cited as a slide reference.
Canva = "Canva"
# German month name in the news plugin's date examples ("7. Oktober 2026").
Oktober = "Oktober"

[files]
# The news designs print German page chrome ("Foto", "Juli", "Sie"), which an
# English spell check cannot read.
extend-exclude = ["plugins/news/skills/edition/designs/*/template.html.j2"]
