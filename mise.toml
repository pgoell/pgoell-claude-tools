[settings]
minimum_release_age = "60d"
lockfile = true

[tools]
lefthook = "latest"
cocogitto = "latest"
jq = "latest"
dprint = "latest"
lychee = "latest"
typos = "latest"

[hooks]
postinstall = "lefthook install"

[tasks.format]
description = "Format JSON, Markdown, and TOML with dprint"
run = "dprint fmt"

[tasks.lint]
description = "Check formatting, validate all tracked JSON files, and check file size"
run = ["dprint check", "git ls-files '*.json' | xargs jq empty", "mise-tasks/check-file-size"]

[tasks.check-commits]
description = "Verify commits since origin/master are conventional"
# Exclude merge commits from validation, as they are auto-generated by
# GitHub with messages that don't follow conventional commit format
# (e.g., "Merge pull request #123 from ...").
run = '''
COMMITS=$(git rev-list --no-merges origin/master..HEAD)
if [ -n "$COMMITS" ]; then
  echo "$COMMITS" | while read COMMIT; do
    cog check "$COMMIT^..$COMMIT" || exit 1
  done
else
  echo "No non-merge commits ahead of origin/master, nothing to check"
fi
'''

[tasks.check-docs]
description = "Validate documentation links and spelling"
# docs/ links between its own pages bundle-relative (/reference/...), so it
# gets its own lychee run rooted at docs/.
run = [
  "lychee README.md AGENTS.md plugins/ --offline --root-dir .",
  "lychee docs/ --offline --root-dir docs",
  "typos README.md AGENTS.md plugins/ docs/",
]
