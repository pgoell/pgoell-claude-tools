pre-commit:
  # Not parallel: file-size must size what format re-staged.
  skip: [merge, rebase]
  jobs:
    - name: format
      glob: "*.{json,md,toml}"
      run: mise exec -- dprint fmt {staged_files}
      stage_fixed: true
    - name: validate-json
      glob: "*.json"
      run: mise exec -- jq empty {staged_files}
    - name: file-size
      run: mise-tasks/check-file-size {staged_files}
    - name: fan-out
      run: mise-tasks/check-fan-out {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: mise exec -- cog verify --file {1}

pre-push:
  jobs:
    - name: lint
      run: mise run lint
    - name: check-commits
      run: mise run check-commits
    - name: check-plugin-versions
      run: mise run check-plugin-versions
    - name: validate-plugin-schema
      run: mise run validate-plugin-schema
